# Every town's daily update, build, checks, and publish, and the homepage.
# The work is done by the engine (pipeline/network.py) at the version in
# engine-version; this file only decides what runs when.
#
#   schedule   Daily runs, started on time every hour of the morning by the
#              publick-scheduler Worker (wrangler.scheduler.toml; a
#              workflow_dispatch with daily), with one GitHub schedule as a
#              backup, since GitHub starts scheduled runs late or not at all.
#              A daily run takes the towns that are due: those whose last
#              fetching run finished more than DUE_HOURS ago, oldest first. So
#              a late or doubled start does no harm (a start with nothing due
#              does nothing), and the next run makes up a missed one.
#              Fetches, builds, checks, publishes, commits data.
#              The browser (accessibility) checks run on a sample of each
#              town's pages: every hand-written page, and the first and largest
#              of each kind of record page (the engine's site_checks/pages.py).
#              Then republishes the homepage, for its status page (publick.org/status/).
#   push       Rebuilds and publishes the towns a change touched (all of them
#              when engine-version or a workflow changed), records that in each
#              town's run record (data/run.json), and rebuilds the homepage and
#              its status page. No fetching. The browser checks run on a
#              sample of pages: the pull request already checked every one.
#              It first waits for a daily or manual run in progress, which
#              publishes its towns before it commits their data: built from
#              the branch meanwhile, a town would go back to older data.
#   pull_request  Builds and checks every page of the towns a change touches.
#              Nothing is published.
#   workflow_dispatch  Any towns, with or without fetching, and with a choice of
#              which data to fetch (figures alone takes minutes; 311 is the slow
#              part). With fetching, pages are sampled as on a daily run;
#              without, every page is checked.
#
# A run that fetches doesn't fail when a town does: the town's data is still
# committed, and one GitHub issue, opened or updated after each daily run and
# assigned to ALERT_ASSIGNEE, lists the towns without a good update in 30
# hours. It's closed when every town is caught up. A pull request's run fails
# if any town does, so a broken site can't be merged.
#
# AI summaries share one monthly budget, SUMMARY_BUDGET dollars: the plan job
# adds up what every town spent this month (towns/*/data/summary-costs.json)
# and gives each town in the run its share of what's left.
#
# Scheduled runs put four towns in a job, so Python and the browser are
# installed once for all four, with the slow towns spread over the jobs by how
# long each took last time (the engine's plan). Each town's data is committed
# as soon as it's done, so a job that dies (its runner lost, as on 2026-10-07)
# loses only the town it was on. Other runs are small, so each town gets its own
# job and they run side by side. Within a job, the browser checks use every core.
name: Network

on:
  # A backup for the scheduler Worker's starts. Towns are picked by need, so this only matters when
  # the Worker's didn't happen; it's late in the morning's starts, so it finds what they missed.
  schedule:
    - cron: "17 12 * * *"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      daily:
        description: A daily run, as scheduled (the towns that are due; the other choices are ignored)
        type: boolean
        default: false
      towns:
        description: Town folders, comma-separated (empty for every town)
        type: string
        default: ""
      fetch:
        description: Fetch new data first
        type: boolean
        default: true
      sources:
        description: Which data to fetch (figures is tax, budget, schools, unemployment, housing, and permits)
        type: choice
        options: [all, figures, meetings, "311"]
        default: all
      catch_up:
        description: "For a new town's first runs: dollars its older documents may use for summaries in this run (empty for the usual share). Capped by what's left of the month's budget and the town's own limit per run"
        type: string
        default: ""

# Scheduled and manual runs queue behind each other, so two data commits for a
# town never race; pushes queue separately (a daily start would replace a push waiting in the same
# queue, and it would never publish), and wait in their plan job for a daily or manual run in progress;
# a pull request's newer run replaces its older one.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('network-pr-{0}', github.event.number) || (github.event_name == 'push' && 'network-push' || 'network-update') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Towns per job on a scheduled run. Each job installs Python and the browser for the checks once, then runs
  # its towns in turn. Other runs have one town per job.
  BATCH_SIZE: 4
  # The network's monthly budget for AI summaries and translations, in dollars, shared by every town.
  SUMMARY_BUDGET: "80"
  # A month with a budget of its own, as YYYY-MM=dollars (empty for none).
  SUMMARY_BUDGET_MONTH: ""
  # Who the daily issue for towns that need attention is assigned to, so it reaches them.
  ALERT_ASSIGNEE: NasTber
  # A daily run takes the towns whose last fetching run finished more than this many hours ago.
  DUE_HOURS: "18"
  PYTHONPATH: ${{ github.workspace }}/.publick-engine

jobs:
  plan:
    runs-on: ubuntu-latest
    # A push may wait here for a daily run (see the first step).
    timeout-minutes: 350
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      towns: ${{ steps.plan.outputs.towns }}
      fetch: ${{ steps.plan.outputs.fetch }}
      sources: ${{ steps.plan.outputs.sources }}
      deploy: ${{ steps.plan.outputs.deploy }}
      home: ${{ steps.plan.outputs.home }}
      prune: ${{ steps.plan.outputs.prune }}
      sample: ${{ steps.plan.outputs.sample }}
      summary_allowance: ${{ steps.budget.outputs.allowance }}
      summary_backlog_allowance: ${{ steps.budget.outputs.backlog_allowance }}
      engine: ${{ steps.engine.outputs.ref }}
    steps:
      # A push waits for a daily or manual run in progress. That run publishes each town before it commits
      # the town's data, so a push building from the branch meanwhile would put older data back on the
      # town's site. After the wait, the jobs below start from the branch with the data that run committed.
      # A queued run isn't waited for: it starts from the branch as it is, and publishes after this one.
      - name: Wait for a daily or manual run in progress
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          # Past a daily run's time limit; after this, publish anyway.
          WAIT_MINUTES: 320
        run: |
          deadline=$(( $(date +%s) + WAIT_MINUTES * 60 ))
          while :; do
            running=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow network.yml --status in_progress \
              --json event --jq '[.[] | select(.event == "schedule" or .event == "workflow_dispatch")] | length')
            [ "$running" = 0 ] && break
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::warning::A daily or manual run was still in progress after $WAIT_MINUTES minutes; publishing anyway."
              break
            fi
            echo "Waiting for $running daily or manual run(s) in progress."
            sleep 60
          done

      # The towns' config files, summary costs, and run records: enough to list them, pick the ones that
      # are due, and share out the summary budget, without downloading any town's data. Outside a pull
      # request, the branch as it is when the run starts, not when it was queued: a run that waited
      # behind another sees the towns that one just updated.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name != 'pull_request' && github.ref || '' }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /engine-version
            /towns/*/config/
            /towns/*/data/summary-costs.json
            /towns/*/data/run.json

      - id: engine
        run: echo "ref=$(tr -d '[:space:]' < engine-version)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: publick-org/publick-engine
          ref: ${{ steps.engine.outputs.ref }}
          path: .publick-engine

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          DAILY: ${{ inputs.daily }}
          TOWNS: ${{ inputs.towns }}
          FETCH: ${{ inputs.fetch }}
          SOURCES: ${{ inputs.sources || 'all' }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          batch=1; fetch=false; deploy=true; home=false; prune=false; sample=false; sources=all; daily=false
          [ "$EVENT" = schedule ] || { [ "$EVENT" = workflow_dispatch ] && [ "$DAILY" = true ]; } && daily=true
          case "$EVENT" in
            schedule | workflow_dispatch)
              if [ "$daily" = true ]; then
                args+=(--due-hours "$DUE_HOURS")
                batch="$BATCH_SIZE"
                fetch=true
                sample=true
              else
                [ -n "$TOWNS" ] && args+=(--towns "$TOWNS") || home=true
                fetch="$FETCH"
                # A fetching run is checked as a daily run is; a rebuild alone checks every page.
                [ "$fetch" = true ] && sample=true && sources="$SOURCES"
              fi
              ;;
            push | pull_request)
              since="$BEFORE"; [ "$EVENT" = pull_request ] && since="$BASE"
              # A push counts every change since the last push run that published, not just its own: a push
              # waiting in the queue is replaced by a newer one (and waits longer behind a daily run).
              if [ "$EVENT" = push ]; then
                last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow network.yml --branch main --event push \
                  --status success --limit 1 --json headSha --jq '.[0].headSha // empty' || true)
                [ -n "$last" ] && since="$last"
              fi
              if [ -z "$since" ] || [ "$since" = 0000000000000000000000000000000000000000 ]; then
                # A new branch: nothing to compare with, so everything counts as changed.
                git ls-files > changed.txt
              else
                git fetch --quiet --depth=1 origin "$since"
                git diff --name-only "$since" HEAD > changed.txt
              fi
              args+=(--changed changed.txt)
              grep -qE '^(home|scripts)/|^towns/[^/]+/config/' changed.txt && home=true
              # A pull request checks every page, and builds the homepage to check it, but publishes nothing.
              # After it merges, the push checks a sample: the pages were checked on the pull request.
              if [ "$EVENT" = pull_request ]; then deploy=false; else sample=true; fi
              ;;
          esac
          matrix=$(python -m pipeline.network plan "${args[@]}" --batch-size "$batch")
          echo "$matrix"
          any=$([ "$matrix" = '{"include": []}' ] && echo false || echo true)
          # A run that fetches records each town's result (data/run.json), and one that publishes without fetching
          # records that it did; the homepage's status page shows them.
          [ "$fetch" = true ] && [ "$any" = true ] && home=true
          [ "$deploy" = true ] && [ "$any" = true ] && home=true
          # A daily run that did something: delete old builds and unused files.
          [ "$daily" = true ] && [ "$any" = true ] && prune=true
          {
            echo "matrix=$matrix"
            echo "towns=$any"
            echo "fetch=$fetch"
            echo "sources=$sources"
            echo "deploy=$deploy"
            echo "home=$home"
            echo "prune=$prune"
            echo "sample=$sample"
          } >> "$GITHUB_OUTPUT"

      # Each town's share, for this run, of what's left of the month's summary budget. Only a run that
      # fetches makes summaries.
      - id: budget
        if: steps.plan.outputs.fetch == 'true' && steps.plan.outputs.towns == 'true'
        env:
          MATRIX: ${{ steps.plan.outputs.matrix }}
          # A manual run's catch-up for older documents (a new town's first months), never above its
          # share of what's left of the month.
          CATCH_UP: ${{ github.event_name == 'workflow_dispatch' && !inputs.daily && inputs.catch_up || '' }}
        run: |
          towns=$(jq '[.include[].towns | split(" ")[]] | length' <<< "$MATRIX")
          monthly="$SUMMARY_BUDGET"
          [ "${SUMMARY_BUDGET_MONTH%%=*}" = "$(date -u +%Y-%m)" ] && monthly="${SUMMARY_BUDGET_MONTH#*=}"
          budget=$(python -m pipeline.network budget --monthly "$monthly" --towns-in-run "$towns")
          echo "$budget"
          allowance=$(jq -r .allowance <<< "$budget")
          backlog=$(jq -r .backlog_allowance <<< "$budget")
          if [ -n "$CATCH_UP" ]; then
            backlog=$(python -c 'import sys; print(round(min(float(sys.argv[1]), float(sys.argv[2])), 2))' "$CATCH_UP" "$allowance")
            echo "Catch-up: older documents may use \$$backlog in this run"
          fi
          {
            echo "allowance=$allowance"
            echo "backlog_allowance=$backlog"
          } >> "$GITHUB_OUTPUT"

  # Statewide sources (Massachusetts's DLS reports), fetched once for every town before the towns run, into
  # states/: only exports that aren't saved or are over a week old, so most runs ask for nothing. A failure is
  # recorded in states/<state>/status.json (the daily issue lists a state that keeps failing), and the towns run
  # with what was saved.
  states:
    needs: plan
    if: needs.plan.outputs.towns == 'true' && needs.plan.outputs.fetch == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # With its token saved in git's config: the commit step pushes with it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /towns/*/config/
            /states/

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: publick-org/publick-engine
          ref: ${{ needs.plan.outputs.engine }}
          path: .publick-engine

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .publick-engine/requirements*.txt

      - run: pip install -r .publick-engine/requirements.txt

      - name: Fetch statewide sources
        run: python -m pipeline.network states

      - name: Commit them
        env:
          COMMIT_ATTEMPTS: 10
        run: .publick-engine/.github/scripts/commit-data.sh "Update statewide sources" states

  towns:
    needs: [plan, states]
    # The towns run whether the statewide step ran, was skipped (a pull request, a rebuild), or failed.
    if: ${{ !cancelled() && needs.plan.outputs.towns == 'true' }}
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Stays well under the organization's limit on jobs running at once.
      max-parallel: 10
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # Only this batch's towns are checked out, so a job's checkout stays small however many towns there are.
      # Outside a pull request, the branch as it is when the job starts, not when the run was queued: a run
      # that waited behind another starts from that run's data rather than replaying over it. The token is
      # saved in git's config only where the commit steps push with it, not on a pull request's run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: ${{ github.event_name != 'pull_request' }}
          ref: ${{ github.event_name != 'pull_request' && github.ref || '' }}
          filter: blob:none
          sparse-checkout: .github

      # This batch's towns, and the statewide sources their steps read (states/).
      - env:
          TOWNS: ${{ matrix.towns }}
        run: |
          read -ra towns <<< "$TOWNS"
          git sparse-checkout add "${towns[@]/#/towns/}" states

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: publick-org/publick-engine
          ref: ${{ needs.plan.outputs.engine }}
          path: .publick-engine

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .publick-engine/requirements*.txt

      - name: Install dependencies
        run: |
          pip install -r .publick-engine/requirements.txt -r .publick-engine/requirements-dev.txt
          python -m playwright install --with-deps chromium

      # One town at a time, each one's data committed when it's done (on a fetching run outside a pull request).
      - name: Update, build, check, and publish
        env:
          TOWNS: ${{ matrix.towns }}
          COMMIT: ${{ needs.plan.outputs.fetch == 'true' && github.event_name != 'pull_request' }}
          COMMIT_ATTEMPTS: 10
          FETCH: ${{ needs.plan.outputs.fetch == 'true' && '--fetch' || '' }}
          DEPLOY: ${{ needs.plan.outputs.deploy == 'true' && '--deploy' || '' }}
          SAMPLE: ${{ needs.plan.outputs.sample == 'true' && '--sample-checks' || '' }}
          # Only when some data is left out, so a run fetching everything works with any engine.
          SOURCES: ${{ needs.plan.outputs.fetch == 'true' && needs.plan.outputs.sources != 'all' && format('--sources {0}', needs.plan.outputs.sources) || '' }}
          # No keys on a pull request's run: it doesn't fetch or publish, and its build and checks use none.
          ANTHROPIC_API_KEY: ${{ github.event_name != 'pull_request' && secrets.ANTHROPIC_API_KEY || '' }}
          # Empty unless the run fetches; then the town summarizes within these, new documents first.
          PUBLICK_SUMMARY_ALLOWANCE: ${{ needs.plan.outputs.summary_allowance }}
          PUBLICK_SUMMARY_BACKLOG_ALLOWANCE: ${{ needs.plan.outputs.summary_backlog_allowance }}
          BLS_API_KEY: ${{ github.event_name != 'pull_request' && secrets.BLS_API_KEY || '' }}
          STORAGE_ACCESS_KEY_ID: ${{ github.event_name != 'pull_request' && secrets.STORAGE_ACCESS_KEY_ID || '' }}
          STORAGE_SECRET_ACCESS_KEY: ${{ github.event_name != 'pull_request' && secrets.STORAGE_SECRET_ACCESS_KEY || '' }}
          SITES_ENDPOINT: ${{ github.event_name != 'pull_request' && secrets.SITES_ENDPOINT || '' }}
          SITES_BUCKET: ${{ github.event_name != 'pull_request' && secrets.SITES_BUCKET || '' }}
          SITES_ACCESS_KEY_ID: ${{ github.event_name != 'pull_request' && secrets.SITES_ACCESS_KEY_ID || '' }}
          SITES_SECRET_ACCESS_KEY: ${{ github.event_name != 'pull_request' && secrets.SITES_SECRET_ACCESS_KEY || '' }}
        # $FETCH, $DEPLOY, $SAMPLE and $SOURCES are unquoted on purpose: each is a flag (and its value) or nothing.
        # A town that fails, or whose commit fails, doesn't stop the next; the step fails at the end if either did.
        run: |
          read -ra towns <<< "$TOWNS"
          status=0
          for town in "${towns[@]}"; do
            python -m pipeline.network run --towns "$town" $FETCH $SOURCES $DEPLOY $SAMPLE --reports reports || status=1
            if [ "$COMMIT" = true ]; then
              .publick-engine/.github/scripts/commit-data.sh "Update data for $town" "towns/$town/data" || status=1
            fi
          done
          exit "$status"

      # The data is kept even if a town's build or checks failed, as each town's own workflow did. Each town's
      # was committed as it finished; this catches any that couldn't be, after the step above failed.
      - name: Commit data
        if: ${{ !cancelled() && needs.plan.outputs.fetch == 'true' && github.event_name != 'pull_request' }}
        env:
          TOWNS: ${{ matrix.towns }}
          COMMIT_ATTEMPTS: 10
        run: |
          read -ra towns <<< "$TOWNS"
          paths=()
          for town in "${towns[@]}"; do paths+=("towns/$town/data"); done
          .publick-engine/.github/scripts/commit-data.sh "Update data for $TOWNS" "${paths[@]}"

      # A run that published without fetching (a push, a rebuild) updates only the run records, so the status
      # page and the daily alert know the sites are up.
      - name: Commit run records
        if: ${{ !cancelled() && needs.plan.outputs.fetch != 'true' && needs.plan.outputs.deploy == 'true' && github.event_name != 'pull_request' }}
        env:
          TOWNS: ${{ matrix.towns }}
          COMMIT_ATTEMPTS: 10
        run: |
          read -ra towns <<< "$TOWNS"
          paths=()
          for town in "${towns[@]}"; do
            [ -f "towns/$town/data/run.json" ] && paths+=("towns/$town/data/run.json")
          done
          [ ${#paths[@]} -eq 0 ] || .publick-engine/.github/scripts/commit-data.sh "Record publishing $TOWNS" "${paths[@]}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: report-${{ strategy.job-index }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 7

  # The homepage and its status page. It waits for the towns, so the status
  # page shows this run's results; a town's failure doesn't stop it. After a
  # run that fetches, it also opens, updates, or closes the issue listing the
  # towns that need attention.
  home:
    needs: [plan, towns]
    if: ${{ !cancelled() && needs.plan.outputs.home == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # Outside a pull request, the branch as it is now: with the data (and run records) this run's towns committed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name != 'pull_request' && github.ref || '' }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /engine-version
            /home/
            /scripts/
            /towns/*/config/
            /towns/*/data/run.json
            /towns/*/data/summary-costs.json

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: publick-org/publick-engine
          ref: ${{ needs.plan.outputs.engine }}
          path: .publick-engine

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: pip install boto3

      # The town lists, from towns/.
      - name: Build the homepage
        run: python scripts/build_home.py --out _home

      # Every town's last daily run and data sources, from towns/*/data/run.json.
      - name: Build the status page
        run: python scripts/build_status.py --out _home

      # One issue for every town that needs attention, rather than a failed run for each: updated after
      # each run that fetches or publishes, and closed when every town is caught up. An edit sends no
      # email, so a comment names the towns that weren't in it before (none for one already listed).
      - name: Update the issue for towns that need attention
        if: (needs.plan.outputs.fetch == 'true' || needs.plan.outputs.deploy == 'true') && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LABEL: towns behind
        run: |
          body=$(python -m pipeline.network behind)
          gh label create "$LABEL" --color D93F0B --description "Towns without a good daily update" --force
          number=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          if [ -n "$body" ]; then
            if [ -n "$number" ]; then
              gh issue view "$number" --json body --jq .body > "$RUNNER_TEMP/previous.md"
              gh issue edit "$number" --body "$body"
              comment=$(python -m pipeline.network behind --new-since "$RUNNER_TEMP/previous.md")
              if [ -n "$comment" ]; then
                gh issue comment "$number" --body "$comment"
              fi
            else
              gh issue create --title "Towns need attention" --label "$LABEL" --assignee "$ALERT_ASSIGNEE" --body "$body"
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "Every town is caught up."
          fi

      - name: Publish the homepage
        if: needs.plan.outputs.deploy == 'true'
        env:
          SITES_ENDPOINT: ${{ secrets.SITES_ENDPOINT }}
          SITES_BUCKET: ${{ secrets.SITES_BUCKET }}
          SITES_ACCESS_KEY_ID: ${{ secrets.SITES_ACCESS_KEY_ID }}
          SITES_SECRET_ACCESS_KEY: ${{ secrets.SITES_SECRET_ACCESS_KEY }}
        run: python -m pipeline.deploy publish --domain publick.org --site _home

  # One table of every town in the run. Fails only a run that doesn't fetch
  # (a pull request, a push, a rebuild) when a town failed; a daily run's
  # problems go to the issue the home job keeps.
  report:
    needs: [plan, towns]
    if: ${{ !cancelled() && needs.plan.outputs.towns == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: publick-org/publick-engine
          ref: ${{ needs.plan.outputs.engine }}
          path: .publick-engine

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: report-*
          merge-multiple: true
          path: reports

      - name: Report
        run: |
          mkdir -p reports
          python -m pipeline.network report reports

  # Once a day: delete builds beyond the newest ten for each site, and files no kept build uses.
  prune:
    needs: [plan, towns]
    if: ${{ !cancelled() && needs.plan.outputs.prune == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: publick-org/publick-engine
          ref: ${{ needs.plan.outputs.engine }}
          path: .publick-engine

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: pip install boto3

      - name: Prune old builds
        env:
          SITES_ENDPOINT: ${{ secrets.SITES_ENDPOINT }}
          SITES_BUCKET: ${{ secrets.SITES_BUCKET }}
          SITES_ACCESS_KEY_ID: ${{ secrets.SITES_ACCESS_KEY_ID }}
          SITES_SECRET_ACCESS_KEY: ${{ secrets.SITES_SECRET_ACCESS_KEY }}
        run: python -m pipeline.deploy prune --keep 10
