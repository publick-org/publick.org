# Publishes a preview of one town's site, built from the town's data here with
# any engine branch, tag, or commit, at preview-<town>.publick.org: to look at
# an engine change on a town's own pages before it's released. Nothing is
# released and engine-version doesn't move; the town's own site isn't touched.
#
# The preview's pages say noindex, its robots.txt turns crawlers away, and it
# counts no page views (the engine's build_site --preview). It's built from
# the data in git as it is, with no fetch and no keys, and without share
# cards. What the sites Worker does (headers, redirects, forms) is the
# deployed Worker's, not the branch's.
#
# The preview's forms (the digest's signup, following an address) are
# answered by the same Worker as the town's: don't sign up through one.
#
# Two jobs, so that a branch's code never runs with the bucket's keys: the
# first builds the site with the engine asked for and has no secrets, and
# saves no cache another job reads; the second works out the town and the
# address again for itself, publishes what the first built with the engine at
# engine-version, then loads the preview's homepage until it is the one built.
#
# The engine asked for needs build_site --preview. Each preview replaces the
# town's last one, and comes down by itself a week after it was last
# published: once a day, the expire job deletes the previews older than that
# (scripts/expire_previews.py), and only what was built as a preview.
# Actions -> Remove a site takes one down sooner (preview-<town>.publick.org).
name: Preview

on:
  schedule:
    # Once a day, for the expire job alone.
    - cron: "43 4 * * *"
  workflow_dispatch:
    inputs:
      town:
        description: The town's folder under towns/, like "gloucester-ma"
        type: string
        required: true
      engine:
        description: An engine branch, tag, or commit to build with (empty for the engine at engine-version)
        type: string
        default: ""

permissions:
  contents: read

# One preview of a town at a time: a newer one replaces a run still going.
concurrency:
  group: preview-${{ inputs.town }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Before either is used: a town's folder name, and a git ref in one line.
      - name: Check the inputs
        env:
          TOWN: ${{ inputs.town }}
          ENGINE: ${{ inputs.engine }}
        run: |
          if ! [[ "$TOWN" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]]; then
            echo "::error::$TOWN isn't a town's folder name, like gloucester-ma."
            exit 1
          fi
          if [ -n "$ENGINE" ] && ! [[ "$ENGINE" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::The engine should be a branch, tag, or commit."
            exit 1
          fi

      # This town, the settings towns share, and the statewide sources its pages read: not every town's data.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /engine-version
            /defaults/
            /states/
            /towns/${{ inputs.town }}/

      - id: town
        env:
          TOWN: ${{ inputs.town }}
          ENGINE: ${{ inputs.engine }}
        run: |
          configs=(towns/"$TOWN"/config/*.toml)
          if [ "${#configs[@]}" -ne 1 ] || [ ! -f "${configs[0]}" ]; then
            echo "::error::$TOWN isn't a town's folder under towns/, with its one config file."
            exit 1
          fi
          {
            echo "config=$(basename "${configs[0]}" .toml)"
            echo "engine=${ENGINE:-$(tr -d '[:space:]' < engine-version)}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: publick-org/publick-engine
          ref: ${{ steps.town.outputs.engine }}
          path: .publick-engine

      # Without pip's cache: this job runs a branch's code, and what it saved a job with keys would install.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build the preview
        env:
          TOWN: ${{ inputs.town }}
          CONFIG: ${{ steps.town.outputs.config }}
          HOST: preview-${{ inputs.town }}.publick.org
          ENGINE: ${{ steps.town.outputs.engine }}
        run: |
          pip install -r .publick-engine/requirements.txt
          if ! grep -q -- '"--preview"' .publick-engine/pipeline/build_site.py; then
            echo "::error::The engine at $ENGINE has no build_site --preview: preview a branch that has it, or wait for a release that does."
            exit 1
          fi
          cd "towns/$TOWN"
          PYTHONPATH="$GITHUB_WORKSPACE/.publick-engine" \
            python -m pipeline.build_site --town "$CONFIG" --out "$GITHUB_WORKSPACE/_site" --no-share-cards --preview "$HOST"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-site
          path: _site
          include-hidden-files: true
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The town's config, for its name and the address its checks ask from; nothing the first job made.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /engine-version
            /defaults/
            /towns/${{ inputs.town }}/config/

      - id: engine
        env:
          TOWN: ${{ inputs.town }}
        run: |
          configs=(towns/"$TOWN"/config/*.toml)
          {
            echo "ref=$(tr -d '[:space:]' < engine-version)"
            echo "config=$(basename "${configs[0]}" .toml)"
          } >> "$GITHUB_OUTPUT"

      # The released engine, not the branch the site was built with: this job has the bucket's keys.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: publick-org/publick-engine
          ref: ${{ steps.engine.outputs.ref }}
          path: .publick-engine

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .publick-engine/requirements*.txt

      - run: pip install -r .publick-engine/requirements.txt

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preview-site
          path: _site

      - name: Publish the preview
        env:
          TOWN: ${{ inputs.town }}
          CONFIG: ${{ steps.engine.outputs.config }}
          HOST: preview-${{ inputs.town }}.publick.org
          SITES_ENDPOINT: ${{ secrets.SITES_ENDPOINT }}
          SITES_BUCKET: ${{ secrets.SITES_BUCKET }}
          SITES_ACCESS_KEY_ID: ${{ secrets.SITES_ACCESS_KEY_ID }}
          SITES_SECRET_ACCESS_KEY: ${{ secrets.SITES_SECRET_ACCESS_KEY }}
        run: |
          cd "towns/$TOWN"
          PYTHONPATH="$GITHUB_WORKSPACE/.publick-engine" \
            python -m pipeline.deploy publish --town "$CONFIG" --site "$GITHUB_WORKSPACE/_site" --domain "$HOST"

      # Without the keys: only loads the preview's homepage, until it is the one built.
      - name: Check the preview loads
        env:
          TOWN: ${{ inputs.town }}
          CONFIG: ${{ steps.engine.outputs.config }}
          HOST: preview-${{ inputs.town }}.publick.org
          ENGINE: ${{ inputs.engine }}
        run: |
          cd "towns/$TOWN"
          if ! PYTHONPATH="$GITHUB_WORKSPACE/.publick-engine" \
            python -m pipeline.deploy check --town "$CONFIG" --site "$GITHUB_WORKSPACE/_site" --domain "$HOST"; then
            echo "::error::The preview was published but https://$HOST/ doesn't serve it: check that the hostname has a DNS record and a route to the sites Worker."
            exit 1
          fi
          echo "Preview of $TOWN${ENGINE:+ with engine $ENGINE}: https://$HOST/" >> "$GITHUB_STEP_SUMMARY"

  # The scheduled run: previews last published more than a week ago.
  expire:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/expire_previews.py

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # At the engine's version (its requirements.txt), since it runs with the bucket's keys.
      - run: pip install boto3==1.43.106

      - name: Take down old previews
        env:
          SITES_ENDPOINT: ${{ secrets.SITES_ENDPOINT }}
          SITES_BUCKET: ${{ secrets.SITES_BUCKET }}
          SITES_ACCESS_KEY_ID: ${{ secrets.SITES_ACCESS_KEY_ID }}
          SITES_SECRET_ACCESS_KEY: ${{ secrets.SITES_SECRET_ACCESS_KEY }}
        run: python scripts/expire_previews.py
