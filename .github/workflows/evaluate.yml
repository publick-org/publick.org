# Runs the engine's minutes prompt against the real model, on minutes whose
# decisions were checked by hand (the engine's evals/minutes.json and
# pipeline/evaluate.py), before a prompt change ships. Started by hand only:
# Actions -> Evaluate -> Run workflow, with the engine branch, tag, or commit
# to run (a pull request's branch, before it's merged).
#
# The report is the run's summary; every result is saved as the artifact
# evaluation.json. It fails when a wrong outcome would be shown. A run costs
# about $1 to $2 on the network's Anthropic key, outside the towns' summary
# budget.
#
# It gets the Anthropic key and nothing else, reads this repository only, and
# never runs on a push or a pull request.
name: Evaluate

on:
  workflow_dispatch:
    inputs:
      engine_ref:
        description: "The engine's branch, tag, or commit to run"
        required: true
        default: main
      only:
        description: "One document of the set, by name (empty for all)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: publick-org/publick-engine
          ref: ${{ inputs.engine_ref }}
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements.txt

      - name: Run the set against the model
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ONLY: ${{ inputs.only }}
        # The report goes to the run's summary whether or not the run passes.
        run: |
          status=0
          python -m pipeline.evaluate ${ONLY:+--only "$ONLY"} --json evaluation.json > evaluation.md || status=$?
          cat evaluation.md
          cat evaluation.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: evaluation
          path: |
            evaluation.json
            evaluation.md
          if-no-files-found: ignore
