# Runs the engine's minutes prompt against the real model, on minutes whose
# decisions were checked by hand (the engine's evals/minutes.json and
# pipeline/evaluate.py), before a prompt change ships; or, with the set
# "translations", its translation prompt on one town's summaries
# (evals/translations.json, pipeline/evaluate_translations.py), reporting how
# many pass and why the rest don't (about a cent a summary); or, with the set
# "batch", the minutes set sent through the Message Batches API at each of the
# given efforts (pipeline/evaluate_batch.py): how long a batch takes, and what a
# lower effort does to the summaries, before deciding whether the daily runs
# send summaries as a batch (half the price) and at what effort. Run it more than
# once, at the hour the daily runs do: a batch's time varies with the API's load.
# Started by hand only:
# Actions -> Evaluate -> Run workflow, with the engine branch, tag, or commit
# to run (a pull request's branch, before it's merged).
#
# The report is the run's summary; every result is saved as the artifact
# evaluation.json. It fails when a wrong outcome would be shown (not the
# batch set, an experiment). A run costs about $1 to $2 on the network's
# Anthropic key, outside the towns' summary budget; the batch set about half
# that for each effort.
#
# It gets the Anthropic key and nothing else, reads this repository only, and
# never runs on a push or a pull request.
name: Evaluate

on:
  workflow_dispatch:
    inputs:
      engine_ref:
        description: "The engine's branch, tag, or commit to run"
        required: true
        default: main
      set:
        description: "Which prompt's set: minutes, translations, or batch (the minutes as a batch, by effort)"
        type: choice
        options: [minutes, translations, batch]
        default: minutes
      only:
        description: "One document of the set, by name (empty for all)"
        required: false
        default: ""
      efforts:
        description: "For the batch set: the efforts, comma-separated"
        required: false
        default: "low,medium,high"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    # The batch set waits up to 100 minutes for its batches.
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: publick-org/publick-engine
          ref: ${{ inputs.engine_ref }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements.txt

      - name: Run the set against the model
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ONLY: ${{ inputs.only }}
          SET: ${{ inputs.set }}
          EFFORTS: ${{ inputs.efforts }}
        # The report goes to the run's summary whether or not the run passes.
        run: |
          status=0
          # --set only for the others, so an engine from before it had one still runs the minutes.
          case "$SET" in
            translations) set_args=(--set translations) ;;
            batch) set_args=(--set batch --efforts "$EFFORTS" --wait-minutes 100) ;;
            *) set_args=() ;;
          esac
          python -m pipeline.evaluate "${set_args[@]}" ${ONLY:+--only "$ONLY"} --json evaluation.json > evaluation.md || status=$?
          cat evaluation.md
          cat evaluation.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: evaluation
          path: |
            evaluation.json
            evaluation.md
          if-no-files-found: ignore
