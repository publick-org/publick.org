# Adds a town, by hand: Actions -> Add a town -> Run workflow. Two steps, each its own run:
#
#   start           With the town's name, its state, and its city's website: runs the engine's helper
#                   (pipeline/new_town.py; ADDING-A-TOWN.md, "Start with the helper") on the engine every town
#                   runs, and opens a draft pull request from add-town/<town>-<state> with the town's folder,
#                   its description the helper's report: what it found, where each answer came from, its
#                   checks, and what's left for a person (each a "# To fill in:" comment in the config). Finish
#                   those on the pull request's branch; its run builds and checks the town, and the site checks
#                   fail while any is left. A helper that stops (a browser check, a meeting platform the engine
#                   doesn't read) opens nothing, and its report is in the run's summary.
#   first fetches   Once that pull request is merged: the town's first fetching runs (ADDING-A-TOWN.md, step 7),
#                   one Network run after another, until a run collects fewer minutes than one run may
#                   (MINUTES_PER_RUN), or `runs` runs have collected, each with `catch_up` if it's given.
#
# The pull request is opened with ENGINE_PR_TOKEN (engine.yml says what it is): one this workflow's own token
# opened wouldn't start its checks. The Network runs are started with this workflow's own token, which a
# workflow_dispatch allows.
name: Add a town

on:
  workflow_dispatch:
    inputs:
      step:
        description: Which step
        type: choice
        options: [start, first fetches]
        default: start
      town:
        description: The town's name, as its state writes it ("South Kingstown")
        type: string
        required: true
      state:
        description: Its state's two-letter code ("RI")
        type: string
        required: true
      url:
        description: "start: the city's website (https://www.southkingstownri.com)"
        type: string
        default: ""
      full:
        description: "start: the helper's check fetches every meeting from `since`, not four weeks"
        type: boolean
        default: false
      runs:
        description: "first fetches: at most this many Network runs"
        type: string
        default: "4"
      catch_up:
        description: "first fetches: each run's catch_up, as on a Network run by hand (empty for the usual share)"
        type: string
        default: ""

permissions:
  contents: read

# One at a time: a second start for the same town would find its branch taken.
concurrency:
  group: add-town
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}/.publick-engine
  # The minutes a Network run collects for a source at most (the engine's fetch_minutes.py,
  # max_minutes_per_run): a run that collects fewer has found every one waiting.
  MINUTES_PER_RUN: 60

jobs:
  start:
    if: ${{ inputs.step == 'start' }}
    runs-on: ubuntu-latest
    # The helper's checks fetch a few weeks of meetings (every one with `full`) and run the site checks.
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The town's folder and the engine every town runs
        id: town
        env:
          TOWN: ${{ inputs.town }}
          STATE: ${{ inputs.state }}
          URL: ${{ inputs.url }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::The start step needs the city's website (url)."
            exit 1
          fi
          # As the helper names it (pipeline/new_town.py, NewTown.folder): "South Kingstown", "RI" is south-kingstown-ri.
          folder=$(python3 -c 'import re, sys; print(re.sub(r"[^a-z0-9]+", "-", sys.argv[1].lower()).strip("-") + "-" + sys.argv[2].lower())' "$TOWN" "$STATE")
          if [ -e "towns/$folder" ]; then
            echo "::error::towns/$folder is already here: the helper starts a town, never changes one."
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "add-town/$folder" > /dev/null; then
            echo "::error::The branch add-town/$folder is already there: finish or delete it first."
            exit 1
          fi
          echo "folder=$folder" >> "$GITHUB_OUTPUT"
          echo "engine=$(tr -d '[:space:]' < engine-version)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: publick-org/publick-engine
          ref: ${{ steps.town.outputs.engine }}
          path: .publick-engine

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .publick-engine/requirements*.txt

      - name: Install dependencies
        run: |
          pip install -r .publick-engine/requirements.txt -r .publick-engine/requirements-dev.txt
          python -m playwright install --with-deps chromium

      # The report goes in the run's summary whatever happens, and becomes the pull request's description.
      - name: Run the helper
        id: helper
        env:
          TOWN: ${{ inputs.town }}
          STATE: ${{ inputs.state }}
          URL: ${{ inputs.url }}
          FULL: ${{ inputs.full && '--full' || '' }}
          REPORT: ${{ runner.temp }}/new-town.md
        # $FULL is unquoted on purpose: a flag or nothing.
        run: |
          status=0
          python -m pipeline.new_town "$TOWN" "$STATE" "$URL" --report "$REPORT" $FULL || status=$?
          if [ -f "$REPORT" ]; then cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "$status" -ne 0 ]; then
            echo "::error::The helper stopped (exit status $status); its report is in this run's summary."
            exit "$status"
          fi

      - name: Open the draft pull request
        env:
          GH_TOKEN: ${{ secrets.ENGINE_PR_TOKEN }}
          TOWN: ${{ inputs.town }}
          STATE: ${{ inputs.state }}
          FOLDER: ${{ steps.town.outputs.folder }}
          REPORT: ${{ runner.temp }}/new-town.md
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set the repository secret ENGINE_PR_TOKEN (see engine.yml): without it the pull request's checks don't run."
            exit 1
          fi
          state=$(tr '[:lower:]' '[:upper:]' <<< "$STATE")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git switch -c "add-town/$FOLDER"
          git add "towns/$FOLDER"
          git commit -qm "Add $TOWN, $state"
          git push origin "add-town/$FOLDER"
          # A pull request's description holds 65,536 characters; a long report is cut, and is whole in the run's summary.
          body="$RUNNER_TEMP/body.md"
          {
            echo "Started by the Add a town workflow (.github/workflows/add-town.yml): the engine's helper, \`pipeline/new_town.py\`, on $(cat engine-version). Each \`# To fill in:\` comment in the config is left for a person (ADDING-A-TOWN.md); the site checks fail while any is left."
            echo
            python3 -c 'import sys; print(open(sys.argv[1], encoding="utf-8").read()[:60000])' "$REPORT"
            if [ "$(python3 -c 'import sys; print(len(open(sys.argv[1], encoding="utf-8").read()))' "$REPORT")" -gt 60000 ]; then
              echo
              echo "(Cut short: the whole report is in the summary of $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID.)"
            fi
          } > "$body"
          gh pr create --draft --head "add-town/$FOLDER" --base main --title "Add $TOWN, $state" --body-file "$body"

  first-fetches:
    if: ${{ inputs.step == 'first fetches' }}
    runs-on: ubuntu-latest
    # A new town's first fetching runs take up to an hour or two each, after any run they queue behind.
    timeout-minutes: 350
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: engine-version

      - name: Fetch until no minutes are waiting
        env:
          GH_TOKEN: ${{ github.token }}
          TOWN: ${{ inputs.town }}
          STATE: ${{ inputs.state }}
          RUNS: ${{ inputs.runs }}
          CATCH_UP: ${{ inputs.catch_up }}
        run: |
          folder=$(python3 -c 'import re, sys; print(re.sub(r"[^a-z0-9]+", "-", sys.argv[1].lower()).strip("-") + "-" + sys.argv[2].lower())' "$TOWN" "$STATE")
          if ! [[ "$RUNS" =~ ^[1-9][0-9]?$ ]]; then
            echo "::error::runs is a number from 1 to 99, not '$RUNS'."
            exit 1
          fi
          # The minutes the town's meetings have on main, as its last run committed them.
          minutes() {
            git fetch -q --filter=blob:none origin main
            git show "origin/main:towns/$folder/data/meetings/meetings.json" 2>/dev/null |
              python3 -c 'import json, sys; print(sum(len(m.get("minutes") or []) for m in json.load(sys.stdin).values()))' 2>/dev/null ||
              echo 0
          }
          git fetch -q --filter=blob:none origin main
          if ! git cat-file -e "origin/main:towns/$folder/config"; then
            echo "::error::towns/$folder isn't on main yet: merge its pull request first."
            exit 1
          fi
          before=$(minutes)
          for i in $(seq 1 "$RUNS"); do
            started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            gh workflow run network.yml --ref main -f towns="$folder" -f fetch=true -f catch_up="$CATCH_UP"
            # This workflow's run of it: the newest this token started since.
            run=""
            for _ in $(seq 1 30); do
              sleep 10
              run=$(gh run list --workflow network.yml --event workflow_dispatch --user "github-actions[bot]" \
                --created ">=$started" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
              [ -n "$run" ] && break
            done
            if [ -z "$run" ]; then
              echo "::error::The Network run started at $started didn't appear."
              exit 1
            fi
            echo "Run $i of $RUNS: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run"
            gh run watch "$run" --interval 60 > /dev/null || true
            conclusion=$(gh run view "$run" --json conclusion --jq .conclusion)
            after=$(minutes)
            added=$(( after - before ))
            before=$after
            echo "  $conclusion: $added minutes collected"
            echo "- [Run $i]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run): $conclusion, $added minutes collected" >> "$GITHUB_STEP_SUMMARY"
            # A run a daily start replaced while it waited collected nothing; the next one goes on.
            if [ "$conclusion" != cancelled ] && [ "$added" -lt "$MINUTES_PER_RUN" ]; then
              echo "No more minutes waiting for $folder."
              exit 0
            fi
          done
          echo "::warning::$RUNS runs collected $MINUTES_PER_RUN or more minutes each; run the first fetches again for the rest."
