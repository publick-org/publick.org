# Adds a town, by hand: Actions -> Add a town -> Run workflow. Two steps, each its own run:
#
#   start           With the town's name, its state, and its city's website: runs the engine's helper
#                   (pipeline/new_town.py; ADDING-A-TOWN.md, "Start with the helper") on the engine every town
#                   runs, and opens a draft pull request from add-town/<town>-<state> with the town's folder,
#                   its description the helper's report: what it found, where each answer came from, its
#                   checks, and what's left for a person (each a "# To fill in:" comment in the config). Finish
#                   those on the pull request's branch; its run builds and checks the town, and the site checks
#                   fail while any is left. A helper that stops (a browser check, a meeting platform the engine
#                   doesn't read) opens nothing, and its report is in the run's summary.
#   first fetches   Once that pull request is merged: the town's first fetching runs (ADDING-A-TOWN.md, step 7),
#                   one Network run after another, until a run collects fewer minutes than one run may
#                   (MINUTES_PER_RUN) and the town's meetings readers have nothing left waiting for a later run
#                   (the engine's `python -m pipeline.waiting`, from their status files), or `runs` runs have
#                   collected, each with `catch_up` if it's given. With an engine from before that command, the
#                   minutes alone decide. A run that couldn't fetch one of the town's meeting sources stops it with
#                   an error, naming them.
#
# The pull request is opened with ENGINE_PR_TOKEN (engine.yml says what it is): one this workflow's own token
# opened wouldn't start its checks. The Network runs are started with this workflow's own token, which a
# workflow_dispatch allows.
name: Add a town

on:
  workflow_dispatch:
    inputs:
      step:
        description: Which step
        type: choice
        options: [start, first fetches]
        default: start
      town:
        description: The town's name, as its state writes it ("South Kingstown")
        type: string
        required: true
      state:
        description: Its state's two-letter code ("RI")
        type: string
        required: true
      url:
        description: "start: the city's website (https://www.southkingstownri.com)"
        type: string
        default: ""
      full:
        description: "start: the helper's check fetches every meeting from `since`, not four weeks"
        type: boolean
        default: false
      runs:
        description: "first fetches: at most this many Network runs"
        type: string
        default: "4"
      catch_up:
        description: "first fetches: each run's catch_up, as on a Network run by hand (empty for the usual share)"
        type: string
        default: ""

permissions:
  contents: read

# One at a time: a second start for the same town would find its branch taken.
concurrency:
  group: add-town
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}/.publick-engine
  # The minutes a Network run collects for a source at most (the engine's fetch_minutes.py,
  # max_minutes_per_run): a run that collects fewer has found every one waiting. fetch_minutes.py doesn't save
  # what it leaves in a status file, so pipeline.waiting (below) doesn't count minutes.
  MINUTES_PER_RUN: 60

jobs:
  start:
    if: ${{ inputs.step == 'start' }}
    runs-on: ubuntu-latest
    # The helper's checks fetch a few weeks of meetings (every one with `full`) and run the site checks.
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The town's folder and the engine every town runs
        id: town
        env:
          TOWN: ${{ inputs.town }}
          STATE: ${{ inputs.state }}
          URL: ${{ inputs.url }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::The start step needs the city's website (url)."
            exit 1
          fi
          # As the helper names it (pipeline/new_town.py, NewTown.folder): "South Kingstown", "RI" is south-kingstown-ri.
          folder=$(python3 -c 'import re, sys; print(re.sub(r"[^a-z0-9]+", "-", sys.argv[1].lower()).strip("-") + "-" + sys.argv[2].lower())' "$TOWN" "$STATE")
          if [ -e "towns/$folder" ]; then
            echo "::error::towns/$folder is already here: the helper starts a town, never changes one."
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "add-town/$folder" > /dev/null; then
            echo "::error::The branch add-town/$folder is already there: finish or delete it first."
            exit 1
          fi
          echo "folder=$folder" >> "$GITHUB_OUTPUT"
          echo "engine=$(tr -d '[:space:]' < engine-version)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: publick-org/publick-engine
          ref: ${{ steps.town.outputs.engine }}
          path: .publick-engine

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .publick-engine/requirements*.txt

      - name: Install dependencies
        run: |
          pip install -r .publick-engine/requirements.txt -r .publick-engine/requirements-dev.txt
          python -m playwright install chromium

      # Chromium's system packages, from Ubuntu's archive. The runner image already has the libraries Chromium
      # needs, so this adds fonts for other alphabets; the pages and the share image use the sites' own fonts.
      # When the archive can't be reached, the step fails without stopping the run.
      - name: Install the browser's system packages
        continue-on-error: true
        timeout-minutes: 5
        run: python -m playwright install-deps chromium

      # The report goes in the run's summary whatever happens, and becomes the pull request's description.
      - name: Run the helper
        id: helper
        env:
          TOWN: ${{ inputs.town }}
          STATE: ${{ inputs.state }}
          URL: ${{ inputs.url }}
          FULL: ${{ inputs.full && '--full' || '' }}
          REPORT: ${{ runner.temp }}/new-town.md
        # $FULL is unquoted on purpose: a flag or nothing.
        run: |
          status=0
          python -m pipeline.new_town "$TOWN" "$STATE" "$URL" --report "$REPORT" $FULL || status=$?
          if [ -f "$REPORT" ]; then cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "$status" -ne 0 ]; then
            echo "::error::The helper stopped (exit status $status); its report is in this run's summary."
            exit "$status"
          fi

      - name: Open the draft pull request
        env:
          GH_TOKEN: ${{ secrets.ENGINE_PR_TOKEN }}
          TOWN: ${{ inputs.town }}
          STATE: ${{ inputs.state }}
          FOLDER: ${{ steps.town.outputs.folder }}
          REPORT: ${{ runner.temp }}/new-town.md
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set the repository secret ENGINE_PR_TOKEN (see engine.yml): without it the pull request's checks don't run."
            exit 1
          fi
          state=$(tr '[:lower:]' '[:upper:]' <<< "$STATE")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git switch -c "add-town/$FOLDER"
          git add "towns/$FOLDER"
          git commit -qm "Add $TOWN, $state"
          git push origin "add-town/$FOLDER"
          # A pull request's description holds 65,536 characters; a long report is cut, and is whole in the run's summary.
          body="$RUNNER_TEMP/body.md"
          {
            echo "Started by the Add a town workflow (.github/workflows/add-town.yml): the engine's helper, \`pipeline/new_town.py\`, on $(cat engine-version). Each \`# To fill in:\` comment in the config is left for a person (ADDING-A-TOWN.md); the site checks fail while any is left."
            echo
            python3 -c 'import sys; print(open(sys.argv[1], encoding="utf-8").read()[:60000])' "$REPORT"
            if [ "$(python3 -c 'import sys; print(len(open(sys.argv[1], encoding="utf-8").read()))' "$REPORT")" -gt 60000 ]; then
              echo
              echo "(Cut short: the whole report is in the summary of $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID.)"
            fi
          } > "$body"
          gh pr create --draft --head "add-town/$FOLDER" --base main --title "Add $TOWN, $state" --body-file "$body"

  first-fetches:
    if: ${{ inputs.step == 'first fetches' }}
    runs-on: ubuntu-latest
    # A new town's first fetching runs take up to an hour or two each, after any run they queue behind.
    timeout-minutes: 350
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: engine-version

      - name: The engine every town runs
        id: engine
        run: echo "ref=$(tr -d '[:space:]' < engine-version)" >> "$GITHUB_OUTPUT"

      # Its pipeline/waiting.py, which reads the readers' status files with Python's standard library alone.
      # Without it, the minutes alone decide.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          persist-credentials: false
          repository: publick-org/publick-engine
          ref: ${{ steps.engine.outputs.ref }}
          path: .publick-engine
          sparse-checkout: pipeline

      - name: Fetch until nothing is waiting
        env:
          GH_TOKEN: ${{ github.token }}
          TOWN: ${{ inputs.town }}
          STATE: ${{ inputs.state }}
          RUNS: ${{ inputs.runs }}
          CATCH_UP: ${{ inputs.catch_up }}
          # The minutes the loop may take, under the job's timeout-minutes, with room to report what's left.
          FETCH_MINUTES: 330
        run: |
          folder=$(python3 -c 'import re, sys; print(re.sub(r"[^a-z0-9]+", "-", sys.argv[1].lower()).strip("-") + "-" + sys.argv[2].lower())' "$TOWN" "$STATE")
          if ! [[ "$RUNS" =~ ^[1-9][0-9]?$ ]]; then
            echo "::error::runs is a number from 1 to 99, not '$RUNS'."
            exit 1
          fi
          # The minutes the town's meetings have on main, as its last run committed them.
          minutes() {
            git fetch -q --filter=blob:none origin main
            git show "origin/main:towns/$folder/data/meetings/meetings.json" 2>/dev/null |
              python3 -c 'import json, sys; print(sum(len(m.get("minutes") or []) for m in json.load(sys.stdin).values()))' 2>/dev/null ||
              echo 0
          }
          # What the town's meetings readers left for a later run, every reader's together (the engine's
          # pipeline/waiting.py), from their status files (data/meetings/*status.json) as minutes() last fetched
          # main; each reader's count goes to the log. "unknown" when a status file or the count couldn't be
          # read, which isn't done; nothing with an engine from before the command.
          waiting() {
            [ -n "$counts" ] || return 0
            local data="$RUNNER_TEMP/waiting/data" names name count
            rm -rf "$RUNNER_TEMP/waiting"
            mkdir -p "$data/meetings"
            names=$(git ls-tree --name-only "origin/main:towns/$folder/data/meetings" 2>/dev/null) || { echo unknown; return 0; }
            while read -r name; do
              case "$name" in
                *status.json) git show "origin/main:towns/$folder/data/meetings/$name" > "$data/meetings/$name" || { echo unknown; return 0; } ;;
              esac
            done <<< "$names"
            count=$(python3 -m pipeline.waiting --data "$data") || count=""
            if [[ "$count" =~ ^[0-9]+$ ]]; then echo "$count"; else echo unknown; fi
          }
          # The meeting sources the town's last run couldn't fetch (meetings/status.json, failed_calendars), as
          # minutes() last fetched main: a run that reached none collects no minutes, and isn't done.
          failed_sources() {
            git show "origin/main:towns/$folder/data/meetings/status.json" 2>/dev/null |
              python3 -c 'import json, sys; print(", ".join(json.load(sys.stdin).get("failed_calendars") or []))' 2>/dev/null ||
              true
          }
          git fetch -q --filter=blob:none origin main
          if ! git cat-file -e "origin/main:towns/$folder/config"; then
            echo "::error::towns/$folder isn't on main yet: merge its pull request first."
            exit 1
          fi
          before=$(minutes)
          # An engine from before the command has pipeline/waiting.py without main(), and prints nothing.
          if python3 -c 'import sys, pipeline.waiting as w; sys.exit(not hasattr(w, "main"))' 2>/dev/null; then
            counts=yes
          else
            counts=""
            echo "::notice::The engine at $(cat engine-version) has no pipeline.waiting command, or it couldn't be checked out: only the minutes a run collects decide when the first fetches are done."
          fi
          step_start=$(date +%s)
          deadline=$(( step_start + FETCH_MINUTES * 60 ))
          longest=0
          last_left=""
          for i in $(seq 1 "$RUNS"); do
            # Another run as long as the longest so far must end before the job's timeout, or the job is
            # stopped partway with no word of what's left.
            if [ "$i" -gt 1 ] && [ $(( $(date +%s) + longest )) -gt "$deadline" ]; then
              echo "::warning::Stopped after $(( i - 1 )) runs, before the job's time limit (the longest took $(( longest / 60 )) minutes): run the first fetches again for the rest."
              exit 0
            fi
            started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            started_at=$(date +%s)
            gh workflow run network.yml --ref main -f towns="$folder" -f fetch=true -f catch_up="$CATCH_UP"
            # This workflow's run of it: the newest this token started since.
            run=""
            for _ in $(seq 1 30); do
              sleep 10
              run=$(gh run list --workflow network.yml --event workflow_dispatch --user "github-actions[bot]" \
                --created ">=$started" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
              [ -n "$run" ] && break
            done
            if [ -z "$run" ]; then
              echo "::error::The Network run started at $started didn't appear."
              exit 1
            fi
            echo "Run $i of $RUNS: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run"
            # Until it ends, or the job's time is up: the Network run goes on by itself, and commits what it fetched.
            while [ "$(gh run view "$run" --json status --jq .status 2>/dev/null)" != completed ]; do
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "- [Run $i]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run): still going at the job's time limit" >> "$GITHUB_STEP_SUMMARY"
                echo "::warning::Run $i was still going at the job's time limit: run the first fetches again once it ends, for the rest."
                exit 0
              fi
              sleep 60
            done
            took=$(( $(date +%s) - started_at ))
            if [ "$took" -gt "$longest" ]; then longest=$took; fi
            conclusion=$(gh run view "$run" --json conclusion --jq .conclusion)
            after=$(minutes)
            added=$(( after - before ))
            before=$after
            left=$(waiting)
            case "$left" in
              "") note="" ;;
              unknown) note=", what the readers left waiting couldn't be read" ;;
              *) note=", $left meetings, documents or posts still waiting" ;;
            esac
            collected="$added minutes collected$note"
            echo "  $conclusion: $collected"
            echo "- [Run $i]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run): $conclusion, $collected" >> "$GITHUB_STEP_SUMMARY"
            failed=$(failed_sources)
            if [ "$conclusion" != cancelled ] && [ -n "$failed" ]; then
              echo "- Meetings couldn't be fetched from: $failed" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Run $i couldn't fetch meetings from: $failed (towns/$folder/data/meetings/status.json has the errors). Run the first fetches again once the town's site answers."
              exit 1
            fi
            # A run a daily start replaced while it waited collected nothing; the next one goes on. A reader that
            # saves only so many documents a run, newest first, can fill a run with agendas and collect few
            # minutes while hundreds of its meetings wait: its count decides with the minutes.
            if [ "$conclusion" != cancelled ] && [ "$added" -lt "$MINUTES_PER_RUN" ]; then
              if [ -z "$left" ] || [ "$left" = 0 ]; then
                echo "Nothing more waiting for $folder."
                exit 0
              fi
              # A count that didn't go down is left by a reader that isn't reading it (a source no longer in the
              # config, say): more runs wouldn't read it either.
              if [ "$left" != unknown ] && [ -n "$last_left" ] && [ "$last_left" != unknown ] && [ "$left" -ge "$last_left" ]; then
                echo "::warning::Run $i left as much waiting as the run before ($left), so another run wouldn't read it: the log names each reader's count."
                exit 0
              fi
            fi
            if [ "$conclusion" != cancelled ]; then last_left=$left; fi
          done
          echo "::warning::After $RUNS runs (the last $conclusion, $collected), run the first fetches again for the rest."
