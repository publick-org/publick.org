# Deploys the network's Workers, from the engine at the version in
# engine-version: the one that serves every site (wrangler.toml), and the
# scheduler that starts the daily runs (wrangler.scheduler.toml).
#
# Run by hand (Run workflow), it deploys both. By itself, on a push, it deploys
# only the scheduler: when engine-version moves to an engine whose scheduler
# changed, wrangler.scheduler.toml changes (a new Cron Trigger), or a town's
# config, defaults/ or scripts/digest_towns.py does (the digest's towns, below),
# since the last run that succeeded. The sites
# Worker serves every site, so a mistake in it takes them all down at once: it
# is deployed only by hand. When engine-version moves to
# an engine whose sites Worker changed, the push opens an issue, "Deploy the
# sites Worker", saying so; deploy it then (Run workflow), and look at a town's
# site after. The scheduler's hourly check opens "site down" if a site stops
# loading. wrangler.toml decides which hostnames the sites Worker answers;
# what's on main is what any deploy uses, so change it only when it's ready.
#
# The scheduler needs a GitHub token to start runs: the repository secret
# SCHEDULER_GITHUB_TOKEN, a fine-grained token for this repository with
# Actions and Issues read and write, and for publick-engine with Actions read
# and write (it starts the engine's release). Without it, the scheduler isn't deployed.
#
# The weekly digest's email (the engine's worker/digest.js) takes a Buttondown key for each
# Worker, each set when it's there: BUTTONDOWN_SUBSCRIBE_KEY for the sites Worker's signup
# form (subscribers read and write, sending disabled), and BUTTONDOWN_SEND_KEY for the
# scheduler's Sunday send (emails read and write, sending enabled). The towns the scheduler sends to,
# its DIGEST_TOWNS, are made here from the towns' configs (each with a [digest] table, the one that
# shows the signup form; scripts/digest_towns.py) and passed with its deploy; each gets its
# Buttondown tag (<town>-<state>-en) here, made if it isn't there yet.
#
# Address alerts (the engine's worker/alerts.js) take three secrets on the sites Worker, each set when
# it's there: POSTMARK_TOKEN (the Postmark server's API token, which sends the emails),
# ALERTS_HOOK_SECRET (which the network run's "Send address alerts" step sends to start a town's
# alerts), and ALERTS_TOKEN_SECRET (which makes each reader's links to manage and unsubscribe; changing
# it changes every reader's links, so the old ones stop working).
#
# The scheduler submits each new town's sitemap to Google Search Console (the engine's
# worker/search.js) with GSC_SERVICE_ACCOUNT_JSON, set when it's there: the JSON key of a Google
# service account that is a user of the publick.org Search Console property, with Full permission.
name: Worker

on:
  push:
    branches: [main]
    paths: [engine-version, wrangler.scheduler.toml, "towns/*/config/*.toml", "defaults/**", scripts/digest_towns.py]
  workflow_dispatch:

permissions:
  contents: read
  actions: read  # the last run that succeeded, which a push compares with
  issues: write  # the "Deploy the sites Worker" issue

# One deploy at a time, in order.
concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # The files at the top (the Workers' configs, engine-version), and what the digest's towns are made
      # from: the towns' configs, the settings they share (defaults/), and the script.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /defaults/
            /towns/*/config/
            /scripts/digest_towns.py

      - id: engine
        run: echo "ref=$(tr -d '[:space:]' < engine-version)" >> "$GITHUB_OUTPUT"

      # With its history, to compare the Workers between the engine versions a push moved between.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: publick-org/publick-engine
          ref: ${{ steps.engine.outputs.ref }}
          path: .publick-engine
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The towns whose digest is emailed: every town whose config has a [digest] table, read with the engine's
      # config reader. The scheduler's DIGEST_TOWNS, and the towns whose Buttondown tags are made below.
      - id: digest
        env:
          PYTHONPATH: .publick-engine
        run: |
          towns=$(python scripts/digest_towns.py)
          echo "The digest's towns: ${towns:-none}"
          echo "towns=$towns" >> "$GITHUB_OUTPUT"

      # Run by hand: both. A push: the scheduler when its config or the digest's towns' files changed, or its
      # files did between the old engine-version and the new (anything it can't compare deploys it); never the
      # sites Worker, but whether its files changed, for the issue below. A push compares with the last run
      # that succeeded, not only the commit before it: a push waiting in the queue is replaced by a newer one.
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          NEW: ${{ steps.engine.outputs.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Each Worker's files in the engine's worker/ (digest.js is in both).
          scheduler_files=(worker/scheduler-index.js worker/scheduler.js worker/digest.js worker/search.js worker/package.json)
          sites_files=(worker/index.js worker/sites.js worker/digest.js worker/package.json)
          # The scheduler's config here, and what the digest's towns are made from.
          scheduler_config=(wrangler.scheduler.toml 'towns/*/config/*.toml' defaults scripts/digest_towns.py)
          scheduler=true; sites=true; sites_changed=false; old=""
          if [ "$EVENT" = push ]; then
            sites=false
            since="$BEFORE"
            last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow worker.yml --branch main --status success \
              --limit 1 --json headSha --jq '.[0].headSha // empty' 2>/dev/null || true)
            [ -n "$last" ] && since="$last"
            if git fetch --quiet --depth=1 origin "$since" 2>/dev/null; then
              old=$(git show "$since:engine-version" 2>/dev/null | tr -d '[:space:]')
            fi
            if [ -n "$old" ] && git -C .publick-engine diff --quiet "$old" "$NEW" -- "${scheduler_files[@]}" 2>/dev/null \
              && git diff --quiet "$since" HEAD -- "${scheduler_config[@]}"; then
              echo "The scheduler is the same in $old and $NEW, and its config and the digest's towns didn't change."
              scheduler=false
            fi
            if [ -n "$old" ] && [ "$old" != "$NEW" ] \
              && ! git -C .publick-engine diff --quiet "$old" "$NEW" -- "${sites_files[@]}" 2>/dev/null; then
              echo "The sites Worker changed from $old to $NEW: deploy it by hand."
              sites_changed=true
            fi
          fi
          echo "scheduler=$scheduler, sites=$sites"
          {
            echo "scheduler=$scheduler"
            echo "sites=$sites"
            echo "sites_changed=$sites_changed"
            echo "old=$old"
            echo "deploy=$([ "$scheduler" = true ] || [ "$sites" = true ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      # A push that moved to an engine whose sites Worker changed: an issue, so it's deployed by hand.
      - name: Ask for the sites Worker's deploy
        if: steps.decide.outputs.sites_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OLD: ${{ steps.decide.outputs.old }}
          NEW: ${{ steps.engine.outputs.ref }}
          # Who the issue is assigned to; a secret, so the log doesn't name them. Unset, no one.
          ALERT_ASSIGNEE: ${{ secrets.ALERT_ASSIGNEE }}
        run: |
          title="Deploy the sites Worker for engine $NEW"
          if [ -n "$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
            echo "An issue is already open."
            exit 0
          fi
          compare="https://github.com/publick-org/publick-engine/compare/$OLD...$NEW"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
            ${ALERT_ASSIGNEE:+--assignee "$ALERT_ASSIGNEE"} \
            --body "engine-version moved from $OLD to $NEW, and the sites Worker changed between them ([the changes]($compare), under worker/). It serves every site, so it's deployed only by hand: **Actions → Worker → Run workflow**, then look at a town's site and https://publick.org/status/. Close this issue once it's deployed. See the RUNBOOK's \"Releasing by hand\"."

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.decide.outputs.deploy == 'true'
        with:
          node-version: "22"

      - name: Test the Workers
        if: steps.decide.outputs.deploy == 'true'
        run: |
          tests=(.publick-engine/worker/sites.test.js .publick-engine/worker/scheduler.test.js)
          # The alerts' tests, with an engine that has them.
          if [ -f .publick-engine/worker/alerts.test.js ]; then tests+=(.publick-engine/worker/alerts.test.js); fi
          node --test "${tests[@]}"

      # wrangler at an exact version (here and below), since it runs with the Cloudflare token: moved by hand.
      - name: Deploy the sites Worker
        if: steps.decide.outputs.sites == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.137.0 deploy

      - name: Give the sites Worker the digest signup's key
        if: steps.decide.outputs.sites == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUTTONDOWN_SUBSCRIBE_KEY: ${{ secrets.BUTTONDOWN_SUBSCRIBE_KEY }}
        run: |
          if [ -z "$BUTTONDOWN_SUBSCRIBE_KEY" ]; then
            echo "::warning::BUTTONDOWN_SUBSCRIBE_KEY isn't set, so the digest's signup form can't sign anyone up."
            exit 0
          fi
          printf '%s' "$BUTTONDOWN_SUBSCRIBE_KEY" | npx --yes wrangler@4.137.0 secret put BUTTONDOWN_SUBSCRIBE_KEY

      - name: Give the sites Worker the address alerts' keys
        if: steps.decide.outputs.sites == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          POSTMARK_TOKEN: ${{ secrets.POSTMARK_TOKEN }}
          ALERTS_HOOK_SECRET: ${{ secrets.ALERTS_HOOK_SECRET }}
          ALERTS_TOKEN_SECRET: ${{ secrets.ALERTS_TOKEN_SECRET }}
        run: |
          for name in POSTMARK_TOKEN ALERTS_HOOK_SECRET ALERTS_TOKEN_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::warning::$name isn't set, so address alerts can't be followed or sent."
              continue
            fi
            printf '%s' "${!name}" | npx --yes wrangler@4.137.0 secret put "$name"
          done

      # After the sites Worker, which its service binding names. The token is set right after the deploy
      # (a secret can only be set on a Worker that exists); a start in between would only fail once.
      - name: Deploy the scheduler
        if: steps.decide.outputs.scheduler == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SCHEDULER_GITHUB_TOKEN: ${{ secrets.SCHEDULER_GITHUB_TOKEN }}
          DIGEST_TOWNS: ${{ steps.digest.outputs.towns }}
        run: |
          if [ -z "$SCHEDULER_GITHUB_TOKEN" ]; then
            echo "::warning::SCHEDULER_GITHUB_TOKEN isn't set, so the scheduler isn't deployed; runs start on GitHub's schedule."
            exit 0
          fi
          npx --yes wrangler@4.137.0 deploy -c wrangler.scheduler.toml --var "DIGEST_TOWNS:$DIGEST_TOWNS"
          printf '%s' "$SCHEDULER_GITHUB_TOKEN" | npx --yes wrangler@4.137.0 secret put GITHUB_TOKEN -c wrangler.scheduler.toml

      # Who the scheduler's issues ("network stopped", "digest not sent", "site down") are assigned to, so they
      # reach them: a secret on the Worker, from the repository secret, so neither its config nor a log names them.
      - name: Give the scheduler who its issues go to
        if: steps.decide.outputs.scheduler == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SCHEDULER_GITHUB_TOKEN: ${{ secrets.SCHEDULER_GITHUB_TOKEN }}
          ALERT_ASSIGNEE: ${{ secrets.ALERT_ASSIGNEE }}
        run: |
          if [ -z "$SCHEDULER_GITHUB_TOKEN" ] || [ -z "$ALERT_ASSIGNEE" ]; then
            echo "::warning::The scheduler or ALERT_ASSIGNEE isn't there, so its issues are assigned to no one."
            exit 0
          fi
          printf '%s' "$ALERT_ASSIGNEE" | npx --yes wrangler@4.137.0 secret put ALERT_ASSIGNEE -c wrangler.scheduler.toml

      - name: Give the scheduler the digest send's key
        if: steps.decide.outputs.scheduler == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SCHEDULER_GITHUB_TOKEN: ${{ secrets.SCHEDULER_GITHUB_TOKEN }}
          BUTTONDOWN_SEND_KEY: ${{ secrets.BUTTONDOWN_SEND_KEY }}
        run: |
          if [ -z "$SCHEDULER_GITHUB_TOKEN" ] || [ -z "$BUTTONDOWN_SEND_KEY" ]; then
            echo "::warning::The scheduler or BUTTONDOWN_SEND_KEY isn't there, so the weekly digest isn't sent."
            exit 0
          fi
          printf '%s' "$BUTTONDOWN_SEND_KEY" | npx --yes wrangler@4.137.0 secret put BUTTONDOWN_SEND_KEY -c wrangler.scheduler.toml

      - name: Give the scheduler the Search Console key
        if: steps.decide.outputs.scheduler == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SCHEDULER_GITHUB_TOKEN: ${{ secrets.SCHEDULER_GITHUB_TOKEN }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SCHEDULER_GITHUB_TOKEN" ] || [ -z "$GSC_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::The scheduler or GSC_SERVICE_ACCOUNT_JSON isn't there, so new towns' sitemaps aren't submitted to Search Console."
            exit 0
          fi
          printf '%s' "$GSC_SERVICE_ACCOUNT_JSON" | npx --yes wrangler@4.137.0 secret put GSC_SERVICE_ACCOUNT_JSON -c wrangler.scheduler.toml

      # Last, so a failure here never stops a deploy. A tag already there is left as it is (its color too).
      - name: Make each digest town's Buttondown tag
        env:
          BUTTONDOWN_SUBSCRIBE_KEY: ${{ secrets.BUTTONDOWN_SUBSCRIBE_KEY }}
          DIGEST_TOWNS: ${{ steps.digest.outputs.towns }}
          # Buttondown requires a color for a new tag (it refused one without, 2026-10-12); only its dashboard shows it.
          TAG_COLOR: "#215367"
        run: |
          if [ -z "$BUTTONDOWN_SUBSCRIBE_KEY" ]; then
            echo "::warning::BUTTONDOWN_SUBSCRIBE_KEY isn't set, so no tags are made."
            exit 0
          fi
          towns=$(tr ',' ' ' <<< "$DIGEST_TOWNS")
          # The tags already there, by name (Buttondown pages its list; 100 is more than the network has).
          status=$(curl -sS -o tags.json -w '%{http_code}' "https://api.buttondown.com/v1/tags?page_size=100" \
            -H "Authorization: Token $BUTTONDOWN_SUBSCRIBE_KEY")
          if [ "$status" != 200 ]; then
            echo "::error::Listing the tags: HTTP $status $(cat tags.json)"
            exit 1
          fi
          jq -r '.results[].name' tags.json > tag-names.txt
          failed=0
          for host in $towns; do
            tag="${host%%.*}-en"
            if grep -qxF "$tag" tag-names.txt; then
              echo "The tag $tag is there."
              continue
            fi
            status=$(curl -sS -o tag.json -w '%{http_code}' -X POST https://api.buttondown.com/v1/tags \
              -H "Authorization: Token $BUTTONDOWN_SUBSCRIBE_KEY" -H "Content-Type: application/json" \
              -d "{\"name\": \"$tag\", \"color\": \"$TAG_COLOR\"}")
            if [ "$status" = 201 ]; then
              echo "Made the tag $tag."
            else
              echo "::error::Making the tag $tag: HTTP $status $(cat tag.json)"
              failed=1
            fi
          done
          exit $failed
