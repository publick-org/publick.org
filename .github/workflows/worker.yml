# Deploys the network's Workers, from the engine at the version in
# engine-version: the one that serves every site (wrangler.toml), and the
# scheduler that starts the daily runs (wrangler.scheduler.toml). Run by hand
# after changing any of them: the sites Worker's routes decide which hostnames
# it answers, so it never deploys on its own.
#
# The scheduler needs a GitHub token to start runs: the repository secret
# SCHEDULER_GITHUB_TOKEN, a fine-grained token for this repository with
# Actions and Issues read and write, and for publick-engine with Actions read
# and write (it starts the engine's release). Without it, the scheduler isn't deployed.
#
# The weekly digest's email (the engine's worker/digest.js) takes a Buttondown key for each
# Worker, each set when it's there: BUTTONDOWN_SUBSCRIBE_KEY for the sites Worker's signup
# form (subscribers read and write, sending disabled), and BUTTONDOWN_SEND_KEY for the
# scheduler's Sunday send (emails read and write, sending enabled).
name: Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github

      - id: engine
        run: echo "ref=$(tr -d '[:space:]' < engine-version)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: publick-org/publick-engine
          ref: ${{ steps.engine.outputs.ref }}
          path: .publick-engine

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Test the Workers
        run: node --test .publick-engine/worker/sites.test.js .publick-engine/worker/scheduler.test.js

      - name: Deploy the sites Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: Give the sites Worker the digest signup's key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUTTONDOWN_SUBSCRIBE_KEY: ${{ secrets.BUTTONDOWN_SUBSCRIBE_KEY }}
        run: |
          if [ -z "$BUTTONDOWN_SUBSCRIBE_KEY" ]; then
            echo "::warning::BUTTONDOWN_SUBSCRIBE_KEY isn't set, so the digest's signup form can't sign anyone up."
            exit 0
          fi
          printf '%s' "$BUTTONDOWN_SUBSCRIBE_KEY" | npx --yes wrangler@4 secret put BUTTONDOWN_SUBSCRIBE_KEY

      # After the sites Worker, which its service binding names. The token is set right after the deploy
      # (a secret can only be set on a Worker that exists); a start in between would only fail once.
      - name: Deploy the scheduler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SCHEDULER_GITHUB_TOKEN: ${{ secrets.SCHEDULER_GITHUB_TOKEN }}
        run: |
          if [ -z "$SCHEDULER_GITHUB_TOKEN" ]; then
            echo "::warning::SCHEDULER_GITHUB_TOKEN isn't set, so the scheduler isn't deployed; runs start on GitHub's schedule."
            exit 0
          fi
          npx --yes wrangler@4 deploy -c wrangler.scheduler.toml
          printf '%s' "$SCHEDULER_GITHUB_TOKEN" | npx --yes wrangler@4 secret put GITHUB_TOKEN -c wrangler.scheduler.toml

      - name: Give the scheduler the digest send's key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SCHEDULER_GITHUB_TOKEN: ${{ secrets.SCHEDULER_GITHUB_TOKEN }}
          BUTTONDOWN_SEND_KEY: ${{ secrets.BUTTONDOWN_SEND_KEY }}
        run: |
          if [ -z "$SCHEDULER_GITHUB_TOKEN" ] || [ -z "$BUTTONDOWN_SEND_KEY" ]; then
            echo "::warning::The scheduler or BUTTONDOWN_SEND_KEY isn't there, so the weekly digest isn't sent."
            exit 0
          fi
          printf '%s' "$BUTTONDOWN_SEND_KEY" | npx --yes wrangler@4 secret put BUTTONDOWN_SEND_KEY -c wrangler.scheduler.toml
