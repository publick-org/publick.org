# Deploys the Worker that serves every site (wrangler.toml), from the engine
# at the version in engine-version. Run by hand after changing either: the
# Worker's routes decide which hostnames it answers, so it never deploys on
# its own.
name: Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github

      - id: engine
        run: echo "ref=$(tr -d '[:space:]' < engine-version)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          repository: publick-org/publick-engine
          ref: ${{ steps.engine.outputs.ref }}
          path: .publick-engine

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test the Worker
        run: node --test .publick-engine/worker/index.test.js

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
