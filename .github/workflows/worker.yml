# Deploys the network's Workers, from the engine at the version in
# engine-version: the one that serves every site (wrangler.toml), and the
# scheduler that starts the daily runs (wrangler.scheduler.toml).
#
# It runs by itself when engine-version moves to an engine whose Workers
# (its worker/) changed, so the sites Worker always reads what the engine
# publishes (a release it can't read would take every site down until it was
# deployed), and when wrangler.scheduler.toml changes (a new Cron Trigger).
# wrangler.toml decides which hostnames the sites Worker answers, so a change
# to it alone deploys only by hand (Run workflow); but what's on main is what
# any deploy uses, so change it only when it's ready.
#
# The scheduler needs a GitHub token to start runs: the repository secret
# SCHEDULER_GITHUB_TOKEN, a fine-grained token for this repository with
# Actions and Issues read and write, and for publick-engine with Actions read
# and write (it starts the engine's release). Without it, the scheduler isn't deployed.
#
# The weekly digest's email (the engine's worker/digest.js) takes a Buttondown key for each
# Worker, each set when it's there: BUTTONDOWN_SUBSCRIBE_KEY for the sites Worker's signup
# form (subscribers read and write, sending disabled), and BUTTONDOWN_SEND_KEY for the
# scheduler's Sunday send (emails read and write, sending enabled).
name: Worker

on:
  push:
    branches: [main]
    paths: [engine-version, wrangler.scheduler.toml]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, in order.
concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github

      - id: engine
        run: echo "ref=$(tr -d '[:space:]' < engine-version)" >> "$GITHUB_OUTPUT"

      # With its history, to compare the Workers between the engine versions a push moved between.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: publick-org/publick-engine
          ref: ${{ steps.engine.outputs.ref }}
          path: .publick-engine
          fetch-depth: 0

      # A push deploys when the scheduler's config changed, or the engine's Workers did between the old
      # engine-version and the new; anything it can't compare deploys. Run by hand, it always deploys.
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          NEW: ${{ steps.engine.outputs.ref }}
        run: |
          deploy=true
          if [ "$EVENT" = push ] && git fetch --quiet --depth=1 origin "$BEFORE" 2>/dev/null; then
            old=$(git show "$BEFORE:engine-version" 2>/dev/null | tr -d '[:space:]')
            if ! git diff --quiet "$BEFORE" HEAD -- wrangler.scheduler.toml; then
              echo "wrangler.scheduler.toml changed."
            elif [ -n "$old" ] && git -C .publick-engine diff --quiet "$old" "$NEW" -- worker/ 2>/dev/null; then
              echo "The engine's Workers are the same in $old and $NEW: nothing to deploy."
              deploy=false
            else
              echo "The engine's Workers changed from ${old:-?} to $NEW."
            fi
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.decide.outputs.deploy == 'true'
        with:
          node-version: "22"

      - name: Test the Workers
        if: steps.decide.outputs.deploy == 'true'
        run: node --test .publick-engine/worker/sites.test.js .publick-engine/worker/scheduler.test.js

      # wrangler at an exact version (here and below), since it runs with the Cloudflare token: moved by hand.
      - name: Deploy the sites Worker
        if: steps.decide.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.137.0 deploy

      - name: Give the sites Worker the digest signup's key
        if: steps.decide.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUTTONDOWN_SUBSCRIBE_KEY: ${{ secrets.BUTTONDOWN_SUBSCRIBE_KEY }}
        run: |
          if [ -z "$BUTTONDOWN_SUBSCRIBE_KEY" ]; then
            echo "::warning::BUTTONDOWN_SUBSCRIBE_KEY isn't set, so the digest's signup form can't sign anyone up."
            exit 0
          fi
          printf '%s' "$BUTTONDOWN_SUBSCRIBE_KEY" | npx --yes wrangler@4.137.0 secret put BUTTONDOWN_SUBSCRIBE_KEY

      # After the sites Worker, which its service binding names. The token is set right after the deploy
      # (a secret can only be set on a Worker that exists); a start in between would only fail once.
      - name: Deploy the scheduler
        if: steps.decide.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SCHEDULER_GITHUB_TOKEN: ${{ secrets.SCHEDULER_GITHUB_TOKEN }}
        run: |
          if [ -z "$SCHEDULER_GITHUB_TOKEN" ]; then
            echo "::warning::SCHEDULER_GITHUB_TOKEN isn't set, so the scheduler isn't deployed; runs start on GitHub's schedule."
            exit 0
          fi
          npx --yes wrangler@4.137.0 deploy -c wrangler.scheduler.toml
          printf '%s' "$SCHEDULER_GITHUB_TOKEN" | npx --yes wrangler@4.137.0 secret put GITHUB_TOKEN -c wrangler.scheduler.toml

      - name: Give the scheduler the digest send's key
        if: steps.decide.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SCHEDULER_GITHUB_TOKEN: ${{ secrets.SCHEDULER_GITHUB_TOKEN }}
          BUTTONDOWN_SEND_KEY: ${{ secrets.BUTTONDOWN_SEND_KEY }}
        run: |
          if [ -z "$SCHEDULER_GITHUB_TOKEN" ] || [ -z "$BUTTONDOWN_SEND_KEY" ]; then
            echo "::warning::The scheduler or BUTTONDOWN_SEND_KEY isn't there, so the weekly digest isn't sent."
            exit 0
          fi
          printf '%s' "$BUTTONDOWN_SEND_KEY" | npx --yes wrangler@4.137.0 secret put BUTTONDOWN_SEND_KEY -c wrangler.scheduler.toml
