# Meetings' recordings: each town with a [recordings] table has its new
# recordings found on its video platform, matched to their meetings, and
# transcribed by Whisper (the engine's pipeline/fetch_recordings.py), so a
# meeting can be summarized from what was said, the day after, until its
# minutes come. A meeting found only on YouTube is listed with the YouTube
# Data API (YOUTUBE_API_KEY) and transcribed by Gemini from the video's link
# (GEMINI_API_KEY); without them, those meetings wait. When the town and
# YouTube jobs are done, the towns with a new transcript are updated
# (network.yml, meetings only): their transcripts are summarized and their
# sites published then, rather than on the next morning's daily run.
#
# Transcribing takes about an hour for a three-hour meeting, too long for the
# daily run's jobs, so it runs here: a job a town whose recordings Whisper
# transcribes (it needs the machine), and the towns whose only source is
# YouTube in batches of YOUTUBE_BATCH a job, without ffmpeg or Whisper, since
# Gemini transcribes them (minutes a meeting) and a matrix holds at most 256
# jobs. A job writes only its towns' data/meetings/recordings.json and
# recordings_status.json, which no other run writes, so its commit never
# conflicts with the daily run's; the audio and transcripts go in the
# documents bucket.
#
# Most recordings are up the night of the meeting or the next morning. The
# runs from early morning (US Eastern) find them, and the later ones find
# those posted during the day.
name: Recordings

on:
  schedule:
    - cron: "23 5,7,9,13,17 * * *"
  workflow_dispatch:
    inputs:
      towns:
        description: Town folders, comma-separated (empty for every town with [recordings])
        type: string
        default: ""
      hours:
        description: Hours a town's job may spend transcribing; a recording that wouldn't fit waits for the next run
        type: string
        default: "4"
      find_only:
        description: Find and match recordings, but transcribe none
        type: boolean
        default: false

permissions:
  contents: read

env:
  # YouTube-only towns a job: about ten minutes of Gemini a town on a busy morning.
  YOUTUBE_BATCH: 10

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      towns: ${{ steps.towns.outputs.towns }}
      youtube: ${{ steps.towns.outputs.youtube }}
      engine: ${{ steps.towns.outputs.engine }}
      started: ${{ steps.towns.outputs.started }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          # Patterns, not folders: every town's config folder.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            towns/*/config/
            /engine-version

      - id: towns
        env:
          ASKED: ${{ inputs.towns }}
        run: |
          python3 - <<'EOF'
          import glob, json, os, tomllib
          from datetime import datetime, timezone
          asked = {t.strip() for t in os.environ.get("ASKED", "").split(",") if t.strip()}
          platforms = {}
          for path in glob.glob("towns/*/config/*.toml"):
              settings = tomllib.load(open(path, "rb")).get("recordings")
              if settings:
                  platforms[path.split("/")[1]] = {s.get("platform") for s in settings.get("sources", [])}
          if asked:
              unknown = asked - set(platforms)
              if unknown:
                  raise SystemExit(f"No [recordings] for: {', '.join(sorted(unknown))}")
              platforms = {t: platforms[t] for t in asked}
          # A town whose only source is YouTube needs no Whisper: those share jobs.
          whisper = sorted(t for t, p in platforms.items() if p != {"youtube"})
          youtube = sorted(t for t, p in platforms.items() if p == {"youtube"})
          size = int(os.environ["YOUTUBE_BATCH"])
          batches = [",".join(youtube[i:i + size]) for i in range(0, len(youtube), size)]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"towns={json.dumps(whisper)}\n")
              out.write(f"youtube={json.dumps(batches)}\n")
              out.write(f"engine={open('engine-version').read().strip()}\n")
              out.write(f"started={datetime.now(timezone.utc).isoformat(timespec='seconds')}\n")
          print("Whisper:", ", ".join(whisper) or "none")
          print("YouTube:", " | ".join(batches) or "none")
          EOF

  town:
    needs: plan
    if: needs.plan.outputs.towns != '[]'
    name: ${{ matrix.town }}
    runs-on: ubuntu-latest
    # The job's own hours, and the time to read the recordings and save what was made.
    timeout-minutes: 330
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        town: ${{ fromJSON(needs.plan.outputs.towns) }}
    # One run a town at a time: a later run waits, and doesn't transcribe what this one is transcribing.
    concurrency:
      group: recordings-${{ matrix.town }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            defaults
            towns/${{ matrix.town }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: publick-org/publick-engine
          ref: ${{ needs.plan.outputs.engine }}
          path: .publick-engine

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .publick-engine/requirements*.txt

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          pip install -r .publick-engine/requirements.txt -r .publick-engine/requirements-recordings.txt

      - name: Find and transcribe recordings
        env:
          FOLDER: ${{ matrix.town }}
          HOURS: ${{ inputs.hours || '4' }}
          FIND_ONLY: ${{ inputs.find_only && '--find-only' || '' }}
          STORAGE_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID }}
          STORAGE_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        # The town's folder, and the network's shared settings, as the daily run gives them (the engine's network.py).
        run: |
          export PUBLICK_TOWN_DIR="$GITHUB_WORKSPACE/towns/$FOLDER" PUBLICK_NETWORK_DIR="$GITHUB_WORKSPACE"
          slug=$(basename "$PUBLICK_TOWN_DIR"/config/*.toml .toml)
          cd .publick-engine
          python -m pipeline.fetch_recordings --town "$slug" --hours "$HOURS" $FIND_ONLY

      # What was finished is kept even when the step failed partway.
      - name: Commit what was found and transcribed
        if: ${{ !cancelled() }}
        env:
          FOLDER: ${{ matrix.town }}
          COMMIT_ATTEMPTS: 10
        run: |
          .publick-engine/.github/scripts/commit-data.sh "Update recordings for $FOLDER" \
            "towns/$FOLDER/data/meetings/recordings.json" "towns/$FOLDER/data/meetings/recordings_status.json"

  # The towns whose job (a town's own, or a YouTube batch's) transcribed something in this run, as their recordings_status.json says (one
  # written before the run started is a job's that failed before writing it), get a Network run that
  # fetches their meetings' data, summarizes the new transcripts, and publishes. One run for all of
  # them: in network.yml's queue, a waiting run is replaced by a newer one. If a daily start replaces
  # it there, the towns' transcripts wait for their next daily run, as they would without this.
  update:
    needs: [plan, town, youtube]
    if: ${{ !cancelled() && needs.plan.result == 'success' && !inputs.find_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      # The branch as the town jobs left it, not the commit the run started from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            towns/*/data/meetings/recordings_status.json

      - name: Update the towns with new transcripts
        env:
          TOWNS: ${{ needs.plan.outputs.towns }}
          YOUTUBE: ${{ needs.plan.outputs.youtube }}
          STARTED: ${{ needs.plan.outputs.started }}
          GH_TOKEN: ${{ github.token }}
        run: |
          towns=$(python3 - <<'EOF'
          import json, os
          from datetime import datetime
          started = datetime.fromisoformat(os.environ["STARTED"])
          new = []
          towns = json.loads(os.environ["TOWNS"]) + [t for batch in json.loads(os.environ["YOUTUBE"]) for t in batch.split(",")]
          for town in towns:
              try:
                  status = json.load(open(f"towns/{town}/data/meetings/recordings_status.json"))
              except (OSError, ValueError):
                  continue
              if status.get("transcribed") and datetime.fromisoformat(status["updated_at"]) >= started:
                  new.append(town)
          print(",".join(new))
          EOF
          )
          if [ -z "$towns" ]; then
            echo "No new transcripts."
            exit 0
          fi
          echo "New transcripts: $towns"
          gh workflow run network.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f towns="$towns" -f fetch=true -f sources=meetings

  # The towns whose only source is YouTube, YOUTUBE_BATCH a job: Gemini transcribes their meetings from each
  # video's link, so no ffmpeg or Whisper is installed, and the job's hours are shared by its towns in turn.
  youtube:
    needs: plan
    if: needs.plan.outputs.youtube != '[]'
    name: youtube (${{ matrix.towns }})
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        towns: ${{ fromJSON(needs.plan.outputs.youtube) }}
    concurrency:
      group: recordings-youtube-${{ matrix.towns }}
      cancel-in-progress: false
    steps:
      - name: The batch's town folders
        id: folders
        env:
          TOWNS: ${{ matrix.towns }}
        run: |
          {
            echo "paths<<EOF"
            tr ',' '\n' <<< "$TOWNS" | sed 's|^|towns/|'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            defaults
            ${{ steps.folders.outputs.paths }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: publick-org/publick-engine
          ref: ${{ needs.plan.outputs.engine }}
          path: .publick-engine

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .publick-engine/requirements.txt

      - name: Install dependencies
        run: pip install -r .publick-engine/requirements.txt

      # Each town in turn, with what's left of the job's hours; one town's failure doesn't stop the others.
      - name: Find and transcribe recordings
        env:
          TOWNS: ${{ matrix.towns }}
          HOURS: ${{ inputs.hours || '4' }}
          FIND_ONLY: ${{ inputs.find_only && '--find-only' || '' }}
          STORAGE_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID }}
          STORAGE_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          failed=""
          for folder in ${TOWNS//,/ }; do
            left=$(python3 -c "print(max($HOURS - $SECONDS / 3600, 0.05))")
            echo "::group::$folder ($left hours left)"
            export PUBLICK_TOWN_DIR="$GITHUB_WORKSPACE/towns/$folder" PUBLICK_NETWORK_DIR="$GITHUB_WORKSPACE"
            slug=$(basename "$PUBLICK_TOWN_DIR"/config/*.toml .toml)
            (cd .publick-engine && python -m pipeline.fetch_recordings --town "$slug" --hours "$left" $FIND_ONLY) \
              || failed="$failed $folder"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Failed:$failed"
            exit 1
          fi

      # What was finished is kept even when the step failed partway.
      - name: Commit what was found and transcribed
        if: ${{ !cancelled() }}
        env:
          TOWNS: ${{ matrix.towns }}
          COMMIT_ATTEMPTS: 10
        run: |
          files=()
          for folder in ${TOWNS//,/ }; do
            for f in "towns/$folder/data/meetings/recordings.json" "towns/$folder/data/meetings/recordings_status.json"; do
              if [ -e "$f" ]; then files+=("$f"); fi
            done
          done
          [ ${#files[@]} -gt 0 ] || exit 0
          .publick-engine/.github/scripts/commit-data.sh "Update recordings for ${TOWNS//,/, }" "${files[@]}"
