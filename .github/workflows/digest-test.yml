# Sends each town's newest weekly digest issue now, as it would go on Sunday, to the
# test addresses alone, so a change to the email is seen without waiting a week (the
# engine's worker/digest-test.js). It's a Buttondown draft with "[Test]" before its
# subject, sent to those addresses and no subscriber; each test deletes the earlier
# ones' drafts. Run by hand: Actions -> Digest test -> Run workflow.
#
# Left empty, "engine" sends the issue on the town's site now. Given an engine branch,
# tag, or commit, the town's site is built here first, from its data, with that engine,
# to see an engine change's email before it's released.
#
# The addresses are the repository secret DIGEST_TEST_RECIPIENTS, separated by commas: a
# secret, not an input, because this repository's run logs are public. The key is
# BUTTONDOWN_SEND_KEY, the scheduler's.
name: Digest test

on:
  workflow_dispatch:
    inputs:
      towns:
        description: Towns, by folder, separated by spaces
        default: gloucester-ma
        required: true
      engine:
        description: An engine branch, tag, or commit to build with (empty for the issue on the site now)
        default: ""
        required: false

permissions:
  contents: read

concurrency:
  group: digest-test

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The towns' data only to build them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ${{ inputs.engine == '' && '.github' || '' }}

      - id: engine
        env:
          ENGINE: ${{ inputs.engine }}
          TOWNS: ${{ inputs.towns }}
        run: |
          for town in $TOWNS; do
            if ! [[ "$town" =~ ^[a-z0-9-]+$ ]] || { [ -n "$ENGINE" ] && [ ! -d "towns/$town/config" ]; }; then
              echo "::error::$town isn't a town's folder under towns/."
              exit 1
            fi
          done
          echo "ref=${ENGINE:-$(tr -d '[:space:]' < engine-version)}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: publick-org/publick-engine
          ref: ${{ steps.engine.outputs.ref }}
          path: .publick-engine

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - if: inputs.engine != ''
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .publick-engine/requirements*.txt

      # Without share images (Playwright's): the email has none.
      - name: Build the towns
        if: inputs.engine != ''
        env:
          TOWNS: ${{ inputs.towns }}
        run: |
          pip install -r .publick-engine/requirements.txt
          for town in $TOWNS; do
            config=$(basename towns/"$town"/config/*.toml .toml)
            (cd "towns/$town" && PYTHONPATH="$GITHUB_WORKSPACE/.publick-engine" \
              python -m pipeline.build_site --town "$config" --out _site --no-share-cards)
          done

      - name: Send the tests
        env:
          TOWNS: ${{ inputs.towns }}
          BUILT: ${{ inputs.engine != '' }}
          BUTTONDOWN_SEND_KEY: ${{ secrets.BUTTONDOWN_SEND_KEY }}
          DIGEST_TEST_RECIPIENTS: ${{ secrets.DIGEST_TEST_RECIPIENTS }}
        run: |
          sources=()
          for town in $TOWNS; do
            if [ "$BUILT" = true ]; then sources+=("towns/$town/_site/digest/feed.xml"); else sources+=("$town.publick.org"); fi
          done
          node .publick-engine/worker/digest-test.js "${sources[@]}"
