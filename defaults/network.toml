# Settings every town in the network shares. Each town's config
# (towns/<town>-<state>/config/<town>.toml) is read over its state's
# (defaults/states/<st>.toml), and that over this file: a town's own value wins,
# and tables merge key by key. A table here fills in a town's table of the same
# name only when the town's config has that table ([seeclickfix] completes a
# 311 town's, and gives 311 to no other); [terms] and [strings] go to every
# town. The engine's pipeline/config.py says what may be set here, and
#
#   PUBLICK_TOWN_DIR=towns/<town>-<state> python -m pipeline.config show
#
# prints a town's config with the file each value came from.

[site]
# The network of town sites each one belongs to, named in every page footer;
# the masthead shows the town's name_prefix, then name_suffix in the accent
# color.
name_suffix = "Publick"
network = "Publick"
network_url = "https://publick.org"
repo_url = "https://github.com/publick-org/publick.org"
timezone = "America/New_York"
# English at the site's root, Spanish under /es/.
languages = ["en", "es"]

# Page view counting with GoatCounter (goatcounter.com): no cookies, no
# personal data, and never what someone searched for. Every town counts on the
# network's site, publick; a town's [analytics] prefix is its folder, put in
# front of every page path so the one dashboard can tell the towns apart.
# public_stats is the dashboard's public URL, if it has one; the About page
# links it.
[analytics]
goatcounter = "publick"
public_stats = ""

# Agenda and minutes PDFs live in the network's documents bucket, not in git
# (see the engine's pipeline/documents.py), each town under its [storage]
# prefix. Keys: STORAGE_ACCESS_KEY_ID, STORAGE_SECRET_ACCESS_KEY.
[storage]
endpoint = "https://6bbfee5a3892553c7993dbfa4b4e8453.r2.cloudflarestorage.com"
bucket = "publick-documents"
public_url = "https://files.publick.org"

# Plain-English agenda text and previews, and decisions from minutes, written by
# a language model and labeled as AI-generated on the site. Each run does the
# most useful first (upcoming agendas, then the newest minutes) and stops at
# max_per_run documents or max_cost_per_run dollars. A town's [summaries] gives
# its own `since`: only meetings from then on are summarized.
[summaries]
model = "claude-haiku-5-5"
# Sent with every summary and transcription request, one at a time or in a
# batch (low, medium, high, xhigh, or max).
effort = "high"
max_per_run = 40
# Prices per million tokens, for the spending limit below. A batch is priced at
# half of each.
input_price = 0.1
output_price = 0.5
# A request whose prompt is over long_prompt_tokens is priced, input and output,
# at the long prices: in the ledger, and in the estimate that decides whether a
# document fits a run's budget before it's sent.
long_prompt_tokens = 100_000
long_input_price = 0.5
long_output_price = 2.5
# A ceiling for one run. The network's monthly summary budget (SUMMARY_BUDGET in
# .github/workflows/network.yml) decides what each run may spend, new documents first.
max_cost_per_run = 5.0
# Summaries in the site's other languages, translated from the English summary,
# with their prices per million tokens (a translation's prompt is far under
# long_prompt_tokens).
translation_model = "claude-haiku-5-5"
translation_effort = "high"
translation_input_price = 0.1
translation_output_price = 0.5
# The AI review of each translation's meaning, by a second model.
translation_review_model = "claude-sonnet-5-5"
translation_review_effort = "low"
translation_review_input_price = 2.0
translation_review_output_price = 10.0

# New agendas and minutes can wait this long for a summary before the daily run
# flags them. Older ones are summarized a little each day within the network's
# budget and aren't counted.
[freshness]
summary_grace_days = 2

# The weekly digest's email signup, on /digest/ (the engine's pipeline/digest.py),
# for a town whose config has [digest]. The form posts to the site's
# /digest/subscribe, which the sites Worker answers (worker/digest.js) and
# passes on to Buttondown with the town's tag, <town>-<state>-en. The About page
# names who keeps the addresses.
[digest]
signup = true
provider = "Buttondown"
privacy_url = "https://buttondown.com/legal/privacy"

# 311 requests from SeeClickFix (public requests only), for a town whose config
# has [seeclickfix], with its organization_id and report_url.
[seeclickfix]
open311_base = "https://seeclickfix.com/open311/v2"
api_base = "https://seeclickfix.com/api/v2"
# SeeClickFix documents a limit of 20 requests per minute.
request_delay = 3.2
recent_days = 21
max_details_per_run = 700
time_budget_seconds = 2400

# Repeat locations: requests in the same category within radius_m meters and
# window_days days of each other are grouped as one place.
[seeclickfix.repeats]
radius_m = 50
window_days = 60
recent_open_days = 30

# The glossary: terms that read the same in every state, each in every language
# the sites have (pipeline/glossary.py in the engine). Each is in every town's
# glossary page and its meeting pages, and the translator is given it and
# checked against it; a state's term of the same name wins. A term is keyed by
# its English; each language's column gives its wording there (term) and its
# definition, and, where it's written other ways, also or pattern. Where
# Spanish has no word for a term, its wording keeps the English in
# parentheses. Another language is another column.

[terms.abatement]
en = { definition = "A reduction or cancellation of a property tax bill, granted by the assessors, for example after an error in the assessment.", also = ["abate"], pattern = '(?<![\w.])(?<!lead )(?<!paint )(?<!graffiti )(?<!opioid )(?<!asbestos )(?<!noise )(?<!nuisance )(?<!mold )(?<!radon )(?<!pest )(?<!hazard )abate(?:ment)?s?(?!\w)' }
es = { term = "reducción de impuestos (abatement)", definition = "Una rebaja o cancelación de la factura del impuesto a la propiedad, que otorgan los tasadores, por ejemplo después de un error en la tasación.", pattern = '\b(?:reduc|rebaj|exonera|condon)\w*' }

[terms.ADA]
en = { definition = "Americans with Disabilities Act, the federal law on access for people with disabilities." }
es = { term = "Ley de Estadounidenses con Discapacidades (ADA)", definition = "La Ley de Estadounidenses con Discapacidades (Americans with Disabilities Act), la ley federal sobre el acceso de las personas con discapacidades." }

[terms.CBA]
en = { definition = "Collective bargaining agreement: a contract between the city or town and a union of its employees, setting pay and working conditions." }
es = { term = "convenio colectivo (CBA)", definition = "Convenio colectivo (collective bargaining agreement): un contrato entre la ciudad o el pueblo y un sindicato de sus empleados, que fija el sueldo y las condiciones de trabajo." }

[terms.CDBG]
en = { definition = "Community Development Block Grant: federal money, from the Department of Housing and Urban Development, for housing and neighborhood projects that serve low- and moderate-income residents." }
es = { term = "Subvención en Bloque para el Desarrollo Comunitario (CDBG)", definition = "Subvención en Bloque para el Desarrollo Comunitario (Community Development Block Grant): dinero federal del Departamento de Vivienda y Desarrollo Urbano para proyectos de vivienda y de barrios que benefician a residentes de ingresos bajos y moderados." }

[terms.CIP]
en = { definition = "Capital Improvement Program: the plan for buildings, roads, equipment, and other long-lasting purchases over the next several years, and how to pay for them." }
es = { term = "Programa de Mejoras de Capital (CIP)", definition = "Programa de Mejoras de Capital (Capital Improvement Program): el plan de edificios, calles, equipos y otras compras duraderas para los próximos años, y de cómo pagarlas." }

[terms.COLA]
en = { definition = "Cost-of-living adjustment: a raise in pay or a pension to keep up with rising prices." }
es = { term = "ajuste por costo de vida (COLA)", definition = "Ajuste por costo de vida (cost-of-living adjustment): un aumento del sueldo o de la pensión para compensar la subida de los precios." }

[terms."Committee of the Whole"]
en = { definition = "The full council or board meeting as a committee, to discuss a matter before voting on it at a regular meeting." }
es = { term = "Comité Plenario (Committee of the Whole)", definition = "El concejo o la junta completa reunida como comité, para hablar de un asunto antes de votarlo en una reunión ordinaria." }

[terms."consent agenda"]
en = { definition = "Routine items, such as minutes and reports, voted on together in one motion without discussion. A member can ask to take any of them up separately." }
es = { term = "agenda de consentimiento (consent agenda)", definition = "Asuntos de rutina, como actas e informes, que se votan juntos en una sola moción y sin discusión. Cualquier miembro puede pedir que uno se trate por separado.", also = ["calendario de consentimiento"] }

[terms."first reading"]
en = { definition = "The first time a council or board takes up an ordinance or other measure. It usually votes on it at a later meeting." }
es = { term = "primera lectura", definition = "La primera vez que un concejo o una junta trata una ordenanza u otra medida. Normalmente la vota en una reunión posterior." }

[terms."mill rate"]
en = { definition = "The property tax rate, in dollars for each $1,000 of a property's assessed value. A mill is a tenth of a cent." }
es = { term = "tasa por mil (mill rate)", definition = "La tasa del impuesto a la propiedad, en dólares por cada $1,000 del valor tasado de una propiedad. Un mil (mill) es la décima parte de un centavo." }

[terms."quitclaim deed"]
en = { definition = "A deed in which the city or town gives up whatever claim it has to a property, such as one it took for unpaid taxes." }
es = { term = "escritura de renuncia (quitclaim deed)", definition = "Una escritura con la que la ciudad o el pueblo renuncia a cualquier derecho que tenga sobre una propiedad, como una que tomó por impuestos sin pagar.", also = ["escritura de cesión de derechos"] }

[terms."receive and file"]
en = { definition = "To accept a letter, report, or other document into the record, without taking any other action on it.", also = ["received and filed", "receives and files"] }
es = { term = "recibir y archivar", definition = "Aceptar una carta, un informe u otro documento en el registro, sin tomar ninguna otra medida sobre él.", pattern = '\brecib\w*\s+y\s+(?:se\s+)?archiv\w*' }

[terms."Select Board"]
en = { definition = "The board of three to five elected residents that runs a town between town meetings: it sets policy, hires the town manager or administrator, and calls town meeting. Also called the Board of Selectmen or the Selectboard.", also = ["Board of Selectmen", "Selectboard", "selectmen"] }
es = { term = "Junta de Gobierno (Select Board)", definition = "La junta de tres a cinco residentes elegidos que gobierna un pueblo entre una asamblea municipal y otra: fija las políticas, contrata al administrador del pueblo y convoca la asamblea municipal. También se llama Board of Selectmen o Selectboard." }

[terms.tabled]
en = { definition = "Set aside by a vote, to take up later. A tabled item comes back when the board votes to take it off the table." }
es = { term = "pospuesto (tabled)", definition = "Dejado de lado mediante una votación, para tratarlo más adelante. Un asunto pospuesto vuelve cuando la junta vota para retomarlo.", pattern = '\b(?:pospu|pospon|posterg|aplaz|difiri|dej\w*\s+sobre\s+la\s+mesa|sobre\s+la\s+mesa)\w*' }

[terms.TIF]
en = { definition = "Tax increment financing: a district where some of the new property tax from development is set aside, for public projects or for the development itself." }
es = { term = "financiamiento por incremento de impuestos (TIF)", definition = "Financiamiento por incremento de impuestos (tax increment financing): una zona donde parte del nuevo impuesto a la propiedad que generan las construcciones se reserva para proyectos públicos o para el propio proyecto." }

[terms."town meeting"]
en = { definition = "A meeting of a town's voters that acts as its legislature: it votes on the budget, local laws, and the other articles of the warrant. In a representative town meeting, elected members vote." }
es = { term = "asamblea municipal (town meeting)", definition = "Una reunión de los votantes de un pueblo que hace de su poder legislativo: vota el presupuesto, las leyes locales y los demás artículos de la convocatoria. En una asamblea municipal representativa votan miembros elegidos." }

[terms.variance]
en = { definition = "Permission from the zoning board to use or build on a property in a way the zoning doesn't allow, such as closer to a lot line, because of a hardship particular to the property." }
es = { term = "variación", definition = "Permiso de la junta de zonificación para usar una propiedad o construir en ella de una manera que la zonificación no permite, como más cerca del límite del terreno, por una dificultad propia de esa propiedad." }

[terms."warrant article"]
en = { definition = "One item on the warrant, the list of what a town meeting will vote on. Each article is voted on separately." }
es = { term = "artículo de la convocatoria (warrant article)", definition = "Un asunto de la convocatoria (warrant), la lista de lo que votará una asamblea municipal. Cada artículo se vota por separado.", pattern = '\barticulos?\b[^.;:]{0,30}\bconvocatoria\b' }
