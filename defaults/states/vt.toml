# Settings every town in Vermont shares, under each town's own config
# (towns/<town>-vt/config/<town>.toml), which wins, and over the network's
# (defaults/network.toml). See defaults/network.toml for how they merge.

[town]
state = "Vermont"

# Housing: Census building permits (the state's FIPS code and Census region) and
# American Community Survey figures for the state, through Census Reporter, for
# context. A town's [housing] gives its own place.
[housing]
bps_region = "Northeast Region"
bps_prefix = "ne"
bps_state = "50"
state_geo = "04000US50"

# Unemployment rate (BLS Local Area Unemployment Statistics): the state series,
# shown for context with each town's own, from BLS's file for Vermont.
[labor]
state_series = "LAUST500000000000003"
bulk_file = "la.data.53.Vermont"

# Glossary definitions for Vermont law and its terms: a town's [[glossary]] entry
# with only its term takes the definition from here.
[terms]
"executive session" = "A part of a public meeting closed to the public. Vermont's Open Meeting Law allows it only for specific reasons, such as lawsuits, contracts, or personnel matters, and no final decision may be made in it."
"VSA" = "Vermont Statutes Annotated, the state's laws (also written V.S.A.)."

# The definitions above in Spanish.
[strings.es]
"A part of a public meeting closed to the public. Vermont's Open Meeting Law allows it only for specific reasons, such as lawsuits, contracts, or personnel matters, and no final decision may be made in it." = "Una parte de una reunión pública que se hace a puerta cerrada. La ley de reuniones abiertas de Vermont la permite solo por razones específicas, como demandas, contratos o asuntos de personal, y en ella no se puede tomar ninguna decisión final."
"Vermont Statutes Annotated, the state's laws (also written V.S.A.)." = "Estatutos Anotados de Vermont (Vermont Statutes Annotated), las leyes del estado (también se escribe V.S.A.)."
