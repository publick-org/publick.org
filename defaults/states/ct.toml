# Settings every town in Connecticut shares, under each town's own config
# (towns/<town>-ct/config/<town>.toml), which wins, and over the network's
# (defaults/network.toml). See defaults/network.toml for how they merge.

[town]
state = "Connecticut"

# Housing: Census building permits (the state's FIPS code and Census region) and
# American Community Survey figures for the state, through Census Reporter, for
# context. A town's [housing] gives its own place.
[housing]
bps_region = "Northeast Region"
bps_prefix = "ne"
bps_state = "09"
state_geo = "04000US09"

# Unemployment rate (BLS Local Area Unemployment Statistics): the state series,
# shown for context with each town's own, from BLS's file for Connecticut.
[labor]
state_series = "LAUST090000000000003"
bulk_file = "la.data.13.Connecticut"

# The glossary: Connecticut's terms, its laws and what they call things, each in
# every language the sites have (see defaults/network.toml). They win over the
# network's terms of the same name; a town's own [[glossary]] entry wins over
# both.

[terms."C.G.S."]
en = { definition = "Connecticut General Statutes, the state's laws." }
es = { term = "Estatutos Generales de Connecticut (C.G.S.)", definition = "Estatutos Generales de Connecticut (Connecticut General Statutes), las leyes del estado." }

[terms."executive session"]
en = { definition = "A part of a public meeting closed to the public. State law allows it only for specific reasons, such as lawsuits, real estate purchases, or personnel matters." }
es = { term = "sesión ejecutiva", definition = "Una parte de una reunión pública que se hace a puerta cerrada. La ley estatal la permite solo por razones específicas, como demandas, compras de bienes raíces o asuntos de personal." }

[terms."special permit"]
en = { definition = "Permission from the planning and zoning commission for a use the zoning regulations allow only with its approval, usually after a public hearing." }
es = { term = "permiso especial", definition = "Permiso de la comisión de planificación y zonificación para un uso que el reglamento de zonificación permite solo con su aprobación, normalmente después de una audiencia pública." }
