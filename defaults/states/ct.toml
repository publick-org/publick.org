# Settings every town in Connecticut shares, under each town's own config
# (towns/<town>-ct/config/<town>.toml), which wins, and over the network's
# (defaults/network.toml). See defaults/network.toml for how they merge.

[town]
state = "Connecticut"

# Housing: Census building permits (the state's FIPS code and Census region) and
# American Community Survey figures for the state, through Census Reporter, for
# context. A town's [housing] gives its own place.
[housing]
bps_region = "Northeast Region"
bps_prefix = "ne"
bps_state = "09"
state_geo = "04000US09"

# Unemployment rate (BLS Local Area Unemployment Statistics): the state series,
# shown for context with each town's own, from BLS's file for Connecticut.
[labor]
state_series = "LAUST090000000000003"
bulk_file = "la.data.13.Connecticut"

# Glossary definitions for Connecticut law and its terms: a town's [[glossary]] entry
# with only its term takes the definition from here.
[terms]
"executive session" = "A part of a public meeting closed to the public. State law allows it only for specific reasons, such as lawsuits, real estate purchases, or personnel matters."
"C.G.S." = "Connecticut General Statutes, the state's laws."

# The definitions above in Spanish.
[strings.es]
"A part of a public meeting closed to the public. State law allows it only for specific reasons, such as lawsuits, real estate purchases, or personnel matters." = "Una parte de una reunión pública que se hace a puerta cerrada. La ley estatal la permite solo por razones específicas, como demandas, compras de bienes raíces o asuntos de personal."
"Connecticut General Statutes, the state's laws." = "Estatutos Generales de Connecticut (Connecticut General Statutes), las leyes del estado."
