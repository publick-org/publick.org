# The town's own text in Spanish, keyed by its English as written above or as
# the data writes it (board names). Plain Spanish addressed as usted, following
# the engine's site/strings/es-guide.md and Lawrence's and Manchester's tables
# where the English is the same. A board's name is given in Spanish only; the
# site shows its English name after it. Not checked by a person: the site says
# it's translated with AI.
[strings.es]
# The masthead and the share text.
"Public data on how Lewiston, Maine decides and spends. Updated daily." = "Datos públicos sobre cómo Lewiston, Maine, toma decisiones y gasta su dinero. Se actualizan a diario."
"An independent guide to city government in Lewiston, Maine" = "Una guía independiente sobre el gobierno de la ciudad de Lewiston, Maine"

# Section summaries (the engine translates the section names every town shares).
"When the City Council, the Finance Committee, the Planning Board, and the city's other boards meet, with agendas, and minutes from January 2026 on." = "Cuándo se reúnen el Concejo Municipal, el Comité de Finanzas, la Junta de Planificación y las demás juntas de la ciudad, con sus agendas, y las actas desde enero de 2026."
"The city's tax rate and what the property tax raises, compared with Maine's other towns, and the average single-family tax bill." = "La tasa del impuesto a la propiedad de la ciudad y lo que recauda, comparadas con las de los demás municipios de Maine, y la factura promedio del impuesto a la propiedad de una casa unifamiliar."
"Lewiston Public Schools' graduation rate, absenteeism, state test results, and spending per pupil, with the state's." = "La tasa de graduación de las Escuelas Públicas de Lewiston, el ausentismo, los resultados de los exámenes estatales y el gasto por estudiante, comparados con los del estado."
"The mayor, City Council, and School Committee, by office and by ward, and how to reach them." = "El alcalde, el Concejo Municipal y el Comité Escolar, por cargo y por distrito, y cómo comunicarse con ellos."

# Where the city posts agendas and minutes, and the data the site keeps up to date.
"city's Archive Center" = "Centro de Archivos de la ciudad"
"Meetings (city calendar)" = "Reuniones (calendario de la ciudad)"

# How to take part.
"Any Lewiston resident or taxpayer may speak during the public comment period of a regular meeting, for up to 3 minutes. Residents who can't attend can email comments on an agenda item to publiccomments@lewistonmaine.gov, and they are forwarded to the mayor and councilors before the meeting." = "Cualquier residente o contribuyente de Lewiston puede hablar durante el turno de comentarios del público en una reunión regular, hasta 3 minutos. Quienes no puedan asistir pueden enviar sus comentarios sobre un punto de la agenda por correo electrónico a publiccomments@lewistonmaine.gov, y se envían al alcalde y a los concejales antes de la reunión."
"Mayor & City Council page" = "Página del Alcalde y el Concejo Municipal"
"the City of Lewiston's YouTube channel" = "el canal de YouTube de la Ciudad de Lewiston"
"Public comments must be made in person at School Committee meetings." = "Los comentarios del público se hacen en persona en las reuniones del Comité Escolar."
"School Committee page" = "Página del Comité Escolar"
"Lewiston Public Schools' archived meeting videos" = "los videos de reuniones anteriores de las Escuelas Públicas de Lewiston"

# Glossary definitions (the terms themselves stay as the agendas write them).
"A part of a public meeting closed to the public. State law (1 MRSA §405) allows it only for specific reasons, such as lawsuits, real estate, or personnel matters." = "Una parte de una reunión pública que se hace a puerta cerrada. La ley estatal (1 MRSA §405) la permite solo por razones específicas, como demandas, bienes raíces o asuntos de personal."
"Maine Revised Statutes Annotated, the state's laws." = "Estatutos Revisados Anotados de Maine (Maine Revised Statutes Annotated), las leyes del estado."
"Routine items, marked with an asterisk on the City Council's agenda, voted on together in one motion unless a councilor or a resident asks to take one up separately." = "Asuntos de rutina, marcados con un asterisco en la agenda del Concejo Municipal, que se votan juntos en una sola moción, a menos que un concejal o un residente pida tratar alguno por separado."
