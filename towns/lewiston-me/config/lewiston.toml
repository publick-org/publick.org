# Site configuration for Lewiston, Maine. Everything town-specific lives here;
# the code is the Publick engine (github.com/publick-org/publick-engine).
# Build with: python -m pipeline.build_site --town lewiston (with the engine on PYTHONPATH)
#
# The network's first Maine city. Lewiston's website runs on CivicPlus, as
# Gloucester's does: the city calendar lists the meetings and links each one's
# agenda in the Archive Center, where the City Clerk also posts minutes, one
# collection per board (and, for the City Council, the Finance Committee and the
# Planning Board, one per year). Its Agenda Center is empty. The School Committee
# posts its agendas and minutes in public Google Drive folders, a folder per
# meeting, which the engine doesn't read yet, so its meetings aren't listed. The
# city doesn't use SeeClickFix, so the site has no 311 section. The engine's
# Maine package gives the tax rate, the property tax, and the tax bill, from
# Maine Revenue Services and the Maine GeoLibrary ([finance]), and school
# figures, from the Department of Education's ESSA Dashboard ([schools]);
# housing and unemployment come from the Census and BLS, as for every town.
#
# The site is in English and Spanish ([site] languages), as every town in the
# network is. Many of Lewiston's residents came from Somalia and other African
# countries and read Somali, French, Portuguese, Lingala or Arabic first; those
# languages aren't offered yet. [strings.es], at the end, gives the Spanish for
# the town's own text; the engine has the rest.

[site]
name = "Lewiston Publick"
# The masthead shows name_prefix in dark ink and name_suffix in the accent
# color: the town, then the network.
name_prefix = "Lewiston "
name_suffix = "Publick"
domain = "lewiston-me.publick.org"
# The network of town sites this one belongs to, named in every page footer.
network = "Publick"
network_url = "https://publick.org"
tagline = "Public data on how Lewiston, Maine decides and spends. Updated daily."
# One line under the name at the top of every page.
masthead = "An independent guide to city government in Lewiston, Maine"
repo_url = "https://github.com/publick-org/publick.org"
# Public contact address. Shown on the About and Accessibility pages when set.
contact_email = "lewiston-me@publick.org"
timezone = "America/New_York"
user_agent = "lewiston-me.publick.org (+https://lewiston-me.publick.org/about/)"
# English at the site's root, Spanish under /es/.
languages = ["en", "es"]

# From the city website's stylesheet (lewistonmaine.gov): its navy (the toolbar
# and calendar headings), a darker navy, a light tint of the navy, and its
# rust (links on hover). Each passes WCAG AA on white: 9.3, 12.0 and 4.7 to 1.
# Its bright blue (#0098f7, 3.1 to 1) doesn't, so it isn't used.
[site.colors]
primary = "#064a76"
primary_dark = "#003b51"
primary_soft = "#e6edf2"
accent = "#b7582e"

[town]
name = "Lewiston"
state = "Maine"
state_abbr = "ME"
official_site = "https://www.lewistonmaine.gov"

# Sections appear in the main navigation in this order. Each one is a folder
# under site/pages/<slug>/ and is served at https://<domain>/<slug>/.
[[sections]]
slug = "meetings"
title = "Meetings"
summary = "When the City Council, the Finance Committee, the Planning Board, and the city's other boards meet, with agendas, and minutes from January 2026 on."
status = "live"

[[sections]]
slug = "budget"
title = "City budget"
nav = "Budget"
summary = "The city's tax rate and what the property tax raises, compared with Maine's other towns, and the average single-family tax bill."
status = "live"

[[sections]]
slug = "schools"
title = "Schools"
summary = "Lewiston Public Schools' graduation rate, absenteeism, state test results, and spending per pupil, with the state's."
status = "live"

[[sections]]
slug = "housing"
title = "Housing"
summary = "New homes permitted, home values and rents, and the housing stock."
status = "live"

[[sections]]
slug = "officials"
title = "Who represents you"
nav = "Officials"
summary = "The mayor, City Council, and School Committee, by office and by ward, and how to reach them."
status = "live"

[[sections]]
slug = "about"
title = "About"
summary = "Data sources, update schedule, metric definitions, and corrections."
status = "live"

# Page view counting with GoatCounter, on the network's site; prefix is this
# town's folder.
[analytics]
goatcounter = "publick"
prefix = "lewiston-me"
public_stats = ""

# Public meetings, from the city's CivicPlus calendar, with agendas linked
# from its events into the Archive Center.
[meetings]
base_url = "https://www.lewistonmaine.gov"
archive_url = "https://www.lewistonmaine.gov/Archive.aspx"
archive_name = "city's Archive Center"
# The city's site resets some connections; a slower pace and the client's retries help.
request_delay = 5.0
max_event_pages = 40
# The Main City Calendar has festivals, races, and elections next to a few
# committees' meetings: only titles with these words are public meetings.
include_pattern = '\b(board|commission|committee|council|authority|meeting|hearing|workshop)\b'
# "Lewiston Housing Authority Wedgewood Development Updates" was a public
# information session, not a meeting of the authority.
exclude_pattern = '\bupdates?\b'

# The city calendar, read month by month: this month and the next two. Each
# board with a calendar of its own, and the Main City Calendar, where the
# Public Art Committee, the Public Safety Committee and the 9-1-1 Committee are.
[meetings.civicplus]
calendars = ["City Council Meetings & Workshops", "Finance Committee", "Planning Board", "Complete Street Committee", "Main City Calendar"]

# Calendar titles and Archive Center collections, as the board's usual name.
# The City Council meets as a workshop and a regular meeting the same evening,
# listed as one event ("City Council Workshop & Meeting").
[meetings.aliases]
"City Council Workshop &" = "City Council"
"City Council Workshop" = "City Council"
"City Council Budget Workshop" = "City Council"
"City Council Budget Workshop &" = "City Council"
"City Council Meeting & Budget Workshop" = "City Council"
"City Council Budget Public Hearing &" = "City Council"
"911 Committee" = "9-1-1 Committee"
# The calendar numbers the Public Safety Committee's meetings; a meeting
# numbered past these needs a line here.
"Public Safety Committee Meeting #4" = "Public Safety Committee"
"Public Safety Committee Meeting #5" = "Public Safety Committee"
"Public Safety Committee Meeting #6" = "Public Safety Committee"
"Public Safety Committee Meeting #7" = "Public Safety Committee"
"Public Safety Committee Meeting #8" = "Public Safety Committee"

# Minutes from the city's Archive Center. Minutes for meetings on or after
# minutes_since are collected: January 2026, when the councilors elected in
# November 2025 took office. The City Council's and the Finance Committee's
# minutes are text; the Planning Board's, and some of the Historic Preservation
# Review Board's, are scans, which the model transcribes after the month's
# summaries. The City Council's, the Finance Committee's and the Planning
# Board's collections are named by year ("City Council Meeting Minutes 2026",
# "Finance Committee - Minutes 2026", "Planning Board Minutes 2026 - 2030"),
# which the engine doesn't yet take for minutes collections: until it does,
# their minutes aren't collected. The 9-1-1 Committee's collection ("CMT 911
# Agendas and Minutes") holds some agendas too, which are saved as minutes.
[archive]
index = "Archive.aspx"
minutes_since = "2026-01-01"

# Archive collection names (without "Minutes") mapped to the boards' usual names.
[archive.aliases]
"CDBG" = "Community Development Block Grant Committee"
"CMT Historic Preservation Review Board" = "Historic Preservation Review Board"
"CMT Public Art Committee" = "Public Art Committee"
"CMT 911 Agendas and" = "9-1-1 Committee"
"CMT 911" = "9-1-1 Committee"

# Agenda and minutes PDFs, in the network's documents bucket.
[storage]
endpoint = "https://6bbfee5a3892553c7993dbfa4b4e8453.r2.cloudflarestorage.com"
bucket = "publick-documents"
public_url = "https://files.publick.org"
prefix = "lewiston-me"

# Agenda previews and decisions from minutes, written by a language model and
# labeled as AI-generated on the site, and their Spanish translations. Within
# the network's monthly budget. Only meetings from `since` on are summarized,
# so the city's first months don't take the month's budget; older meetings keep
# their records and documents. The City Council's agendas are posted with their
# full packets (109 pages for October 6, 2026); those over the engine's 100-page
# limit get no preview, but their minutes do.
[summaries]
model = "claude-sonnet-5"
max_per_run = 40
input_price = 2.0
output_price = 10.0
max_cost_per_run = 5.0
since = "2026-07-01"

# How residents can take part, per board, shown on its meeting pages. Only
# what the city or the school department has published; each entry names its source.
[participation."City Council"]
comment = "Any Lewiston resident or taxpayer may speak during the public comment period of a regular meeting, for up to 3 minutes. Residents who can't attend can email comments on an agenda item to publiccomments@lewistonmaine.gov, and they are forwarded to the mayor and councilors before the meeting."
source_title = "Mayor & City Council page"
source_url = "https://www.lewistonmaine.gov/105/Mayor-City-Council"
video_title = "the City of Lewiston's YouTube channel"
video_url = "https://www.youtube.com/channel/UCprFi23oI7DclYQ8kxx_mmQ"

[participation."School Committee"]
comment = "Public comments must be made in person at School Committee meetings."
source_title = "School Committee page"
source_url = "https://www.lewistonpublicschools.org/en-US/school-committee-bc9f3846"
video_title = "Lewiston Public Schools' archived meeting videos"
video_url = "https://www.youtube.com/channel/UCyvRhXaDrDfofhDvkf5Q9bw/videos"

# Terms that come up on agendas and minutes, explained on each meeting page
# where they appear. Acronyms match exactly; other terms ignore case.
[[glossary]]
term = "executive session"
definition = "A part of a public meeting closed to the public. State law (1 MRSA §405) allows it only for specific reasons, such as lawsuits, real estate, or personnel matters."

[[glossary]]
term = "MRSA"
definition = "Maine Revised Statutes Annotated, the state's laws."

[[glossary]]
term = "consent agenda"
definition = "Routine items, marked with an asterisk on the City Council's agenda, voted on together in one motion unless a councilor or a resident asks to take one up separately."

[[glossary]]
term = "first passage"
definition = "The City Council's first vote on an ordinance or an amendment to one. It takes effect only after a second vote, final passage, at a later meeting."
bodies = ["City Council"]

[[glossary]]
term = "TIF"
definition = "Tax increment financing: an agreement under which some of the new property tax from a development goes back to the project, or to public improvements around it, for a set number of years."

[[glossary]]
term = "Credit Enhancement Agreement"
definition = "An agreement under a TIF in which the city pays a developer back part of the new property tax its project brings in."

[[glossary]]
term = "LCIP"
definition = "Lewiston Capital Improvement Program: the city's plan for buildings, roads, vehicles, and other long-lived purchases over the next several years."

[[glossary]]
term = "CDBG"
definition = "Community Development Block Grant: money from the federal government for housing and neighborhood projects that benefit people with low and moderate incomes."

# Tax rate, property tax, and the city's budget (pipeline/states/me/). The
# rates, commitment, and valuation are Maine Revenue Services', under the name
# "LEWISTON"; the average single-family bill is calculated from them and the
# Maine GeoLibrary's parcel table, where Lewiston is GEOCODE 01050 and codes
# its single-family homes 101 ("SINGLE FAMILY"). The city's own budget books
# are on its Municipal Budget page.
[finance]
mrs_municipality = "Lewiston"
megis_geocode = "01050"
single_family_use = ["101"]
budget_documents_url = "https://www.lewistonmaine.gov/685/Municipal-Budget"

# Schools: the Department of Education's ESSA Dashboard, where the district is
# "Lewiston Public Schools".
[schools]
doe_district = "Lewiston Public Schools"
district_name = "Lewiston Public Schools"

# Housing: Census building permits (state and place FIPS codes) and the
# American Community Survey through Census Reporter (geo ids). Lewiston is a
# Census place, Lewiston city (23-38740).
[housing]
bps_region = "Northeast Region"
bps_prefix = "ne"
bps_state = "23"
bps_place = "38740"
census_geo = "16000US2338740"
state_geo = "04000US23"

# Unemployment rate (BLS Local Area Unemployment Statistics, area
# CT2338740000000, Lewiston city). City rates are not seasonally adjusted; the
# state series is shown for context. bulk_file is the state's file under
# download.bls.gov/pub/time.series/la/, used when the API refuses.
[labor]
local_series = "LAUCT233874000000003"
state_series = "LAUST230000000000003"
bulk_file = "la.data.26.Maine"

[freshness]
summary_grace_days = 2
sources = [
  { label = "Meetings (city calendar)", file = "meetings/status.json", max_days = 2 },
]

# Who represents you (the Officials page). Kept by hand from official city
# and school websites; checked is the date the list was last checked against
# them. Only city- and school-issued email addresses, and the mayor's office
# phone. Every seat but the mayor's and one School Committee seat is elected by
# ward. The ward file is data/static/lewiston-wards-2020.geojson: the seven
# wards drawn after the 2020 Census, from the city's own map service, with 2020
# population (37,121 in all, about 5,300 a ward). Terms are from the city's schedule for its move to
# staggered terms (charter sections 2.01 and 5.01): the seats elected in 2023
# for three years end in January 2027, those elected in 2025 for two in
# January 2028.
[officials]
checked = "2026-10-04"
wards_file = "lewiston-wards-2020.geojson"
wards_publisher = "the City of Lewiston"
wards_year = 2020
wards_url = "https://maps2.lewistonmaine.gov/arcgis/rest/services/Public/Wards_council/MapServer/0"

# Elected in the run-off of December 12, 2023 (official results).
[[officials.bodies]]
