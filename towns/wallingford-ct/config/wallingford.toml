[strings.es]
# The masthead and the share text.
"Public data on how Wallingford, Connecticut decides and spends. Updated daily." = "Datos públicos sobre cómo Wallingford, Connecticut, toma decisiones y gasta su dinero. Se actualizan a diario."
"An independent guide to town government in Wallingford, Connecticut" = "Una guía independiente sobre el gobierno municipal de Wallingford, Connecticut"

# The budget section's name (the engine translates the names every town shares).
"Town budget" = "Presupuesto del pueblo"

# Section summaries (the engine translates the section names every town shares).
"Every board and commission meeting on the town's calendar, with agendas, and minutes from July 2026 on." = "Todas las reuniones de las juntas y comisiones en el calendario del municipio, con sus agendas, y las actas desde julio de 2026."
"The town's adopted budget, its mill rate and what the property tax raises, and the average single-family tax bill." = "El presupuesto aprobado del municipio, su tasa de impuesto (mill rate) y lo que recauda el impuesto a la propiedad, y la factura promedio del impuesto a la propiedad de una casa unifamiliar."
"Graduation, attendance, state test results, and spending per pupil compared with the state." = "Graduación, asistencia, resultados de los exámenes estatales y gasto por estudiante, comparados con el estado."
"The mayor, Town Council, and Board of Education, and how to reach them." = "El alcalde, el Concejo Municipal y la Junta de Educación, y cómo comunicarse con ellos."

# Where the town posts agendas and minutes, and the data the site keeps up to date.
"town's Minutes & Agendas page" = "página de Actas y Agendas del municipio"
"Meetings (town website)" = "Reuniones (sitio web del municipio)"
"Board of Education meetings (school district website)" = "Reuniones de la Junta de Educación (sitio web del distrito escolar)"

# Glossary definitions (the terms themselves stay as the agendas write them).
"A part of a public meeting closed to the public. State law allows it only for specific reasons, such as lawsuits, real estate purchases, or personnel matters." = "Una parte de una reunión pública que se hace a puerta cerrada. La ley estatal la permite solo por razones específicas, como demandas, compras de bienes raíces o asuntos de personal."
"Connecticut General Statutes, the state's laws." = "Estatutos Generales de Connecticut (Connecticut General Statutes), las leyes del estado."
"Routine items, such as tax refunds and approving past minutes, voted on together in one motion unless a member asks to take one up separately." = "Asuntos de rutina, como devoluciones de impuestos y la aprobación de actas anteriores, que se votan juntos en una sola moción, a menos que un miembro pida tratar alguno por separado."
"The board, appointed by the mayor, that oversees the town's own electric, water, and sewer utilities." = "La comisión, nombrada por el alcalde, que supervisa los servicios de electricidad, agua y alcantarillado que son del propio municipio."

# Officials: notes, seats, and roles.
"Elected townwide for two years." = "Elegido por todo el municipio por dos años."
"Wallingford has no wards or council districts: all nine members represent the whole town. Elected at large for two years, no more than six of them from one party." = "Wallingford no tiene distritos electorales municipales: los nueve miembros representan a todo el municipio. Se eligen por todo el municipio por dos años; no más de seis pueden ser del mismo partido."
"No wards or districts: all nine members represent the whole town. Elected at large for two years." = "Sin distritos electorales: los nueve miembros representan a todo el municipio. Se eligen por todo el municipio por dos años."
"At-large" = "Todo el municipio"

