# Site configuration for Wallingford, Connecticut.
# Everything town-specific lives here; the code is the Publick engine
# (github.com/publick-org/publick-engine).
#
# The network's first Connecticut town. Wallingford's website has its own CMS
# (by Web Solutions), with a meetings calendar and one Minutes & Agendas page
# for every board, which the engine reads as [meetings.file_list]. The Board of
# Education posts on the school district's website (Finalsite, with Google
# Docs), read as [finalsite_meetings]. The town doesn't use SeeClickFix,
# so the site has no 311 section. The engine's Connecticut package gives the
# budget, mill rate, and tax bill, from the state's Office of Policy and
# Management ([finance]), and school figures, from EdSight; housing and
# unemployment come from the Census and BLS, as for every town.
#
# The site is in English and Spanish ([site] languages). [strings.es], at the
# end, gives the Spanish for the town's own text; the engine has the rest.
[site]
name = "Wallingford Publick"
# The masthead shows name_prefix in dark ink and name_suffix in the accent
# color: the town, then the network.
name_prefix = "Wallingford "
name_suffix = "Publick"
domain = "wallingford-ct.publick.org"
# The network of town sites this one belongs to, named in every page footer.
network = "Publick"
network_url = "https://publick.org"
tagline = "Public data on how Wallingford, Connecticut decides and spends. Updated daily."
# One line under the name at the top of every page.
masthead = "An independent guide to town government in Wallingford, Connecticut"
repo_url = "https://github.com/publick-org/publick.org"
# Public contact address. Shown on the About and Accessibility pages when set.
contact_email = "wallingford-ct@publick.org"
timezone = "America/New_York"
user_agent = "wallingford-ct.publick.org (+https://wallingford-ct.publick.org/about/)"
languages = ["en", "es"]

# From the town website's stylesheet (wallingfordct.gov); each passes WCAG AA
# on white. The accent is the site's green (#0e956b) darkened to pass.
[site.colors]
primary = "#2148a2"
primary_dark = "#232659"
primary_soft = "#e6eaf5"
accent = "#0c855f"

[town]
name = "Wallingford"
state = "Connecticut"
state_abbr = "CT"
official_site = "https://www.wallingfordct.gov"

# Sections appear in the main navigation in this order. Each one is a folder
# under site/pages/<slug>/ and is served at https://<domain>/<slug>/.
[[sections]]
slug = "meetings"
title = "Meetings"
summary = "Every board and commission meeting on the town's calendar, with agendas, and minutes from July 2026 on."
status = "live"

[[sections]]
slug = "budget"
title = "Town budget"
nav = "Budget"
summary = "The town's adopted budget, its mill rate and what the property tax raises, and the average single-family tax bill."
status = "live"

[[sections]]
slug = "schools"
title = "Schools"
summary = "Graduation, attendance, state test results, and spending per pupil compared with the state."
status = "live"

[[sections]]
slug = "housing"
title = "Housing"
summary = "New homes permitted, home values and rents, and the housing stock."
status = "live"

[[sections]]
slug = "officials"
title = "Who represents you"
nav = "Officials"
summary = "The mayor, Town Council, and Board of Education, and how to reach them."
status = "live"

[[sections]]
slug = "about"
title = "About"
summary = "Data sources, update schedule, metric definitions, and corrections."
status = "live"

# Page view counting with GoatCounter, on the network's site; prefix is this
# town's folder.
[analytics]
goatcounter = "publick"
prefix = "wallingford-ct"
public_stats = ""

# Public meetings, from the town website's meetings calendar and its Minutes &
# Agendas page.
[meetings]
calendar_url = "https://www.wallingfordct.gov/events/meetings/"
archive_url = "https://www.wallingfordct.gov/minutes-and-agendas/"
archive_name = "town's Minutes & Agendas page"
governing_body = "Town Council"
# The boards collected: those that posted in 2026. The calendar's outside
# bodies (the regional council of governments, Wallingford Center Inc, the
# Housing Authority, the Library Board) are left out.
boards = [
  "Town Council",
  "Ambulance Committee",
  "Board of Assessment Appeals",
  "Board of Ethics",
  "Board of Health",
  "Committee on Aging",
  "Conservation Commission",
  "Economic Development Commission",
  "Fair Rent Commission",
  "Historic Properties Commission",
  "Inland Wetlands & Watercourses Commission",
  "Mayor's Council on Substance Abuse Prevention",
  "Ordinance Committee",
  "Parks & Recreation Commission",
  "Pension Commission",
  "Personnel and Pension Appeals Board",
  "Plan of Conservation & Development Implementation Committee",
  "Planning & Zoning Commission",
  "Public Celebrations Committee",
  "Public Utilities Commission",
  "Quinnipiac River Linear Trail Advisory Committee",
  "Veterans Memorial Committee",
  "Wallingford Celebrates America 250",
  "Zoning Board of Appeals",
]

# Names the calendar and the documents page use for a board, mapped to its
# usual name.
[meetings.aliases]
"Ordinance Committee (TC)" = "Ordinance Committee"
"Inland Wetland and Watercourse Commission" = "Inland Wetlands & Watercourses Commission"
"Quinnipiac River Linear Trail" = "Quinnipiac River Linear Trail Advisory Committee"

[meetings.file_list]
documents_url = "https://www.wallingfordct.gov/minutes-and-agendas/"
calendar_url = "https://www.wallingfordct.gov/events/meetings/"
# Minutes are collected from here on. The Town Council's minutes before July
# 2026 are scans, which would be transcribed at a cost.
since = "2026-07-01"

# The Board of Education and its committees, from the meetings the school
# district posts on its website (Finalsite), with agendas and minutes as Google
# Docs. Committees are named as the board's own.
[finalsite_meetings]
page_url = "https://www.wallingford.k12.ct.us/board-of-education/board-of-education-meetings"
source_name = "Wallingford Public Schools"
since = "2026-07-01"
# The district posts a meeting with its agenda; its schedule for the year lists
# the dates before that ("10/26/26 BOE Meeting"; engine v1.31 on).
schedule_url = "https://www.wallingford.k12.ct.us/board-of-education/board-of-education-meetings/board-of-education-schedule-2024"

[finalsite_meetings.bodies]
"Board of Education" = "Board of Education"
"Operations Committee" = "Board of Education Operations Committee"
"Instructional Committee" = "Board of Education Instructional Committee"
"Policy Committee" = "Board of Education Policy Committee"

# The schedule's names for the boards.
[finalsite_meetings.schedule_names]
"BOE" = "Board of Education"
"Operations" = "Board of Education Operations Committee"
"Instructional" = "Board of Education Instructional Committee"
"Policy" = "Board of Education Policy Committee"

# Agenda and minutes PDFs, in the network's documents bucket.
[storage]
endpoint = "https://6bbfee5a3892553c7993dbfa4b4e8453.r2.cloudflarestorage.com"
bucket = "publick-documents"
public_url = "https://files.publick.org"
prefix = "wallingford-ct"

# Agenda previews and decisions from minutes, written by a language model and
# labeled as AI-generated on the site. Within the network's monthly budget.
[summaries]
model = "claude-sonnet-5"
max_per_run = 40
input_price = 2.0
output_price = 10.0
max_cost_per_run = 5.0

[[glossary]]
term = "executive session"
definition = "A part of a public meeting closed to the public. State law allows it only for specific reasons, such as lawsuits, real estate purchases, or personnel matters."

[[glossary]]
term = "C.G.S."
definition = "Connecticut General Statutes, the state's laws."

[[glossary]]
term = "consent agenda"
definition = "Routine items, such as tax refunds and approving past minutes, voted on together in one motion unless a member asks to take one up separately."

[[glossary]]
term = "Public Utilities Commission"
definition = "The board, appointed by the mayor, that oversees the town's own electric, water, and sewer utilities."

# Budget, mill rate, and property tax (pipeline/states/ct/), from the Office
# of Policy and Management's statewide datasets on data.ct.gov. The average
# single-family bill is calculated from the state's yearly Parcel and CAMA file,
# where Wallingford codes its single-family homes 1010. The town's own budget
# books are on its Finance Department page.
[finance]
opm_town = "Wallingford"
opm_code = 148
single_family_use = ["1010"]
budget_documents_url = "https://www.wallingfordct.gov/government/departments/finance-department/"

# School district figures from EdSight, the State Department of Education's
# data portal (district code 1480011).
[schools]
edsight_district = "Wallingford School District"
district_name = "Wallingford Public Schools"

# Housing: Census building permits and the American Community Survey.
# Wallingford isn't a Census place, so permits find it by its town (MCD) code;
# it reports no months to the Census, so its permit counts are estimates.
# Connecticut's planning regions replaced its counties in 2022, so the town's
# Census code is 0917078740 (0900978740 before).
[housing]
bps_region = "Northeast Region"
bps_prefix = "ne"
bps_state = "09"
bps_mcd = "78740"
census_geo = "06000US0917078740"
state_geo = "04000US09"

# Unemployment rate (BLS Local Area Unemployment Statistics, Wallingford town).
[labor]
local_series = "LAUCS097874000000003"
state_series = "LAUST090000000000003"
bulk_file = "la.data.13.Connecticut"

[freshness]
summary_grace_days = 2
sources = [
  { label = "Meetings (town website)", file = "meetings/status.json", max_days = 2 },
  { label = "Board of Education meetings (school district website)", file = "meetings/finalsite_status.json", max_days = 2 },
]

