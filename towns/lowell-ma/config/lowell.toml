# Site configuration for Lowell, Massachusetts. Everything town-specific lives
# here; the code is the Publick engine (github.com/publick-org/publick-engine).
#
# Lowell's website runs on CivicPlus, and every board posts agendas and minutes
# in the Agenda Center: the City Council, each of its subcommittees (each in a
# category of its own), and the School Committee and its subcommittees. Most
# agendas are made in the Agenda Center's builder (read since engine v1.46.0).
# The city calendar lists only holidays, so a meeting is listed once its agenda
# is posted. There is no 311 section: the city takes service requests through
# Lowell 311, on Tyler Technologies' portal, which publishes no data. The state
# sources (DLS, DESE, BLS, Census, the Subsidized Housing Inventory) are the
# same as Malden's.
#
# The site is in English and Spanish ([site] languages), as every town's is.
# The first runs draft the Spanish for the town's own text; [strings.es], at
# the end, can correct it.

[site]
name = "Lowell Publick"
# The masthead shows name_prefix in dark ink and name_suffix in the accent
# color: the town, then the network.
name_prefix = "Lowell "
domain = "lowell-ma.publick.org"
tagline = "Public data on how Lowell, Massachusetts decides and spends. Updated daily."
# One line under the name at the top of every page.
masthead = "An independent guide to city government in Lowell, Massachusetts"
# Public contact address. Shown on the About and Accessibility pages when set.
contact_email = "lowell-ma@publick.org"
user_agent = "lowell-ma.publick.org (+https://lowell-ma.publick.org/about/)"

# From the city website's stylesheet (lowellma.gov): its slate blue (the most
# used after white), its dark navy, a light tint of the slate blue, and its
# green. Each passes WCAG AA on white as it is (8.4, 11.6, and 4.8 to 1). The
# bright blue CivicPlus uses for links (#0098f7, 3.1 to 1) doesn't pass.
[site.colors]
primary = "#215367"
primary_dark = "#0f3c5b"
primary_soft = "#e9eef0"
accent = "#437d6a"

[town]
name = "Lowell"
state_abbr = "MA"
official_site = "https://www.lowellma.gov"

# Sections appear in the main navigation in this order. Each one is a folder
# under site/pages/<slug>/ and is served at https://<domain>/<slug>/.
[[sections]]
slug = "meetings"
title = "Meetings"
summary = "Every board and committee meeting in the city's Agenda Center, with agendas, and minutes from January 2026 on."
status = "live"

[[sections]]
slug = "schools"
title = "Schools"
summary = "Graduation, attendance, and MCAS results compared with the state."
status = "live"

[[sections]]
slug = "budget"
title = "City budget"
nav = "Budget"
summary = "Where general fund money comes from and how it is spent, reserves, and the property tax limit."
status = "live"

[[sections]]
slug = "housing"
title = "Housing"
summary = "New homes permitted, home values and rents, affordable housing, and the housing stock."
status = "live"

[[sections]]
slug = "officials"
title = "Who represents you"
nav = "Officials"
summary = "The mayor, City Council, and School Committee, by office and by district, and how to reach them."
status = "live"

[[sections]]
slug = "about"
title = "About"
summary = "Data sources, update schedule, metric definitions, and corrections."
status = "live"

# Page view counting with GoatCounter, on the network's site; prefix is this
# town's folder.
[analytics]
prefix = "lowell-ma"

# The weekly digest's email signup, on /digest/ (the engine's pipeline/digest.py). The form posts
# to this site's /digest/subscribe, which the sites Worker answers (worker/digest.js) and passes on
# to Buttondown with the tag lowell-ma-en. The About page names who keeps the addresses.
[digest]
# The network's settings (defaults/network.toml): having the table turns the signup on.

# Public meetings, from the city's Agenda Center.
[meetings]
base_url = "https://www.lowellma.gov"
archive_url = "https://www.lowellma.gov/AgendaCenter"
archive_name = "city's Agenda Center"
# The city's site resets some connections; a slower pace and the client's retries help.
request_delay = 5.0
max_event_pages = 40

# Agenda Center categories renamed to the board's usual name: the council's
# subcommittees all spelled "Subcommittee", as its newer categories are, the
# Commission on Disability as its own agendas name it, and the School
# Committee's Safety Subcommittee (its notices come from the Superintendent).
[meetings.aliases]
"City Council Auditor/ Clerk Oversight and Personnel Sub Committee" = "City Council Auditor/Clerk Oversight and Personnel Subcommittee"
"City Council Arts and Culture Sub Committee" = "City Council Arts and Culture Subcommittee"
"City Council Downtown Redevelopment Sub Committee" = "City Council Downtown Redevelopment Subcommittee"
"City Council Economic / Downtown Development Sub Committee" = "City Council Economic and Downtown Development Subcommittee"
"City Council Education Partnerships Sub Committee" = "City Council Education Partnerships Subcommittee"
"City Council Environment & Flood Issues Sub Committee" = "City Council Environment and Flood Issues Subcommittee"
"City Council Finance Sub Committee" = "City Council Finance Subcommittee"
"City Council Housing Sub Committee" = "City Council Housing Subcommittee"
"City Council Municipal Facilities Sub Committee" = "City Council Municipal Facilities Subcommittee"
"City Council Neighborhoods Sub Committee" = "City Council Neighborhoods Subcommittee"
"City Council Non-Profit Organizations Sub Committee" = "City Council Non-Profit Organizations Subcommittee"
"City Council Parks and Recreation Sub Committee" = "City Council Parks and Recreation Subcommittee"
"City Council Public Safety Sub Committee" = "City Council Public Safety Subcommittee"
"City Council Rules Sub Committee" = "City Council Rules Subcommittee"
"City Council Senior Citizens Sub Committee" = "City Council Senior Citizens Subcommittee"
"City Council Special Events Sub Committee" = "City Council Special Events Subcommittee"
"City Council Technologies and Utilities Sub Committee" = "City Council Technologies and Utilities Subcommittee"
"City Council Transportation Sub Committee" = "City Council Transportation Subcommittee"
"City Council Youth Services Sub Committee" = "City Council Youth Services Subcommittee"
"City Council Zoning Sub Committee" = "City Council Zoning Subcommittee"
"Board of Disabilities Commission" = "Commission on Disability"
"Safety Subcommittee" = "School Committee Safety Subcommittee"

[meetings.agenda_center]
base_url = "https://www.lowellma.gov"
# The first run lists meetings from here, and minutes are collected from here on.
since = "2026-01-01"
# Not meetings: notices that the council released earlier executive sessions' minutes.
exclude_categories = ["CITY COUNCIL EXECUTIVE SESSION MINUTES"]

# Agenda and minutes PDFs live in the network's documents bucket, not in git
# (see pipeline/documents.py). Keys: STORAGE_ACCESS_KEY_ID, STORAGE_SECRET_ACCESS_KEY.
[storage]
prefix = "lowell-ma"

# Plain-English agenda text and previews, and decisions from minutes, written by
# a language model and labeled as AI-generated on the site. Only meetings from
# `since` on are summarized, about three months before launch, so the town's
# history doesn't take the month's budget.
[summaries]
since = "2026-07-01"

# The boards' meetings below, transcribed from their recordings for a summary
# the day after, until the minutes come (the engine's pipeline/recordings.py).
[recordings]
since = "2026-10-26"

# LTC's TelVue player: a playlist a board, each recording titled "City Council - October 27, 2026",
# "School Committee - October 21, 2026", and so on: the City Council (1757), School Committee (1759),
# Zoning Board of Appeals (1760), Planning Board (1761) and License Commission (1762). A recording filed
# in another board's playlist goes by its title. Their subcommittees' playlists are left out.
[[recordings.sources]]
platform = "telvue"
player = "4jeRlBTetCoFJdyT5ssIvBrB9VUvRN0M"
playlists = [1757, 1759, 1760, 1761, 1762]

[recordings.sources.boards]
"City Council" = '^City Council - '
"School Committee" = '^School Committee - '
"Zoning Board of Appeals" = '^Zoning Board of Appeals - '
"Planning Board" = '^Planning Board - '
"License Commission" = '^License Commission - '

# How residents can take part, per board, shown on its meeting pages. From
# the notice on each agenda; the Council's Rules (Rule 26) add a three-minute
# limit, and that a speaker keeps to the agenda item. Both boards' meetings are
# broadcast and kept for replay by LTC (Lowell Telecommunications Corporation),
# which the city's Council page and the district's School Committee page link.
[participation."City Council"]
comment = "Residents can speak on a specific agenda item, in person or by Zoom. Email the City Clerk at mgeary@lowellma.gov, or call 978-674-4161, before 4:00 PM on the day of the meeting, naming the item and giving a phone number."
source_title = "City Council agenda of October 13, 2026"
source_url = "https://www.lowellma.gov/AgendaCenter/ViewFile/Agenda/_10132026-4062?html=true"
video_title = "LTC (Lowell Telecommunications Corporation)"
video_url = "https://www.ltc.org/on-demand/ch6/city-council/"

[participation."School Committee"]
comment = "Residents can speak on an agenda item. Email the Superintendent at skeo@lowell.k12.ma.us, or call 978-674-4324, before 2:00 PM on the day of the meeting, naming the item and giving a phone number and email address."
source_title = "School Committee agenda of October 7, 2026"
source_url = "https://www.lowellma.gov/AgendaCenter/ViewFile/Agenda/_10072026-4044?html=true"
video_title = "LTC (Lowell Telecommunications Corporation)"
video_url = "https://www.ltc.org/on-demand/ch6/school-committee/"

# School district figures from the state's education data portal (DESE).
[schools]
district_code = "01600000"
district_name = "Lowell Public Schools"

# Tax bill and budget figures (Mass. Division of Local Services). Some DLS
# reports take the name, others the DOR code.
[finance]
dls_municipality = "Lowell"
dls_code = "160"

# Housing: Census building permits (state and place FIPS codes), American
# Community Survey through Census Reporter (geo ids), and the state's
# Subsidized Housing Inventory PDF (the town's name as the PDF lists it).
[housing]
bps_place = "37000"
census_geo = "16000US2537000"
shi_name = "Lowell"

# Unemployment rate (BLS Local Area Unemployment Statistics). City rates are
# not seasonally adjusted; the state series is shown for context.
[labor]
local_series = "LAUCT253700000000003"

# How often each data source should update. Figures published monthly or yearly
# are judged by the engine, by the period they cover (pipeline/rhythms.py).
[freshness]
sources = [
  { label = "Meetings (Agenda Center)", file = "meetings/status.json", max_days = 2 },
]

# The About page's "What this site doesn't cover": why there's no 311 section.
[absences]
311 = "The city takes service requests through Lowell 311, on a portal that needs an account and publishes no data."

# Who represents you (the Officials page). Kept by hand from official city
# and school websites; checked is the date the list was last checked against
# them. Only city- and school-issued email addresses, and the mayor's office
# phone. The ward file is data/static/lowell-precincts-2022.geojson (MassGIS):
# the council's eight districts are the city's eight wards, and each School
# Committee district is two wards (the precincts in the official results).
# No official page gives the terms' end (two years, from the first Monday in
# January, by the Plan E charter), so term_ends is left out.
[officials]
checked = "2026-10-12"
# The next regular municipal election (Plan E, M.G.L. c. 43 § 109: the Tuesday
# after the first Monday of November in odd years).
next_election = "2027-11-02"
wards_file = "lowell-precincts-2022.geojson"
wards_publisher = "MassGIS"
wards_year = "2022"
wards_url = "https://gis.data.mass.gov/maps/aec5130790814ace94438d3bcf23cf9a"

# Chosen by the council from its members at its organizational meeting of
# January 5, 2026 (its minutes). The phone is the City Council office's, which
# the Mayor's page gives.
[[officials.bodies]]
name = "Mayor"
url = "https://www.lowellma.gov/549/City-Mayor"
note = "Chosen by the City Council from among its members. Chairs the City Council and the School Committee. The city's manager, appointed by the council, runs its departments."
members = [
  { name = "Erik R. Gitschier", seat = "At-large councillor", phone = "(978) 674-4040" },
]

