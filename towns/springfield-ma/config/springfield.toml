  { name = "Michael A. Fenton", seat = "Ward 2", ward = 2, email = "mfenton@springfieldcityhall.com" },
  { name = "Melvin A. Edwards", seat = "Ward 3", ward = 3 },
  { name = "Malo L. Brown", seat = "Ward 4", ward = 4 },
