  { name = "Gerry Martin", seat = "Ward 7", ward = 7, email = "gmartin@springfieldcityhall.com" },
  { name = "Zaida Govan", seat = "Ward 8", ward = 8 },
  { name = "Tracye Whitfield", seat = "At-large", role = "President", email = "twhitfield@springfieldcityhall.com" },
