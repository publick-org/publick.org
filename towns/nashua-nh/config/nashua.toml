# Site configuration for Nashua, New Hampshire. Everything town-specific lives
# here; the code is the Publick engine (github.com/publick-org/publick-engine).
# Build with: python -m pipeline.build_site (with the engine on PYTHONPATH)
#
# Nashua's website runs on CivicPlus, but its Agenda Center has nothing after
# 2025: since January 2026 every city body posts its meetings, agendas, and
# minutes on the city's CivicClerk portal, read as [meetings.civicclerk], as
# Burlington's are. The minutes are text PDFs. The Board of Education posts its
# agendas and minutes as Google Drive files on a page of the school district's
# Finalsite website, and its committees' on a page each, which [page_meetings]
# reads; the district's figures come from the state ([schools]). There is no
# 311 section: the city takes Public Works requests through a SeeClickFix
# portal whose requests aren't public ([absences]). Its tax rate,
# tax bill, budget, and school figures are New Hampshire's (the engine's
# pipeline/states/nh/, whose statewide files already have Nashua's rows).
#
# The site is in English and Spanish ([site] languages), as every town's is.
# The first runs draft the Spanish for the town's own text; [strings.es], at
# the end, can correct it.

[site]
name = "Nashua Publick"
# The masthead shows name_prefix in dark ink and name_suffix in the accent
# color: the town, then the network.
name_prefix = "Nashua "
domain = "nashua-nh.publick.org"
tagline = "Public data on how Nashua, New Hampshire decides and spends. Updated daily."
# One line under the name at the top of every page.
masthead = "An independent guide to city government in Nashua, New Hampshire"
# Public contact address. Shown on the About and Accessibility pages when set.
contact_email = "nashua-nh@publick.org"
user_agent = "nashua-nh.publick.org (+https://nashua-nh.publick.org/about/)"

# From the city website's stylesheet (nashuanh.gov): its blue (headlines and
# table headers, the most used after white and black, 10.7:1 on white), its
# navy (widget titles and buttons, 18.1:1), a light tint of the blue, and its
# red (the site's link color, 6.2:1). The bright blue CivicPlus uses for some
# links (#0098f7, 3.1:1) doesn't pass WCAG AA on white, so it isn't used.
[site.colors]
primary = "#0b406e"
primary_dark = "#021240"
primary_soft = "#e7ecf1"
accent = "#bc2024"

[town]
name = "Nashua"
state_abbr = "NH"
official_site = "https://www.nashuanh.gov"

# Sections appear in the main navigation in this order. Each one is a folder
# under site/pages/<slug>/ and is served at https://<domain>/<slug>/.
[[sections]]
slug = "meetings"
title = "Meetings"
summary = "When the Board of Aldermen, its committees, the city's boards and commissions, and the Board of Education and its committees meet, with agendas, and minutes from January 2026 on."
status = "live"

[[sections]]
slug = "budget"
title = "City budget"
nav = "Budget"
summary = "The city's property tax rate and where the tax goes, what it raises per resident, and the average single-family tax bill."
status = "live"

[[sections]]
slug = "schools"
title = "Schools"
summary = "Nashua School District's graduation rate, state test results, and cost per pupil, with the state's."
status = "live"

[[sections]]
slug = "housing"
title = "Housing"
summary = "New homes permitted, home values and rents, and the housing stock."
status = "live"

[[sections]]
slug = "officials"
title = "Who represents you"
nav = "Officials"
summary = "The mayor, the Board of Aldermen, and the Board of Education, by office and by ward, and how to reach them."
status = "live"

[[sections]]
slug = "about"
title = "About"
summary = "Data sources, update schedule, metric definitions, and corrections."
status = "live"

# Page view counting with GoatCounter, on the network's site; prefix is this
# town's folder.
[analytics]
prefix = "nashua-nh"

# The weekly digest's email signup, on /digest/ (the engine's pipeline/digest.py). The form posts
# to this site's /digest/subscribe, which the sites Worker answers (worker/digest.js) and passes on
# to Buttondown with the tag nashua-nh-en. The About page names who keeps the addresses.
[digest]
# The network's settings (defaults/network.toml): having the table turns the signup on.

# Public meetings, from the city's CivicClerk portal (the "Agendas & Minutes
# Portal" button on the city's home page, and the "View Most Recent Agendas and
# Minutes" link on its Board of Aldermen page): the Board of Aldermen, its
# standing and special committees, and the city's boards and commissions. The
# portal files about one in ten meetings under a catch-all category ("Boards &
# Committees", "General", "Economic Development"); the engine files each by its
# own name instead, so those go with their boards (a Conservation Commission site
# walk, the Board of Public Works Retirement System Trustees). The city calendar
# (nashuanh.gov/Calendar.aspx) lists the same meetings under the portal's names,
# so it isn't read.
[meetings]
calendar_url = "https://nashuanh.portal.civicclerk.com"
archive_url = "https://nashuanh.portal.civicclerk.com"
archive_name = "city's CivicClerk portal"
governing_body = "Board of Aldermen"
# The city's site resets some connections; a slower pace and the client's retries help.
request_delay = 3.0
# One name per public body, as the city's pages and the portal name it. A portal
# entry is filed under the longest of these it contains ("Special Board of
# Aldermen - Public Hearing - R-26-053", "Board of Public Works Retirement System
# Trustees Regular Meeting"), ignoring case, punctuation, and "&" versus "and".
# The aldermen's committees keep the city's own names, as on the Board of
# Aldermen's agendas ("Assigned to the BUDGET REVIEW COMMITTEE").
