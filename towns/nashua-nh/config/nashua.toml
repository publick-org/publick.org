  "Board of Aldermen",
  "Budget Review Committee",
  "Finance Committee",
  "Committee on Infrastructure",
  "Human Affairs Committee",
  "Personnel/Administrative Affairs Committee",
  "Planning and Economic Development Committee",
  "Environment and Energy Committee",
  "Ad Hoc Joint Committee on Capital Expenditures and Debt Service Planning",
  "Pennichuck Water Special Committee",
  "Joint Special School Building Committee",
  "Joint Board of Public Works and Committee on Infrastructure",
  "Capital Improvements Committee",
  "Electric Aggregation Committee",
  "Ethics Review Committee",
  "Board of Public Works",
  "Holman Stadium Activation Committee",
  "Board of Public Works Retirement System Trustees",
  "Planning Board",
  "Zoning Board of Adjustment",
  "Conservation Commission",
  "Historic District Commission",
  "Board of Assessors",
  "Board of Fire Commissioners",
  "Board of Health",
  "Public Health Advisory Council",
  "Public Health Ethics Committee",
  "Board of Registrars",
  "Trustees of Trust Funds",
  "Nashua Public Library Board of Trustees",
  "Hunt Memorial Building Board of Trustees",
  "Edgewood/Suburban Cemetery Trustees",
  "Woodlawn/Pinewood Cemetery Trustees",
  "Arts Commission",
  "Arts Commission Grants Subcommittee",
  "Arts Commission Project Subcommittee",
  "Keefe Auditorium Commission",
  "Nashua Center for the Arts Board of Trustees",
  "Nashua Center for the Arts Board of Trustees Community Benefits Subcommittee",
  "NPAC Corp.",
  "201 Main Street Real Estate Corp.",
  "Conway Ice Rink Commission",
  "Greeley Park Advisory Committee",
  "Mine Falls Park Advisory Committee",
  "Cable Television Advisory Board",
  "Citizen's Advisory Commission",
  "Cultural Connections Committee",
  "Downtown Improvement Committee",
  "Housing Revolving Fund Committee",
  "Greater Nashua Revolving Loan Fund",
  "Business and Industrial Development Authority",
  "Nashua Housing and Redevelopment Authority",
  "Mayor's Opioid Taskforce",
  "Opioid Fatality Review Committee Workgroup",
  "Encampment Workgroup",
  "Mayor's Veterans Council",
  "Ambulance Advisory Committee",
  "Local Emergency Planning Committee",
]

# Other names the portal uses for a board. The joint meetings of the Committee
# on Infrastructure with the Police Commission or the Library Trustees go with
# the committee, which calls them; with the Board of Public Works, under the
# joint body the city has a page and a portal category for.
[meetings.aliases]
"Committee on Infrastructure and Board of Public Works" = "Joint Board of Public Works and Committee on Infrastructure"
"BPW Special" = "Board of Public Works"
"Board of Fire Commission" = "Board of Fire Commissioners"
"Historic District" = "Historic District Commission"
"Grants Sub-Com" = "Arts Commission Grants Subcommittee"
"NAC sub-committee, grants" = "Arts Commission Grants Subcommittee"
"NAC project sub-committee" = "Arts Commission Project Subcommittee"
"BIDA" = "Business and Industrial Development Authority"
"Trustees of the Trust Funds" = "Trustees of Trust Funds"
"Trustee of Trust Funds" = "Trustees of Trust Funds"
"Nashua Housing and Redevelopment" = "Nashua Housing and Redevelopment Authority"
"Mine Falls Advisory Committee" = "Mine Falls Park Advisory Committee"
"Housing Revolving Fund" = "Housing Revolving Fund Committee"
"Revolving Loan Fund" = "Greater Nashua Revolving Loan Fund"
"Hunt Board of Trustees" = "Hunt Memorial Building Board of Trustees"
"Edgewood/Suburban Trustees" = "Edgewood/Suburban Cemetery Trustees"
"Woodlawn/Pinewood Cemetery Trustee" = "Woodlawn/Pinewood Cemetery Trustees"
"201 Main St. Real Estate Corp." = "201 Main Street Real Estate Corp."
"Ad Hoc Committee on Capital Expenditures and Debt Svc Planning" = "Ad Hoc Joint Committee on Capital Expenditures and Debt Service Planning"
"Ad Hoc Joint Committee on Capital Expenditures and Debt Svc Planning" = "Ad Hoc Joint Committee on Capital Expenditures and Debt Service Planning"

[meetings.civicclerk]
api_url = "https://nashuanh.api.civicclerk.com/v1"
portal_url = "https://nashuanh.portal.civicclerk.com"
# Meetings, agendas, and minutes are collected from here on: the current Board
# of Aldermen took office at its organizational meeting on January 4, 2026, and
# the city's meetings moved to the portal in January.
since = "2026-01-01"
# Left out:
# - Pennichuck Corporation's own meetings (its board of directors, its
#   subsidiaries' boards, its committees, and its shareholder meetings): a
#   corporation the city owns as sole shareholder, not a city body, whose
#   portal entries are notices, with an agenda or minutes for 1 of 16 meetings
#   from April to September 2026. The aldermen's Pennichuck Water Special
#   Committee is kept.
# - Events that aren't a meeting of a city body: the inauguration ceremony (the
#   Board of Aldermen's organizational meeting after it is kept), the portal's
#   placeholder "One Time Event" entries, the Resource Center's resident
#   sessions ("Resource Center - Stakeholders", not the aldermen's special
#   meetings on it), the Multicultural Festival, an alderman's ward meeting
#   ("Invitation to the 2nd Ward 5 Meeting"), and project information
#   meetings ("Lock & Whitney Transportation Alternative Project Meeting",
#   "West Hollis Street Corridor Presentation & Discussion").
# - A bare "SITE WALK- 5 ROBY STREET", which repeats the Conservation
#   Commission's own entry for the same walk.
exclude_pattern = '^(?!.*special committee).*\bpennichuck\b|^inauguration$|^one time event$|^resource center\b|\bmulticultural festival\b|^invitation to\b|\bproject meeting$|\bcorridor presentation\b|^site walk\b'

# Where the city's own listing is wrong, found by hand: shown on the meeting's
# page with the reason and how it's known. Once the city changes the listing
# after `checked`, the correction comes down until it's checked again.
#
# The portal lists three entries named "Finance Committee" in the Committee on
# Infrastructure's category, each at 7:00 PM on the fourth Wednesday, the same
# time as that committee's own entry for the day. The Finance Committee meets on
# the first and third Wednesdays, and has its own entries for those months.
[[meetings.corrections]]
board = "Finance Committee"
date = "2027-01-27"
doubtful = true
checked = "2026-10-12"
note = "The city's portal lists this under the Committee on Infrastructure, which meets at the same time that day. The Finance Committee meets on the first and third Wednesdays, and has its own January meeting on January 20. This entry is most likely the Committee on Infrastructure's, misnamed. Check with the city before going."
evidence = "https://nashuanh.portal.civicclerk.com/event/4745/files"

[[meetings.corrections]]
board = "Finance Committee"
date = "2027-02-24"
doubtful = true
checked = "2026-10-12"
note = "The city's portal lists this under the Committee on Infrastructure, which meets at the same time that day. The Finance Committee meets on the first and third Wednesdays, and has its own February meeting on February 17. This entry is most likely the Committee on Infrastructure's, misnamed. Check with the city before going."
evidence = "https://nashuanh.portal.civicclerk.com/event/4746/files"

[[meetings.corrections]]
board = "Finance Committee"
date = "2027-03-24"
doubtful = true
checked = "2026-10-12"
note = "The city's portal lists this under the Committee on Infrastructure, which meets at the same time that day. The Finance Committee meets on the first and third Wednesdays, and has its own March meeting on March 17. This entry is most likely the Committee on Infrastructure's, misnamed. Check with the city before going."
evidence = "https://nashuanh.portal.civicclerk.com/event/4747/files"

# The Board of Education's meetings, agendas and minutes, from the district's
# "BOE Meeting Agendas and Minutes" page: under each month, a line for each
# meeting ("August 24, 2026 - Public Hearing", "July 13, 2026 (Special BOE)"),
# then its links, "Agenda and Attachments" and "Minutes" (Google Drive files),
# some with "Non-Public Minutes" or a presentation. The page gives no times. A
# public hearing on the evening of a meeting is a meeting of its own.
# January 5, 2026 is one line for the organizational meeting and the regular
# meeting after it: the organizational meeting's agenda and minutes, listed
# first, are the meeting's; the regular meeting's are kept in its record as
# links, which meeting pages don't show. A meeting the page lists with no
# documents (February 23, 2026, "CANCELLED") isn't recorded. The page lists the meeting of April 13, 2026 (so its agenda says) as "April 13,
# 2016", under April 2026: that date falls before since, so the meeting isn't
# listed until the district corrects it. The Board's calendar feed (iCal)
# isn't read: it gives meetings as repeating events (RRULE), and
# [ical_meetings] reads one meeting an event (UID).
[page_meetings]
page_url = "https://www.nashua.edu/our-district/board-of-education/boe-meeting-agendas-and-minutes"
source_name = "Nashua School District"
# The first run lists meetings from here, and documents are collected from here on.
since = "2026-01-01"
body = "Board of Education"
# A link labelled minutes, but not "Non-Public Minutes", which stays a link.
minutes_pattern = '^(?!.*\bnon-?public\b).*\bminutes\b'

# The Board's standing committees, each with a page of its own under the one
# above, named as the Board's Policy BDE (Committees and Delegates, March 2,
# 2026) and their agendas name them ("FINANCE AND OPERATIONS COMMITTEE"), with
# "Board of Education" in front: the Board of Aldermen has a Finance Committee,
# a Budget Review Committee and a Personnel/Administrative Affairs Committee of
# its own. The JSSBC page's Joint Special School Building Committee, with the
# aldermen, is on the city's portal ([meetings] boards), so isn't read here.
[page_meetings.pages]
"https://www.nashua.edu/our-district/board-of-education/boe-meeting-agendas-and-minutes/policy" = "Board of Education Policy Committee"
"https://www.nashua.edu/our-district/board-of-education/boe-meeting-agendas-and-minutes/budget-committee" = "Board of Education Budget Committee"
"https://www.nashua.edu/our-district/board-of-education/boe-meeting-agendas-and-minutes/curriculum-and-evaluation" = "Board of Education Curriculum and Evaluation Committee"
"https://www.nashua.edu/our-district/board-of-education/boe-meeting-agendas-and-minutes/finance-and-operations" = "Board of Education Finance and Operations Committee"
"https://www.nashua.edu/our-district/board-of-education/boe-meeting-agendas-and-minutes/human-resources" = "Board of Education Human Resources Committee"

# Agenda and minutes PDFs live in the network's documents bucket, not in git
# (see pipeline/documents.py). Keys: STORAGE_ACCESS_KEY_ID, STORAGE_SECRET_ACCESS_KEY.
[storage]
prefix = "nashua-nh"

# Plain-English agenda text and previews, and decisions from minutes, written by
# a language model and labeled as AI-generated on the site. Only meetings from
# `since` on are summarized, about three months before launch, so the town's
# history doesn't take the month's budget.
[summaries]
since = "2026-07-01"

# How residents can take part, per board, shown on its meeting pages. Only
# what the city has published; each entry names its source. The order of
# business is the Board's agenda's; that the public may speak, and the
# broadcast on Channel 16 with recordings online, are from its page on the
# city's website, which links Nashua Community Television's page.
[participation."Board of Aldermen"]
comment = "Residents can speak at each regular meeting twice: early in the meeting, on items the Board expects to act on that evening, and near its end, in the period for general public comment."
source_title = "Board of Aldermen agenda of September 22, 2026"
source_url = "https://nashuanh.portal.civicclerk.com/event/4580/files"
video_title = "Nashua's Government TV 16"
video_url = "https://www.nashuanh.gov/318/CTV---Nashua-Community-Television"

# From the Board of Education's Policy BEDH (Public Comment & Participation at
# Board Meetings, approved December 19, 2022), on its Policies and Procedures
# page. Its agendas say its meetings are broadcast live on Nashua ETV (Comcast
# channel 22), whose page on the district's website has the stream and video on
# demand.
[participation."Board of Education"]
comment = "Residents can speak in two 15-minute public comment periods at each regular Board meeting, for three minutes each: at the start, on items on the agenda, and at the end, on other district matters. Sign up before the meeting; speakers are called in that order, and give their name for the record. Comments about individual students or staff go to the Superintendent instead."
source_title = "the Board of Education's Policy BEDH"
source_url = "https://www.nashua.edu/fs/resource-manager/view/1fe6998c-bd2f-4524-8a22-6b67276a3bf0"
video_title = "Nashua ETV (Channel 22)"
video_url = "https://www.nashua.edu/families-community/nashua-etv"

# Terms that come up on agendas and minutes, explained on each meeting page
# where they appear. Acronyms match exactly; other terms ignore case. From the
# City Charter (joint convention, § 87), the city's Ordinances & City Charter
# page (ordinances and resolutions), and the Board of Aldermen's own agendas
# and minutes.
[[glossary]]
term = "NRO"
definition = "Nashua Revised Ordinances, the city's local laws."

[[glossary]]
term = "first reading"
bodies = ["Board of Aldermen"]
definition = "The first time the Board of Aldermen takes up a new resolution or ordinance. The President usually then assigns it to a committee to review before the Board votes on it."

[[glossary]]
term = "resolution"
definition = "A formal decision of the Board of Aldermen, such as approving spending, a bond, or a budget. Numbered R- with the year, as in R-26-053."

[[glossary]]
term = "ordinance"
definition = "A city law passed by the Board of Aldermen. Numbered O- with the year, as in O-26-017."

[[glossary]]
term = "joint convention"
definition = "The Board of Aldermen meeting together with another board, such as the Library Trustees or a cemetery's trustees, to elect that board's members, as the City Charter provides."

[[glossary]]
term = "BPW"
definition = "Board of Public Works, the elected board that oversees the city's Division of Public Works, with the mayor as its chair."

[[glossary]]
term = "Pennichuck"
definition = "Pennichuck Corporation, the water utility the city owns as its sole shareholder. It reports to the Board of Aldermen every quarter."

# Tax rate, property tax, and the average single-family tax bill
# (pipeline/states/nh/). The tax rates are the New Hampshire DRA's, from the
# engine's yearly statewide figures, where the city is "Nashua"; the average
# bill is calculated from them and NH GRANIT's parcel map. The city publishes
# its budget as ClearGov budget books and PDFs, not a table on a page, so the
# budget page links them (budget_documents_url) rather than reading one.
[finance]
dra_municipality = "Nashua"
budget_documents_url = "https://www.nashuanh.gov/1451/Budgets"

# Schools: the New Hampshire Department of Education's statewide figures,
# where the district is "Nashua".
[schools]
doe_district = "Nashua"
district_name = "Nashua School District"

# Housing: Census building permits (state and place FIPS codes) and American
# Community Survey through Census Reporter (geo ids).
[housing]
bps_place = "50260"
census_geo = "16000US3350260"

# Unemployment rate (BLS Local Area Unemployment Statistics): Nashua city is
# CT3350260000000 in la.area. City rates are not seasonally adjusted; the
# state series is shown for context.
[labor]
local_series = "LAUCT335026000000003"

# How often each data source should update. Figures published monthly or yearly
# are judged by the engine, by the period they cover (pipeline/rhythms.py).
[freshness]
sources = [
  { label = "Meetings (CivicClerk)", file = "meetings/status.json", max_days = 2 },
  { label = "Board of Education meetings (school district website)", file = "meetings/page_status.json", max_days = 2 },
]

# The About page's "What this site doesn't cover": why there's no 311 section.
# The city's SeeClickFix page links a SeeClickFix web portal; on 2026-10-12
# SeeClickFix's public listing for Nashua had two city-acknowledged requests in
# 2026 and none closed since January 2025.
[absences]
311 = "The city takes Public Works requests through a SeeClickFix portal whose requests aren't made public, so there's no data to show."

# Who represents you (the Officials page). Kept by hand from official city
# and school websites; checked is the date the list was last checked against
# them. Only city- and school-issued email addresses, and the mayor's office
# phone (the city's pages also list aldermen's and school board members' own
# phone numbers, which are left out). The ward file is
# data/static/nashua-wards-2022.geojson: NH GRANIT's 2022 voting wards, as for
# Manchester, with 2020 census population (the sum of the census blocks
# inside each ward, 91,322 in all, the city's 2020 count). Terms from the City
# Charter (the city's PDF, as of January 1, 2026): the mayor four years (§ 40),
# ward aldermen two, at-large aldermen four, three at each election, all
# taking office at the inauguration on the first Sunday after the first
# working day of January (§ 41); Board of Education members four years from
# January 1 (§ 75).
[officials]
checked = "2026-10-12"
# The next regular municipal election: the first Tuesday after the first Monday
# of November in odd years (City Charter § 5; the clerk's Election Results page
# lists them).
next_election = "2027-11-02"
wards_file = "nashua-wards-2022.geojson"
wards_publisher = "NH GRANIT"
wards_year = 2022
wards_url = "https://www.arcgis.com/home/item.html?id=3d1a8bdf3eaa49e09cf5d9da5b56bf9c"

