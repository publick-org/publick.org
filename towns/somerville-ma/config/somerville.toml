# Site configuration for Somerville, Massachusetts. Everything town-specific
# lives here; the code is the Publick engine
# (github.com/publick-org/publick-engine).
#
# Somerville's website runs on Drupal. The City Council and its committees
# post agendas and minutes on the city's Legistar system, read through
# Legistar's public web API; minutes are PDFs with text. The School Committee
# posts its agendas, minutes and presentations on the city's events calendar
# ("Agendas, Minutes, & More"), and its meeting materials in Google Drive
# folders by month and meeting; the engine reads neither, so the committee's
# meetings come from the Somerville Public Schools calendar feed, with their
# times but no documents. 311 requests go to the city's own 311 service, on
# QAlert, and are published on the city's open data portal, which the engine
# doesn't read; SeeClickFix isn't used.
#
# Started on 2026-10-27 by the engine's helper (python -m pipeline.new_town),
# from Medford's config.
#
# The site is in English and Spanish ([site] languages), as every town's is.
# The first runs draft the Spanish for the town's own text; [strings.es], at
# the end, can correct it.

[site]
name = "Somerville Publick"
# The masthead shows name_prefix in dark ink and name_suffix in the accent
# color: the town, then the network.
name_prefix = "Somerville "
domain = "somerville-ma.publick.org"
tagline = "Public data on how Somerville, Massachusetts decides and spends. Updated daily."
# One line under the name at the top of every page.
masthead = "An independent guide to city government in Somerville, Massachusetts"
# Public contact address. Shown on the About and Accessibility pages when set.
contact_email = "somerville-ma@publick.org"
user_agent = "somerville-ma.publick.org (+https://somerville-ma.publick.org/about/)"

# From the city website's stylesheets (www.somervillema.gov): its two most
# used blues (48 and 45 uses); the most used of another hue (40 uses); primary
# darkened from #086afd (4.1 to 1 on the site's lightest background) to pass;
# primary_soft a light tint of primary. Each passes WCAG AA on white (5.3,
# 6.2, 4.5 to 1).
[site.colors]
primary = "#0763eb"
primary_dark = "#086699"
primary_soft = "#e6effd"
accent = "#198754"

[town]
name = "Somerville"
state_abbr = "MA"
official_site = "https://www.somervillema.gov"

# Sections appear in the main navigation in this order. Each one is a folder
# under site/pages/<slug>/ and is served at https://<domain>/<slug>/.
[[sections]]
slug = "meetings"
title = "Meetings"
summary = "When the City Council, its committees, and the School Committee meet, with the council's agendas, and minutes from January 2026 on."
status = "live"

[[sections]]
slug = "schools"
title = "Schools"
summary = "Graduation, attendance, and MCAS results compared with the state."
status = "live"

[[sections]]
slug = "budget"
title = "City budget"
nav = "Budget"
summary = "Where general fund money comes from and how it is spent, reserves, and the property tax limit."
status = "live"

[[sections]]
slug = "housing"
title = "Housing"
summary = "New homes permitted, home values and rents, affordable housing, and the housing stock."
status = "live"

[[sections]]
slug = "officials"
title = "Who represents you"
nav = "Officials"
summary = "The mayor, City Council, and School Committee, by office and by ward, and how to reach them."
status = "live"

[[sections]]
slug = "about"
title = "About"
summary = "Data sources, update schedule, metric definitions, and corrections."
status = "live"

# Page view counting with GoatCounter, on the network's site; prefix is this
# town's folder.
[analytics]
prefix = "somerville-ma"

# Public meetings, from its Legistar system.
[meetings]
calendar_url = "https://somervillema.legistar.com/Calendar.aspx"
archive_url = "https://somervillema.legistar.com/Calendar.aspx"
archive_name = "city's Legistar calendar"
request_delay = 3.0
max_event_pages = 40
# The council and its standing committees as the city's Legistar system lists
# them in 2026 (its bodies of earlier years, under former names, have no
# meetings since `since`).
boards = [
  "City Council",
  "Confirmation of Appointments and Personnel Matters Committee",
  "Finance Committee",
  "Housing, Community Development and Equity Committee",
  "Land Use Committee",
  "Legislative Matters Committee",
  "Licenses and Permits Committee",
  "Public Health and Public Safety Committee",
  "School Building Facilities and Maintenance Committee",
  "Sustainability and Infrastructure Committee",
  "Traffic and Parking Committee",
]

# The council's organizational meeting, in January, is its own body in
# Legistar.
[meetings.aliases]
"City Council Organizational Meeting" = "City Council"

[meetings.legistar]
client = "somervillema"
# Meetings, agendas, and minutes are collected from here on.
since = "2026-01-01"

# The School Committee's meetings, from the Somerville Public Schools calendar
# feed (The Events Calendar, on WordPress), narrowed to events naming the
# School Committee: the feed holds 30 events, so unfiltered it reaches only
# about three weeks ahead. Office hours and executive sessions are left out.
# The committee's agendas and minutes are on the city's events calendar
# (somervillema.gov/meetingdocs), which the engine doesn't read.
[ical_meetings]
ical_url = "https://www.somerville.k12.ma.us/school-calendars/list/?tribe-bar-search=School+Committee&ical=1"
page_url = "https://www.somerville.k12.ma.us/about-sps/school-committee/meetings/"
source_name = "Somerville Public Schools"
since = "2026-07-01"

# The subcommittees, as the district's Subcommittees page names them.
[ical_meetings.bodies]
"Regular School Committee" = "School Committee"
"Educational Programs" = "School Committee Educational Programs and Instruction Subcommittee"
"Finance and Facilities" = "School Committee Finance and Facilities Subcommittee"
"Rules Management" = "School Committee Rules Management Subcommittee"
"School Building Facilities and Maintenance" = "School Committee School Building Facilities and Maintenance Subcommittee"
"Long-Range Planning" = "School Committee Long-Range Planning Subcommittee"

# Agenda and minutes PDFs live in the network's documents bucket, not in git
# (see pipeline/documents.py). Keys: STORAGE_ACCESS_KEY_ID,
# STORAGE_SECRET_ACCESS_KEY.
[storage]
prefix = "somerville-ma"

# Plain-English agenda text and previews, and decisions from minutes, written
# by a language model and labeled as AI-generated on the site. Only meetings
# from `since` on are summarized, about three months before launch, so the
# town's history doesn't take the month's budget.
[summaries]
since = "2026-07-01"

# The City Council page's Public Comments section; its agendas give the Zoom
# registration for testifying at public hearings (agenda of October 22, 2026).
# Meetings are carried live on GovTV; recordings are on the city's Legistar site.
[participation."City Council"]
comment = "Residents can send written comments to the City Clerk at publiccomments@somervillema.gov, by mail, or in person at City Hall (93 Highland Ave.), with their full name, their ward or address (the address is redacted on the agenda), and the item they're about. Comments received by close of business on the Friday before a regular meeting go on its agenda. To testify at a public hearing remotely, register by the Zoom link on the agenda. Email to citycouncil@somervillema.gov reaches every councilor."
source_title = "City Council page, Public Comments"
source_url = "https://www.somervillema.gov/departments/city-council#comments"
video_title = "GovTV (Somerville City TV)"
video_url = "https://www.somervillema.gov/departments/communications-and-community-engagement/somerville-city-tv#city-council-meetings"

# Policies BEDH and BEDH-E (Guidelines for Public Comment), and the School
# Committee Meetings page, which links both and gives the remote sign-up.
# Meetings are carried live on GovTV and posted on YouTube within a day.
[participation."School Committee"]
comment = "Residents can speak during Public Comment at the start of each regular meeting, for up to 3 minutes (the Chair may limit it to 2), on School Committee business: sign the sheet at the podium by 7:00 PM with name and topic, or join by Zoom, registering by the link on the Meetings page between 6:45 and 7:00 PM and sending name and address in the chat. There's no spoken public comment at subcommittee meetings; written comments are taken into the record. Simultaneous interpretation in Spanish, Portuguese, and Haitian Creole needs registration 48 hours ahead."
source_title = "School Committee Meetings page and policy BEDH-E"
source_url = "https://www.somerville.k12.ma.us/about-sps/school-committee/meetings/"
video_title = "Somerville School Committee on YouTube"
video_url = "https://www.youtube.com/@SomervilleSchoolCommittee"

# School district figures from the state's education data portal (DESE).
[schools]
district_code = "02740000"
district_name = "Somerville Public Schools"

# Tax bill and budget figures (Mass. Division of Local Services). Some DLS
# reports take the name, others the DOR code.
[finance]
dls_municipality = "Somerville"
dls_code = "274"

# Housing: Census building permits (state and place FIPS codes), American
# Community Survey through Census Reporter (geo ids), and the state's
# Subsidized Housing Inventory PDF (the town's name as the PDF lists it).
[housing]
bps_place = "62535"
census_geo = "16000US2562535"
shi_name = "Somerville"

# Unemployment rate (BLS Local Area Unemployment Statistics, area
# CT2562535000000, Somerville city, MA). City rates are not seasonally
# adjusted; the state series is shown for context.
[labor]
local_series = "LAUCT256253500000003"

# How often each data source should update. Figures published monthly or
# yearly are judged by the engine, by the period they cover
# (pipeline/rhythms.py).
[freshness]
sources = [
  { label = "Meetings (Legistar)", file = "meetings/status.json", max_days = 2 },
]

# The About page's "What this site doesn't cover": why there's no 311 section.
# The city's 311 Service Center page links its request form and app, on QAlert
# (somervillema.qscend.com); its requests are published on the city's open data
# portal (data.somervillema.gov, "311 Service, Information, and Feedback
# Requests"). SeeClickFix's Somerville place had 8 requests from September 21
# to October 17, 2026, all on Cambridge's request types.
[absences]
311 = "The city takes service requests through its own 311 service, on QAlert. It publishes them on its open data portal, which this site doesn't read."

# Who represents you (the Officials page). Kept by hand from official city and
# school websites; checked is the date the list was last checked against them.
# Only city- and school-issued email addresses, and the mayor's office phone.
[officials]
checked = "2026-10-27"
# The regular municipal election is on the Tuesday following the first Monday
# in November in each odd-numbered year (the city charter, Acts of 2025,
# chapter 31, section 7-3, adopted by the voters on November 4, 2025). The
# city hasn't published its 2027 election calendar.
next_election = "2027-11-02"
# The ward file is data/static/somerville-precincts-2022.geojson (MassGIS):
# seven wards of four precincts each, the council's and the School Committee's
# ward seats. No official page gives a term's end date, so term_ends is left out.
wards_file = "somerville-precincts-2022.geojson"
wards_publisher = "MassGIS"
wards_year = "2022"
wards_url = "https://gis.data.mass.gov/maps/aec5130790814ace94438d3bcf23cf9a"

# Elected on November 4, 2025 (official results). The phone and address are
# the Mayor's Office page's.
[[officials.bodies]]
name = "Mayor"
url = "https://www.somervillema.gov/mayor"
note = "Elected for two years; from the November 2, 2027 election, for four (the city charter and a 2025 ballot question). A member of the School Committee."
members = [
  { name = "Jake Wilson", seat = "Citywide", phone = "(617) 625-6600 x 2100", email = "mayor@somervillema.gov" },
]

