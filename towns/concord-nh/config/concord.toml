# Names, seats, and email addresses from the district's Board Members page.
# Elected November 7, 2023 (Campbell, Boucher, Hastings), November 5, 2024
# (Higgins, Walsh, Sadowski, at-large) and November 4, 2025 (Mineau, Meeker,
