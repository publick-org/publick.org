# The town's own text in Spanish, keyed by its English as written above or as
# the data writes it (board names, 311 categories). Plain Spanish, addressed as
# usted, following the engine's site/strings/es-guide.md and Lawrence's table
# where the English is the same. A board's name is given in Spanish only; the
# site shows its English name after it. To be checked by a person who reads
# Spanish before the site launches.
[strings.es]
# The correction in [[meetings.corrections]].
"The city calendar also lists the Arts Commission on Tuesday, October 27 and Tuesday, November 24: the fourth Tuesday of the month, when the commission now meets. This Monday entry is older than those two and is most likely left over from its earlier schedule. Check with the city before going." = "El calendario de la ciudad también muestra la Comisión de las Artes el martes 27 de octubre y el martes 24 de noviembre: el cuarto martes del mes, cuando la comisión se reúne ahora. Esta publicación de un lunes es más antigua que esas dos y probablemente quedó de su horario anterior. Consulte con la ciudad antes de ir."
# The masthead and the share text.
"Public data on how Manchester, New Hampshire is doing. Updated daily." = "Datos públicos sobre cómo le va a Manchester, New Hampshire. Se actualizan a diario."
"An independent guide to city government in Manchester, New Hampshire" = "Una guía independiente sobre el gobierno de la ciudad de Manchester, New Hampshire"

# Section summaries (the engine translates the section names every town shares).
"When the Board of Mayor and Aldermen, its committees, and the city's boards and commissions meet, with agendas, and the aldermen's minutes from January 2026 on." = "Cuándo se reúnen la Junta del Alcalde y Concejales, sus comités y las juntas y comisiones de la ciudad, con sus agendas, y las actas de los concejales desde enero de 2026."
"How fast the city responds to service requests to Public Works, Parking, and Police, by category and ward." = "Qué tan rápido responde la ciudad a las solicitudes de servicio a Obras Públicas, Estacionamiento y la Policía, por categoría y por distrito."
"The city's adopted budget, its property tax rate and where the tax goes, and the average single-family tax bill." = "El presupuesto aprobado de la ciudad, la tasa del impuesto a la propiedad y a dónde va ese dinero, y la factura promedio del impuesto a la propiedad de una casa unifamiliar."
"Manchester School District's graduation rate, state test results, and cost per pupil, with the state's." = "La tasa de graduación del Distrito Escolar de Manchester, los resultados de los exámenes estatales y el costo por estudiante, comparados con los del estado."
"The mayor, aldermen, and Board of School Committee, by office and by ward, and how to reach them." = "El alcalde, los concejales y el Comité Escolar, por cargo y por distrito, y cómo comunicarse con ellos."

# How to take part.
"Manchester residents may speak for up to three minutes during public comment, which may run up to 30 minutes at the start of each regular meeting. Sign up with the City Clerk, giving your name and topic, before it begins." = "Los residentes de Manchester pueden hablar hasta tres minutos durante los comentarios del público, que pueden durar hasta 30 minutos al comienzo de cada reunión regular. Inscríbase con el Secretario Municipal (City Clerk), con su nombre y su tema, antes de que empiecen."
"the Rules of the Board of Mayor and Aldermen" = "el Reglamento de la Junta del Alcalde y Concejales"
"Manchester residents may speak for up to three minutes in the public forum at each regular meeting. You're asked, but not required, to sign up with the clerk first, with your name, address, and topic. Complaints about school staff go to the Superintendent, not the public forum." = "Los residentes de Manchester pueden hablar hasta tres minutos en el foro público (public forum) de cada reunión regular. Se pide, pero no se exige, inscribirse antes con el secretario, con su nombre, su dirección y su tema. Las quejas sobre el personal escolar se presentan al Superintendente, no en el foro público."
"the Board of School Committee's Rules" = "el Reglamento del Comité Escolar"
"Manchester Public TV's Channel 22" = "el Canal 22 de Manchester Public TV"

# Glossary definitions (the terms themselves stay as the agendas write them).
"Board of Mayor and Aldermen, the city's governing body: the mayor and 14 aldermen." = "Junta del Alcalde y Concejales (Board of Mayor and Aldermen), el órgano de gobierno de la ciudad: el alcalde y 14 concejales."
"Community Improvement Program: the city's plan for paying for capital projects and special programs, with grants, city bonds, and city cash. The Board of Mayor and Aldermen adopts one each year." = "Programa de Mejoras Comunitarias (Community Improvement Program): el plan de la ciudad para pagar proyectos de inversión de capital y programas especiales con subvenciones, bonos de la ciudad y efectivo de la ciudad. La Junta del Alcalde y Concejales aprueba uno cada año."
"Routine items, chosen by the City Clerk with the mayor, that the Board approves together in one vote. Any member can have an item removed and taken up on its own." = "Asuntos de rutina, escogidos por el Secretario Municipal junto con el alcalde, que la Junta aprueba juntos en una sola votación. Cualquier miembro puede pedir que se saque un asunto para tratarlo por separado."

# Where the city posts agendas and minutes, and the data the site keeps up to date.
"city's Meeting Minutes and Agendas page" = "página de Actas y Agendas de Reuniones de la ciudad"
"Meetings (city calendar and CivicClerk)" = "Reuniones (calendario de la ciudad y CivicClerk)"
"311 requests" = "Solicitudes al 311"

# Officials: notes, seats, and roles.
"Elected citywide for two years. The mayor presides over the Board of Mayor and Aldermen and chairs the Board of School Committee." = "Elegido por toda la ciudad por dos años. El alcalde preside la Junta del Alcalde y Concejales y el Comité Escolar."
"Twelve aldermen elected by ward and two at-large, for two years. The mayor presides." = "Doce concejales elegidos por distrito y dos por toda la ciudad, por dos años. El alcalde preside."
"Twelve members elected by ward and two at-large, with the mayor as chair. Its meetings aren't listed on this site yet: the school district posts them on its own website, which the site doesn't read." = "Doce miembros elegidos por distrito y dos por toda la ciudad, con el alcalde como presidente. Sus reuniones todavía no aparecen en este sitio: el distrito escolar las publica en su propio sitio web, que este sitio no lee."
"Chairman of the Board" = "Presidente de la Junta"
"Appointed February 2026 to fill a vacancy" = "Por nombramiento en febrero de 2026, para cubrir una vacante"

