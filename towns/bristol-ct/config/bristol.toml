# Site configuration for Bristol, Connecticut. Everything town-specific lives
# here; the code is the Publick engine
# (github.com/publick-org/publick-engine).
#
# Started on 2026-11-01 by the engine's helper (python -m pipeline.new_town),
# from Medford's config.
#
# Bristol's website runs on CivicPlus. The City Council, its committees, and
# the city's boards and commissions post their meetings, agendas, and minutes
# on the city's CivicClerk portal (bristolct.portal.civicclerk.com), read as
# [meetings.civicclerk], as Medford's and Portland's are; the council's
# minutes are text PDFs. The Board of Education posts its agendas on
# BoardBook and its minutes on the district's website (ParentSquare
# SmartSites), neither of which the engine reads: its meetings are listed
# from the year's schedule on the district's BOE Calendar page
# ([schedule_meetings]), without documents. The city takes service requests
# through forms on its own website, not SeeClickFix, so the site has no 311
# section ([absences]). The engine's Connecticut package gives the budget, mill
# rate, and tax bill, from the state's Office of Policy and Management
# ([finance]), and school figures, from EdSight; housing and unemployment come
# from the Census and BLS, as for every town.
#
# The site is in English and Spanish ([site] languages), as every town's is.
# The first runs draft the Spanish for the town's own text; [strings.es], at
# the end, can correct it.

[site]
name = "Bristol Publick"
# The masthead shows name_prefix in dark ink and name_suffix in the accent
# color: the town, then the network.
name_prefix = "Bristol "
domain = "bristol-ct.publick.org"
tagline = "Public data on how Bristol, Connecticut decides and spends. Updated daily."
# One line under the name at the top of every page.
masthead = "An independent guide to city government in Bristol, Connecticut"
# Public contact address. Shown on the About and Accessibility pages when set.
contact_email = "bristol-ct@publick.org"
user_agent = "bristol-ct.publick.org (+https://bristol-ct.publick.org/about/)"

# From the city website's stylesheets (www.bristolct.gov, checked 2026-11-01):
# its two most used blues (#07467c, 32 uses, and #06457b, 15), and its green
# (#137038, 24 uses; the site's theme color is the same green, #147039);
# primary_soft a light tint of primary. Each passes WCAG AA on white (9.7,
# 9.8, 6.2 to 1). The bright blue CivicPlus uses elsewhere (#0098f7) doesn't
# pass.
[site.colors]
primary = "#07467c"
primary_dark = "#06457b"
primary_soft = "#e6ecf2"
accent = "#137038"

[town]
name = "Bristol"
# The Officials page calls the council's districts "District 1" to "District
# 3", as the city does.
areas = "districts"
state_abbr = "CT"
official_site = "https://www.bristolct.gov"

# Sections appear in the main navigation in this order. Each one is a folder
# under site/pages/<slug>/ and is served at https://<domain>/<slug>/.
[[sections]]
slug = "meetings"
title = "Meetings"
summary = "When the City Council, its committees, and the city's boards and commissions meet, with agendas and minutes from January 2026 on, and the Board of Education's meeting dates."
status = "live"

[[sections]]
slug = "schools"
title = "Schools"
summary = "Graduation, attendance, state test results, and spending per pupil compared with the state."
status = "live"

[[sections]]
slug = "budget"
title = "City budget"
nav = "Budget"
summary = "The city's adopted budget, its mill rate and what the property tax raises, and the average single-family tax bill."
status = "live"

[[sections]]
slug = "housing"
title = "Housing"
summary = "New homes permitted, home values and rents, and the housing stock."
status = "live"

[[sections]]
slug = "officials"
title = "Who represents you"
nav = "Officials"
summary = "The mayor, City Council, and Board of Education, and how to reach them."
status = "live"

[[sections]]
slug = "about"
title = "About"
summary = "Data sources, update schedule, metric definitions, and corrections."
status = "live"

# Page view counting with GoatCounter, on the network's site; prefix is this
# town's folder.
[analytics]
prefix = "bristol-ct"

# The weekly digest's email signup, on /digest/ (the engine's pipeline/digest.py). The form posts
# to this site's /digest/subscribe, which the sites Worker answers (worker/digest.js) and passes on
# to Buttondown with the tag bristol-ct-en. The About page names who keeps the addresses.
[digest]
# The network's settings (defaults/network.toml): having the table turns the signup on.

# Public meetings, from the city's CivicClerk portal. The portal files each
# meeting under a category, and the engine reads its board from its title,
# matched to the longest of these it contains; a title that names no board
# ("Red Light Camera Presentations", "CDBG First Public Hearing") is filed
# under its category's board ([meetings.civicclerk] board_from_category).
# The boards are the portal's categories, named as the city's Boards,
# Committees & Task Forces pages and the meetings' agendas name them.
[meetings]
calendar_url = "https://bristolct.portal.civicclerk.com"
archive_url = "https://bristolct.portal.civicclerk.com"
archive_name = "city's CivicClerk portal"
governing_body = "City Council"
# The city's site resets some connections (4 of the helper's); a slower pace
# and the client's retries help.
request_delay = 5.0
max_event_pages = 40
boards = [
  "City Council",
  "Joint Meeting of the City Council and Board of Finance",
  "Ordinance Committee",
  "Real Estate Committee",
  "Salary Committee",
  "American Rescue Plan Task Force",
  "Animal Control Building Committee",
  "Aquifer Protection Agency",
  "Board of Assessment Appeals",
  "Board of Ethics",
  "Board of Finance",
  "Board of Finance Banking & Audit Committee",
  "Board of Finance Insurance Committee",
  "Board of Finance Purchasing Committee",
  "Board of Fire Commissioners",
  "Board of Health",
  "Board of Park Commissioners",
  "Board of Police Commissioners",
  "Board of Police Commissioners Traffic Subcommittee",
  "Board of Public Works",
  "Board of Water Commissioners",
  "Bristol Early Childhood Collaborative",
  "Building Code Board of Appeals",
  "Capital Improvement and Strategic Planning Committee",
  "Cemetery Commission",
  "City Arts & Culture Commission",
  "Code Enforcement Committee",
  "Commission for Persons with Disabilities",
  "Commission on Aging",
  "Conservation Commission/Inland Wetlands and Watercourses Agency",
  "Diversity Council",
  "Economic and Community Development Board",
  "Economic and Community Development Board Budget Committee",
  "Economic and Community Development Board Downtown Committee",
  "Economic and Community Development Board Industrial Committee",
  "CDBG Policy Committee",
  "Energy Commission",
  "Fair Rent Commission",
  "Fire Station 3 Building Committee",
  "Historic District Commission",
  "Library Board of Directors",
  "Mayor's Opioid Task Force",
  "Parking Authority",
  "Planning Commission",
  "Police Awards Committee",
  "Retirement Board",
  "Sewer Commission",
  "Storm Water Trust",
  "Transportation Commission",
  "Youth and Community Services Commission",
  "Zoning Board of Appeals",
  "Zoning Commission",
]

# Other names the portal's titles use for a board.
[meetings.aliases]
# The monthly Joint Meeting of the City Council and Board of Finance, titled
# without "the" ("Joint Meeting of City Council and Board of Finance").
"Joint Meeting of City Council and Board of Finance" = "Joint Meeting of the City Council and Board of Finance"
# The Board of Police Commissioners' special meetings ("Special Police Board
# Meeting") and its Traffic Sub-Committee, as its agendas title it.
"Police Board" = "Board of Police Commissioners"
"Police Commission Traffic Sub Committee" = "Board of Police Commissioners Traffic Subcommittee"
# The Board of Finance's committees, titled by their own names ("Insurance
# Committee"); their agendas call each a committee "of the Board of Finance".
"Banking & Audit Committee" = "Board of Finance Banking & Audit Committee"
"Insurance Committee" = "Board of Finance Insurance Committee"
"Purchasing Committee" = "Board of Finance Purchasing Committee"
# The Economic and Community Development Board's meetings, titled
# "Economic and Community Development", and its committees ("ECD Industrial
# Committee Special Meeting").
"Economic and Community Development" = "Economic and Community Development Board"
"ECD Budget Committee" = "Economic and Community Development Board Budget Committee"
"ECD Downtown Committee" = "Economic and Community Development Board Downtown Committee"
"ECD Industrial Committee" = "Economic and Community Development Board Industrial Committee"
# The School Readiness Council, as the Bristol Early Childhood Collaborative
# was titled until March 2026 (its agendas were already the Early Childhood
# Collaborative's).
"School Readiness Council" = "Bristol Early Childhood Collaborative"
# The Youth Commission, renamed the Youth and Community Services Commission
# (Code of Ordinances, Secs. 18-148 to 18-159, effective May 1, 2026).
"Youth Commission" = "Youth and Community Services Commission"
# The Commission on Aging's meetings titled "COA January 15 2026".
"COA" = "Commission on Aging"
# Spellings in some titles.
"Opioid Task Force" = "Mayor's Opioid Task Force"
"ARP Task Force" = "American Rescue Plan Task Force"
"Arts & Culture Commission" = "City Arts & Culture Commission"
"Conservation Commission/Inland Wetlands and Watercourse Agency" = "Conservation Commission/Inland Wetlands and Watercourses Agency"
"Fire Staion 3 Building Committee" = "Fire Station 3 Building Committee"
"Building Code of Appeals" = "Building Code Board of Appeals"

[meetings.civicclerk]
api_url = "https://bristolct.api.civicclerk.com/v1"
portal_url = "https://bristolct.portal.civicclerk.com"
# Meetings, agendas, and minutes are collected from here on.
since = "2026-01-01"
# Most of the portal's meetings are under a catch-all category, and some are
# named for an item, not a board: those go under the board their category
# names.
board_from_category = true
# Left out: entries that aren't a meeting of a city body. The tree warden's
# hearings ("Tree Hearing", "Tree Hearing: Page Park Tree Removal"), the
# citation hearing officer's appeals hearings ("Citation Hearings", "Citation
# Appeals Hearing"), a public information session ("Household and Business
# Flood Action Plan"), and untitled entries in the catch-all category, which
# take its name, "General" (two of them, of March 28 and August 31, 2026, are
# the Early Childhood Collaborative's and the Code Enforcement Committee's
# meetings, which their titles don't say).
exclude_pattern = '^Tree Hearing\b|\bCitation (Appeals )?Hearings?\b|\bFlood Action Plan\b|^General$'

# The Board of Education's regular meetings, from the year's schedule on the
# district's BOE Calendar page ("November 4, 2026", "December 2, 2026* 7:00pm").
# The board posts its agendas on BoardBook (meetings.boardbook.org) and its
# minutes on the district's BOE Meeting Minutes page, titled by dates in
# figures ("10.07.26 - Regular BOE Meeting Minutes"); the engine reads
# neither, so the board's meetings are listed without their documents, and its
# special meetings and committees aren't listed.
[schedule_meetings]
url = "https://www.bristol.k12.ct.us/boe-calendar"
source_name = "Bristol Public Schools"
body = "Board of Education"

# Agenda and minutes PDFs live in the network's documents bucket, not in git
# (see pipeline/documents.py). Keys: STORAGE_ACCESS_KEY_ID,
# STORAGE_SECRET_ACCESS_KEY.
[storage]
prefix = "bristol-ct"

# Plain-English agenda text and previews, and decisions from minutes, written
# by a language model and labeled as AI-generated on the site. Only meetings
# from `since` on are summarized, about three months before launch, so the
# town's history doesn't take the month's budget.
[summaries]
since = "2026-08-01"

# The boards' meetings below, transcribed from their recordings for a summary
# the day after, until the minutes come (the engine's pipeline/recordings.py).
[recordings]
since = "2026-10-26"

# The city's CivicClerk portal keeps many meetings' videos with them: by the event's name, or else its
# category ("City Council Meeting", "Special City Council 10-29-26", and "Red Light Camera Presentations",
# in the City Council's category; "Joint Meeting of City Council and Board of Finance", whose video, at
# 6:45 PM, often holds the Council's 7:00 PM meeting after it; "Planning Commission"; "Zoning
# Commission"; "Zoning Board of Appeals"). Each is matched to the meeting it's posted with.
[[recordings.sources]]
platform = "civicclerk"
api_url = "https://bristolct.api.civicclerk.com/v1"
portal_url = "https://bristolct.portal.civicclerk.com"
media_url = "https://cpmedia.azureedge.net/bristolct"

[recordings.sources.boards]
"City Council" = '^(Special )?City Council\b'
"Joint Meeting of the City Council and Board of Finance" = '\bJoint Meeting\b'
"Planning Commission" = '^Planning Commission\b'
"Zoning Commission" = '^Zoning Commission\b'
"Zoning Board of Appeals" = '^Zoning Board of Appeals\b'

# Nutmeg TV's channel, the community access station that records the Council's regular meetings (the
# portal's events have linked its videos): titled "Bristol City Council Meeting - 10/13/26", a day or
# two after the meeting (other towns' meetings and programs on the channel are left out).
[[recordings.sources]]
platform = "youtube"
channel = "UC9jy8WJuhXggiF0JHf2diEQ"
boards = { "City Council" = '^\s*bristol\s+(?:special\s+)?city\s+council\b' }

# Bristol Public Schools' channel: the Board of Education's regular meetings, titled "10/07/2026 -
# Regular Board of Education Meeting" or "5/6/2026- Regular BOE Meeting" (its special meetings, not
# listed here, and its committees are left out).
[[recordings.sources]]
platform = "youtube"
channel = "UCo3gTprD7JadmALEilkZgPg"
boards = { "Board of Education" = '\bregular\s+(?:board\s+of\s+education|boe)\s+meeting\b' }

# How residents can take part, per board, shown on its meeting pages. Only
# what the city or the school district has published; each entry names its
# source. The City Council's from its agendas, each of which has a Public
# Participation item near its start and a Zoom link (the agenda of October 13,
# 2026); its minutes record each speaker's name and address. The council's
# meetings are recorded on the city's CivicClerk portal.
[participation."City Council"]
comment = "Residents can address the Council in the Public Participation period near the start of each regular meeting, giving their name and address. Each agenda also gives a Zoom link to follow the meeting."
source_title = "City Council agenda of October 13, 2026"
source_url = "https://bristolct.portal.civicclerk.com/event/4766/files"
video_title = "the city's CivicClerk portal"
video_url = "https://bristolct.portal.civicclerk.com"

# The Board of Education's from the Public Comment item of its agendas on
# BoardBook (the meeting of November 4, 2026), which restates its Policy 1120,
# Public Participation at Board of Education Meetings.
[participation."Board of Education"]
comment = "Residents can speak in the Public Comment period of Board meetings, once and for up to four minutes, after giving their name, address, and topic. Written comments can be emailed to the address on each agenda; those received by 4:00 p.m. on the meeting day go to Board members before the meeting."
source_title = "Board of Education agenda of November 4, 2026 (Policy 1120)"
source_url = "https://meetings.boardbook.org/Public/Agenda/2447?meeting=772970"

# Terms that come up on agendas and minutes, explained on each meeting page
# where they appear. Acronyms match exactly; other terms ignore case.
# From the city's Joint Meeting page (bristolct.gov/509/Joint-Meeting).
[[glossary]]
term = "Joint Meeting"
definition = "The City Council and the Board of Finance meeting together, monthly on the second Tuesday at 6:45 p.m., before the Council's regular meeting."

# From the department's page (bristolct.gov/175) and the Mayor's Office page,
# on the merger of the Park and Recreation Department with Youth and Community
# Services; the council's minutes write it PRYCS.
[[glossary]]
term = "PRYCS"
definition = "Parks, Recreation, Youth and Community Services, the city department for its parks, pools, recreation programs, and youth services."

# From the city's Bristol-Burlington Health District page
# (bristolct.gov/355/Health-District-Bristol-Burlington).
[[glossary]]
term = "BBHD"
definition = "The Bristol-Burlington Health District, the public health department Bristol shares with the town of Burlington. Its Board of Health has members from both towns."

# Schools: EdSight, the State Department of Education's data portal, where
# the district is "Bristol School District" (district code 0170011, as the
# state's Next Generation Accountability System dataset on data.ct.gov names
# it); the district calls itself Bristol Public Schools.
[schools]
edsight_district = "Bristol School District"
district_name = "Bristol Public Schools"

# Budget, mill rate, and property tax (pipeline/states/ct/), from the Office
# of Policy and Management's statewide datasets on data.ct.gov; the average
# single-family bill is calculated from the state's yearly Parcel and CAMA
# file, where Bristol codes its single-family homes 101 (14,332 parcels in the
# 2026 file), the engine's default. The city's own budget books are on the
# Comptroller's Budget page, a page a year.
[finance]
opm_town = "Bristol"
opm_code = 17
budget_documents_url = "https://www.bristolct.gov/144/Budget"

# Housing: Census building permits and the American Community Survey. Bristol
# is a Census place, Bristol city (09-08420), the same land as the town; the
# Building Permits Survey lists it by that place code.
[housing]
bps_place = "08420"
census_geo = "16000US0908420"

# Unemployment rate (BLS Local Area Unemployment Statistics, area
# CT0908420000000, "Bristol city/town, CT").
[labor]
local_series = "LAUCT090842000000003"

# How often each data source should update. Figures published monthly or
# yearly are judged by the engine, by the period they cover
# (pipeline/rhythms.py). The Board of Education's schedule is read with the
# city's meetings.
[freshness]
sources = [
  { label = "Meetings (CivicClerk)", file = "meetings/status.json", max_days = 2 },
]

# The About page's "What this site doesn't cover": why there's no 311 section.
# The city takes requests through its Online Services and Forms page
# (bristolct.gov/907): CivicPlus and SeamlessDocs forms, whose requests aren't
# published. SeeClickFix has a place named Bristol, CT (place 3051), but its
# 221 requests, the newest of 2025-11-01, were none of them acknowledged.
[absences]
311 = "The city takes requests through forms on its own website, which has no public data."

# Who represents you (the Officials page). Kept by hand from official city and
# school websites; checked is the date the list was last checked against them.
# Only city- and school-issued email addresses, and the mayor's office phone
# (the council's page also lists councilors' own phone numbers, which are left
# out). There is no ward map: the city publishes its council districts only
# as a PDF map (bristolct.gov/838/Voting-District-Map), and its GIS's Polling
# District layer is by state house district ("77-1"), not council district.
# The city's charter is on Municode, which blocks automated requests, so
# terms are from the official election results and the City Council's
# minutes.
[officials]
checked = "2026-11-01"
# The next regular municipal election: November 2, 2027. The city elects its
# mayor, council, and Board of Education in odd years (the Registrars of
# Voters' Election Results page). Nothing municipal is on the state election
# ballot of November 3, 2026: the City Council's 2026 minutes call no
# referendum, and the Charter Revision Commission was only created on October
# 13, 2026 (the council's agenda).
next_election = "2027-11-02"

# Elected citywide on November 4, 2025 (the official results, 7,439 to
# 7,278), for two years; the new council first met on November 12, 2025 (its
# minutes), and the Board of Finance's page gives the mayor's term as ending
# 11/27. She votes on the council: its roll calls list "Mayor Zoppo-Sassu"
# with the six members (minutes of February 10, 2026).
[[officials.bodies]]
name = "Mayor"
url = "https://www.bristolct.gov/172/Mayors-Office"
note = "Elected citywide for two years. The mayor presides over the City Council and votes as one of its seven members."
members = [
  { name = "Ellen Zoppo-Sassu", seat = "Citywide", term_ends = "2027-11", email = "mayorsoffice@bristolct.gov", phone = "(860) 584-6250" },
]

# Names, districts, and email addresses from the City Council Members page,
# confirmed against the official results of November 4, 2025 (two winners in
# each district: Hahn and Rosengren, Kelley and Tyler, Dickau and Seymour) and
# the roll call of the council's minutes of September 8, 2026. The results
# write "Steven Seymour"; the council's page "Steve Seymour".
[[officials.bodies]]
name = "City Council"
url = "https://www.bristolct.gov/1030/City-Council-Members"
note = "The mayor and six council members, two elected from each of the city's three council districts, for two years. The mayor presides."
members = [
  { name = "Greg Hahn", seat = "District 1", ward = 1, term_ends = "2027-11", email = "greghahn@bristolct.gov" },
  { name = "Erick Rosengren", seat = "District 1", ward = 1, term_ends = "2027-11", email = "erickrosengren@bristolct.gov" },
  { name = "Peter Kelley", seat = "District 2", ward = 2, term_ends = "2027-11", email = "peterkelley@bristolct.gov" },
  { name = "Susan Tyler", seat = "District 2", ward = 2, term_ends = "2027-11", email = "susantyler@bristolct.gov" },
  { name = "Mark Dickau", seat = "District 3", ward = 3, term_ends = "2027-11", email = "markdickau@bristolct.gov" },
  { name = "Steve Seymour", seat = "District 3", ward = 3, term_ends = "2027-11", email = "steveseymour@bristolct.gov" },
]

# Names, officers, and email addresses from the district's Board of Education
# Members and Contact Board Members pages. Elected citywide: on November 7,
# 2023, for four years, Pons, Simmons, Osenkowski, Giantonio, and Anderson; on
# November 4, 2025, Tedesco, Fitzsimons-Bula, Ledger, and Van Gorder (the
# official results). The City Council appointed Robert Parenti (replacing
# Russell Anderson, February 10, 2026), Jennifer Tagariello (replacing Maria
# Pirro Simmons, June 9, 2026), and Thomas Hick (replacing Lorianne
# Osenkowski, September 22, 2026), each "term to 11/27" (the council's
# minutes), which dates the 2023 seats' end; the 2025 seats end four years
# later. The Contact Board Members page links Hick's and Parenti's addresses
# to other members' (Osenkowski's and Tagariello's), so theirs are left out.
# The council's liaison, Councilor Kelley, isn't a member.
[[officials.bodies]]
name = "Board of Education"
url = "https://www.bristol.k12.ct.us/board-of-education-2"
note = "Nine members elected citywide for four years, in staggered terms. The City Council fills a vacancy until the seat's term ends."
members = [
  { name = "Shelby Pons", seat = "At-large", role = "Chair", term_ends = "2027-11", email = "shelbypons@bristolk12.org" },
  { name = "Jennifer Tagariello", seat = "At-large", role = "Vice Chair", term_ends = "2027-11", email = "jennifertagariello@bristolk12.org" },
  { name = "Jill Fitzsimons-Bula", seat = "At-large", role = "Secretary", term_ends = "2029-11", email = "jillfitzsimonsbula@bristolk12.org" },
  { name = "Kristen Giantonio", seat = "At-large", term_ends = "2027-11", email = "kristengiantonio@bristolk12.org" },
  { name = "Thomas Hick", seat = "At-large", term_ends = "2027-11" },
  { name = "Kara Ledger", seat = "At-large", term_ends = "2029-11", email = "karaledger@bristolk12.org" },
  { name = "Robert Parenti", seat = "At-large", term_ends = "2027-11" },
  { name = "Barbara Tedesco", seat = "At-large", term_ends = "2029-11", email = "barbaratedesco@bristolk12.org" },
  { name = "Jennifer Van Gorder", seat = "At-large", term_ends = "2029-11", email = "jennifervangorder@bristolk12.org" },
]
