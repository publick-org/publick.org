# The town's own text in Spanish, keyed by its English as written above or as
# the data writes it (board names). Plain Spanish for the network's readers,
# most of them Puerto Rican or Dominican, addressed as usted, following the
# engine's site/strings/es-guide.md. A board's name is given in Spanish only;
# the site shows its English name after it. To be checked by a person who
# reads Spanish before the site launches.
[strings.es]
# The masthead and the share text.
"Public data on how Beverly, Massachusetts decides and spends. Updated daily." = "Datos públicos sobre cómo Beverly, Massachusetts, toma decisiones y gasta su dinero. Se actualizan a diario."
"An independent guide to city government in Beverly, Massachusetts" = "Una guía independiente sobre el gobierno de la ciudad de Beverly, Massachusetts"

# Section summaries (the engine translates the section names every town shares).
"Every board and committee meeting in the city's Agenda Center, with agendas, and minutes from January 2026 on." = "Todas las reuniones de las juntas y comités en el Centro de Agendas de la ciudad, con sus agendas, y las actas desde enero de 2026."

# Officials: notes, seats, and roles.
"Six councilors elected by ward and three at-large, for two years." = "Seis concejales elegidos por distrito y tres por toda la ciudad, por dos años."
"Six members elected by ward and two by district (District A is Wards 1 to 3, District B Wards 4 to 6), for two years, and the mayor as the ninth member." = "Seis miembros elegidos por distrito y dos por los distritos A y B (el A abarca los Distritos 1 a 3 y el B, los Distritos 4 a 6), por dos años, y el alcalde como noveno miembro."

