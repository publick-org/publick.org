# Site configuration for Beverly, Massachusetts.
# Everything town-specific lives here; the code is the Publick engine
# (github.com/publick-org/publick-engine).
#
# Beverly's website runs on CivicPlus, and the City Council posts agendas and
# minutes in the Agenda Center, as Malden's boards do. The School Committee
# posts on the school district's website instead, which the engine doesn't
# read yet. 311 requests are in the city's own system (MyBeverly), which has
# no public data, so the site has no 311 section. The state sources (DLS,
# DESE, BLS, Census, the Subsidized Housing Inventory) are the same as
# Malden's.
#
# Like every Publick site, this one is in English and Spanish ([site]
# languages). [strings.es], at the end, gives the Spanish for the town's own
# text; the engine has the rest.
[site]
name = "Beverly Publick"
# The masthead shows name_prefix in dark ink and name_suffix in the accent
# color: the town, then the network.
name_prefix = "Beverly "
name_suffix = "Publick"
domain = "beverly-ma.publick.org"
# The network of town sites this one belongs to, named in every page footer.
network = "Publick"
network_url = "https://publick.org"
tagline = "Public data on how Beverly, Massachusetts decides and spends. Updated daily."
# One line under the name at the top of every page.
masthead = "An independent guide to city government in Beverly, Massachusetts"
repo_url = "https://github.com/publick-org/publick.org"
# Public contact address. Shown on the About and Accessibility pages when set.
contact_email = "beverly-ma@publick.org"
timezone = "America/New_York"
user_agent = "beverly-ma.publick.org (+https://beverly-ma.publick.org/about/)"
# English at the site's root, Spanish under /es/.
languages = ["en", "es"]

# From the city website's theme (beverlyma.gov); each passes WCAG AA on white.
[site.colors]
primary = "#005287"
primary_dark = "#041e41"
primary_soft = "#e6eef4"
accent = "#803e3e"

[town]
name = "Beverly"
state = "Massachusetts"
state_abbr = "MA"
official_site = "https://www.beverlyma.gov"

# Sections appear in the main navigation in this order. Each one is a folder
# under site/pages/<slug>/ and is served at https://<domain>/<slug>/.
[[sections]]
slug = "meetings"
title = "Meetings"
summary = "Every board and committee meeting in the city's Agenda Center, with agendas, and minutes from January 2026 on."
status = "live"

[[sections]]
slug = "schools"
title = "Schools"
summary = "Graduation, attendance, and MCAS results compared with the state."
status = "live"

[[sections]]
slug = "budget"
title = "City budget"
nav = "Budget"
summary = "Where general fund money comes from and how it is spent, reserves, and the property tax limit."
status = "live"

[[sections]]
slug = "housing"
title = "Housing"
summary = "New homes permitted, home values and rents, affordable housing, and the housing stock."
status = "live"

[[sections]]
slug = "officials"
title = "Who represents you"
nav = "Officials"
summary = "The mayor, City Council, and School Committee, by office and by ward, and how to reach them."
status = "live"

[[sections]]
slug = "about"
title = "About"
summary = "Data sources, update schedule, metric definitions, and corrections."
status = "live"

# Page view counting with GoatCounter, on the network's site; prefix is this
# town's folder.
[analytics]
goatcounter = "publick"
prefix = "beverly-ma"
public_stats = ""

# The weekly digest's email signup, on /digest/ (the engine's pipeline/digest.py). The form posts
# to this site's /digest/subscribe, which the sites Worker answers (worker/digest.js) and passes on
# to Buttondown with the tag beverly-ma-en. The About page names who keeps the addresses.
[digest]
signup = true
provider = "Buttondown"
privacy_url = "https://buttondown.com/legal/privacy"

# Public meetings, from the city's CivicPlus calendar and Agenda Center.
[meetings]
base_url = "https://www.beverlyma.gov"
archive_url = "https://www.beverlyma.gov/AgendaCenter"
archive_name = "city's Agenda Center"
# The city's site resets some connections; a slower pace and the client's retries help.
request_delay = 4.0
max_event_pages = 40

# The city calendar, read month by month ([meetings.civicplus], engine v1.31 on):
# the meetings the city lists before their agendas are posted, with their
# times and places. A meeting on the calendar and in the Agenda Center is
# shown once.
[meetings.civicplus]
calendars = ["City Meetings"]

# Agenda Center categories, and calendar names, renamed to the board's usual
# name. Names written last-name-first ("Health, Board of") are turned round by
# the engine.
[meetings.aliases]
"Water Supply Board, Salem and Beverly" = "Salem and Beverly Water Supply Board"
# The calendar's names for boards the Agenda Center names otherwise.
"Budget/Managment Analyst Preliminary Screening Committee" = "City Council Budget/Management Analyst Screening Committee"
"Budget/Management Analyst Preliminary Screening Committee" = "City Council Budget/Management Analyst Screening Committee"
"Joint Meeting Legal Affairs/Public Services/Committee of the Whole" = "City Council Joint Committee"
"Historic Districts Commission" = "Historic District Commission"
"Beverly License Board" = "Licensing Board"

[meetings.agenda_center]
base_url = "https://www.beverlyma.gov"
# The first run lists meetings from here, and minutes are collected from here on.
since = "2026-01-01"

# City Council committees post under the City Council. Each meets with the
# Committee of the Whole ("Public Services/Committee of the Whole"), so that
# name isn't listed: the committee's own name decides the board.
[meetings.agenda_center.committees."City Council"]
"Finance and Property" = "City Council Finance and Property Committee"
"Legal Affairs" = "City Council Legal Affairs Committee"
"Public Services" = "City Council Public Services Committee"
"Joint Meeting Legal Affairs" = "City Council Joint Committee"
"School Committee" = "Joint City Council and School Committee"
"Preliminary Screening" = "City Council Budget/Management Analyst Screening Committee"
"PreliminaryScreening" = "City Council Budget/Management Analyst Screening Committee"

# The School Committee's meetings, from the school district's calendar feed
# (Edlio), with their times ([ical_meetings], engine v1.31 on). Agendas are on
# the district's website.
[ical_meetings]
ical_url = "https://www.beverlyschools.org/apps/events/ical/?id=0"
page_url = "https://www.beverlyschools.org/apps/pages/index.jsp?uREC_ID=2083091&type=d"
source_name = "Beverly Public Schools"
since = "2026-09-01"

[ical_meetings.bodies]
"School Committee" = "School Committee"
"Committee of the Whole" = "School Committee of the Whole"
"Policy Subcommittee" = "School Committee Policy Subcommittee"
"Policy Committee" = "School Committee Policy Subcommittee"
"Finance & Facilities" = "School Committee Finance and Facilities Subcommittee"
"Negotiations Subcommittee" = "School Committee Negotiations Subcommittee"
"Curriculum, Instruction & Student Life" = "School Committee Curriculum, Instruction and Student Life Subcommittee"

# Agenda and minutes PDFs, in the network's documents bucket.
[storage]
endpoint = "https://6bbfee5a3892553c7993dbfa4b4e8453.r2.cloudflarestorage.com"
bucket = "publick-documents"
public_url = "https://files.publick.org"
prefix = "beverly-ma"

# Agenda previews and decisions from minutes, written by a language model and
# labeled as AI-generated on the site. Within the network's monthly budget.
[summaries]
model = "claude-sonnet-5"
max_per_run = 40
input_price = 2.0
output_price = 10.0
max_cost_per_run = 5.0

# How residents can take part, per board, shown on its meeting pages. Only
# what the city and the school district have published; each entry names its
# source. The Council's comment rules are Appendix A of its Rules and Orders.
# Both boards' meetings are streamed and broadcast by BevCam, the city's local
# access station (the city website's BevCam link goes to bevcam.org); BevCam's
# Government Access channel page lists the Council's recordings, and the
# district's Video Archives page the School Committee's.
[participation."City Council"]
comment = "People who live or work in Beverly can speak for up to three minutes in the public comment period of a regular Council meeting. Sign up with the City Clerk's office by 9:30 a.m. on the day of the meeting; the period is limited to five speakers, first come, first served."
source_title = "the City Council's Rules and Orders"
source_url = "https://www.beverlyma.gov/DocumentCenter/View/7654/Rules-and-Orders-of-the-Beverly-City-Council-PDF"
video_title = "BevCam"
video_url = "https://bevcam.org/government-channel/"

# From Policy BEDH and its guidelines (BEDH-E) in the district's policy
# manual, which the district website links.
[participation."School Committee"]
comment = "Residents can speak for up to three minutes in the public comment period near the start of each regular School Committee meeting, after giving their name and address. The period lasts 20 minutes in all."
source_title = "the district's policy manual (Policy BEDH)"
source_url = "https://docs.google.com/document/d/1hYbvteXi4yy4gsMYJGekNlRUXz1lcy2DyvrJ7wmUxSc/edit"
video_title = "BevCam"
video_url = "https://www.beverlyschools.org/apps/pages/index.jsp?uREC_ID=2083091&type=d&pREC_ID=2285699"

# Terms that come up on agendas and minutes, explained on each meeting page
# where they appear. Acronyms match exactly; other terms ignore case. From the
# city's pages for the Zoning Board of Appeals, the Building Department's
# variance FAQ, the Conservation Commission (its Notice of Intent
# instructions), the Community Preservation Committee, and the Historic
# District Commission's Rules of Procedure.
[[glossary]]
term = "executive session"
definition = "A part of a public meeting closed to the public. State law allows it only for specific reasons, such as lawsuits, negotiations, or personnel matters."

[[glossary]]
term = "M.G.L."
definition = "Massachusetts General Laws, the state's laws."

[[glossary]]
term = "Committee of the Whole"
definition = "The full City Council meeting as a committee, to discuss a matter before voting on it at a regular meeting."

[[glossary]]
term = "CPA"
definition = "Community Preservation Act. A local property tax surcharge, with state matching money, that pays for open space, historic preservation, affordable housing, and recreation."

[[glossary]]
term = "CPC"
definition = "Community Preservation Committee, which reviews applications for Community Preservation Act money and recommends projects to the City Council."

[[glossary]]
term = "ZBA"
definition = "Zoning Board of Appeals."

[[glossary]]
term = "special permit"
definition = "Permission from a city board, such as the Zoning Board of Appeals, for a use or project that the zoning ordinance allows only with the board's approval, given after a public hearing."

[[glossary]]
term = "variance"
definition = "Permission from the Zoning Board of Appeals to depart from the zoning ordinance, such as to build closer to a lot line than it allows. It can be granted only when the shape, soil, or slope of the land would make following the rules a substantial hardship."

[[glossary]]
term = "Notice of Intent"
definition = "An application to the Conservation Commission, under the state's Wetlands Protection Act, for work in or near wetlands. If the commission approves, it issues an Order of Conditions."

[[glossary]]
term = "Order of Conditions"
definition = "The Conservation Commission's permit for work in or near wetlands, with the conditions the work must follow."

[[glossary]]
term = "demolition delay"
definition = "Under the city's Demolition Delay Ordinance, the Historic District Commission can delay a permit to demolish a building more than 50 years old for up to 12 months, if it finds the building historically significant and preferably preserved."

