# The town's own text in Spanish, keyed by its English as written above or as
# the data writes it (board names). Plain Spanish for Lawrence's readers, most
# of them Dominican or Puerto Rican, addressed as usted, following the engine's
# site/strings/es-guide.md. A board's name is given in Spanish only; the site
# shows its English name after it. Not checked by a person: the site says it's
# translated with AI.
[strings.es]
"The city takes concerns through a form on its own website, which has no public data." = "La ciudad recibe inquietudes mediante un formulario en su propio sitio web, que no tiene datos públicos."
# The masthead and the share text.
"Public data on how Lawrence, Massachusetts decides and spends. Updated daily." = "Datos públicos sobre cómo Lawrence, Massachusetts, toma decisiones y gasta su dinero. Se actualizan a diario."
"An independent guide to city government in Lawrence, Massachusetts" = "Una guía independiente sobre el gobierno de la ciudad de Lawrence, Massachusetts"

# Section summaries (the engine translates the section names every town shares).
"Every board and committee meeting in the city's Agenda Center, with agendas, and minutes from January 2026 on." = "Todas las reuniones de las juntas y comités en el Centro de Agendas de la ciudad, con sus agendas, y las actas desde enero de 2026."

# How to take part.
"Residents who sign in can speak to the Council during the public participation part of its regular meetings." = "Los residentes que se inscriban pueden hablarle al Concejo durante el turno de participación del público en sus reuniones regulares."
"City Council minutes of February 3, 2026" = "Actas del Concejo Municipal del 3 de febrero de 2026"
"the City Council's YouTube channel" = "el canal de YouTube del Concejo Municipal"
"Lawrence Public Schools' YouTube channel" = "el canal de YouTube de las Escuelas Públicas de Lawrence"

# Glossary definitions (the terms themselves stay as the agendas write them).
"Collective bargaining agreement: a contract between the city and a union of its employees, setting pay and working conditions." = "Convenio colectivo (collective bargaining agreement): un contrato entre la ciudad y un sindicato de sus empleados que fija el salario y las condiciones de trabajo."
"Cost-of-living adjustment: a raise in pay or a pension to keep up with rising prices." = "Ajuste por costo de vida (cost-of-living adjustment): un aumento del salario o de la pensión para compensar la subida de los precios."

# Officials: notes, seats, and roles.
"Six councilors elected by district (Wards A to F) and three at-large, for two years." = "Seis concejales elegidos por distrito (de la A a la F) y tres por toda la ciudad, por dos años."
