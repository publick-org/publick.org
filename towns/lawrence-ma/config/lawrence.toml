# Site configuration for Lawrence, Massachusetts. Everything town-specific lives
# here; the code is the Publick engine (github.com/publick-org/publick-engine).
#
# Lawrence's website runs on CivicPlus, and every board posts agendas and
# minutes in the Agenda Center, as Malden's do: the City Council, its
# committees (each in a category of its own), and the School Committee. The
# council's minutes are posted months after its meetings, once approved.
# There is no 311 section: the city takes concerns through a form on its own
# website, and the few SeeClickFix requests in Lawrence go unanswered. The
# state sources (DLS, DESE, BLS, Census, the Subsidized Housing Inventory) are
# the same as Malden's.
#
# Most residents are Hispanic and many read Spanish first, so the site is in
# English and Spanish ([site] languages). [strings.es], at the end, gives the
# Spanish for the town's own text; the engine has the rest.

[site]
name = "Lawrence Publick"
# The masthead shows name_prefix in dark ink and name_suffix in the accent
# color: the town, then the network.
name_prefix = "Lawrence "
name_suffix = "Publick"
domain = "lawrence-ma.publick.org"
# The network of town sites this one belongs to, named in every page footer.
network = "Publick"
network_url = "https://publick.org"
tagline = "Public data on how Lawrence, Massachusetts decides and spends. Updated daily."
# One line under the name at the top of every page.
masthead = "An independent guide to city government in Lawrence, Massachusetts"
repo_url = "https://github.com/publick-org/publick.org"
# Public contact address. Shown on the About and Accessibility pages when set.
contact_email = "lawrence-ma@publick.org"
timezone = "America/New_York"
user_agent = "lawrence-ma.publick.org (+https://lawrence-ma.publick.org/about/)"
# English at the site's root, Spanish under /es/.
languages = ["en", "es"]

# From the city website's theme (cityoflawrence.com): its navy and its green;
# each passes WCAG AA on white. Its gold (#ffcc00) doesn't, so it isn't used.
[site.colors]
primary = "#061951"
primary_dark = "#061951"
primary_soft = "#e6e8ee"
accent = "#09846d"

[town]
name = "Lawrence"
state = "Massachusetts"
state_abbr = "MA"
official_site = "https://www.cityoflawrence.com"

# Sections appear in the main navigation in this order. Each one is a folder
# under site/pages/<slug>/ and is served at https://<domain>/<slug>/.
[[sections]]
slug = "meetings"
title = "Meetings"
summary = "Every board and committee meeting in the city's Agenda Center, with agendas, and minutes from January 2026 on."
status = "live"

[[sections]]
slug = "schools"
title = "Schools"
summary = "Graduation, attendance, and MCAS results compared with the state."
status = "live"

[[sections]]
slug = "budget"
title = "City budget"
nav = "Budget"
summary = "Where general fund money comes from and how it is spent, reserves, and the property tax limit."
status = "live"

[[sections]]
slug = "housing"
title = "Housing"
summary = "New homes permitted, home values and rents, affordable housing, and the housing stock."
status = "live"

[[sections]]
slug = "officials"
title = "Who represents you"
nav = "Officials"
summary = "The mayor, City Council, and School Committee, by office and by ward, and how to reach them."
status = "live"

[[sections]]
slug = "about"
title = "About"
summary = "Data sources, update schedule, metric definitions, and corrections."
status = "live"

# Page view counting with GoatCounter, on the network's site; prefix is this
# town's folder.
[analytics]
goatcounter = "publick"
prefix = "lawrence-ma"
public_stats = ""

# The weekly digest's email signup, on /digest/ (the engine's pipeline/digest.py). The form posts
# to this site's /digest/subscribe, which the sites Worker answers (worker/digest.js) and passes on
# to Buttondown with the tag lawrence-ma-en. The About page names who keeps the addresses.
[digest]
signup = true
provider = "Buttondown"
privacy_url = "https://buttondown.com/legal/privacy"

# Public meetings, from the city's CivicPlus calendar and Agenda Center.
[meetings]
base_url = "https://www.cityoflawrence.com"
archive_url = "https://www.cityoflawrence.com/AgendaCenter"
archive_name = "city's Agenda Center"
# The city's site resets some connections; a slower pace and the client's retries help.
request_delay = 5.0
max_event_pages = 40

# The city calendar, read month by month ([meetings.civicplus], engine v1.31 on):
# the meetings the city lists before their agendas are posted, with their
# times and places. A meeting on the calendar and in the Agenda Center is
# shown once.
[meetings.civicplus]
calendars = ["Council, Committees, Boards & Commissions"]

# Agenda Center categories renamed to the board's usual name. The City
# Council's committees each have a category of their own, named as on the
# council's Committees page; here they're named as the council's.
[meetings.aliases]
"Budget & Finance Committee" = "City Council Budget and Finance Committee"
"Committee on the Whole" = "City Council Committee of the Whole"
"Economic Development Committee" = "City Council Economic Development Committee"
"Housing Committee" = "City Council Housing Committee"
"Ordinance & Intergovernmental Relations Committee" = "City Council Ordinance and Intergovernmental Relations Committee"
"Personnel Committee" = "City Council Personnel and Administration Committee"
"Public Safety Committee" = "City Council Public Safety Committee"
"Lawrence School Committee" = "School Committee"
"Lawrence Alliance for Education [LAE]" = "Lawrence Alliance for Education"
"Lawrence Housing Authority [LHA]" = "Lawrence Housing Authority"
"Redevelopment Authority" = "Lawrence Redevelopment Authority"
"Board of Registrar" = "Board of Registrars"

[meetings.agenda_center]
base_url = "https://www.cityoflawrence.com"
# The first run lists meetings from here, and minutes are collected from here on.
since = "2026-01-01"

# Since May 2026 the Housing and Economic Development committees meet as one,
# posted under either category (sometimes both).
[meetings.agenda_center.committees."City Council Housing Committee"]
"Housing and Economic Development" = "City Council Housing and Economic Development Committee"
"Housing and Economic Dev" = "City Council Housing and Economic Development Committee"

[meetings.agenda_center.committees."City Council Economic Development Committee"]
"Housing and Economic Development" = "City Council Housing and Economic Development Committee"
"Housing and Economic Dev" = "City Council Housing and Economic Development Committee"

# The Library Trustees' agendas are sometimes posted under the School
# Committee as well as under their own category.
[meetings.agenda_center.committees."School Committee"]
"Library Board of Trustee" = "Library Trustees"

# Agenda and minutes PDFs, in the network's documents bucket.
[storage]
endpoint = "https://6bbfee5a3892553c7993dbfa4b4e8453.r2.cloudflarestorage.com"
bucket = "publick-documents"
public_url = "https://files.publick.org"
prefix = "lawrence-ma"

# Agenda previews and decisions from minutes, written by a language model and
# labeled as AI-generated on the site, and their Spanish translations (Claude
# Haiku 4.5, the engine's default). Within the network's monthly budget.
[summaries]
model = "claude-sonnet-5"
max_per_run = 40
input_price = 2.0
output_price = 10.0
max_cost_per_run = 5.0

# How residents can take part, per board, shown on its meeting pages. Only
# what the city or the school district has published; each entry names its source.
[participation."City Council"]
comment = "Residents who sign in can speak to the Council during the public participation part of its regular meetings."
source_title = "City Council minutes of February 3, 2026"
source_url = "https://www.cityoflawrence.com/AgendaCenter/ViewFile/Minutes/_02032026-1701"
video_title = "the City Council's YouTube channel"
video_url = "https://www.youtube.com/user/LawrenceCityCouncil/videos"

[participation."School Committee"]
video_title = "Lawrence Public Schools' YouTube channel"
video_url = "https://www.youtube.com/@LawrencePublicSchools"

# Terms that come up on agendas and minutes, explained on each meeting page
# where they appear. Acronyms match exactly; other terms ignore case.
[[glossary]]
term = "executive session"
definition = "A part of a public meeting closed to the public. State law allows it only for specific reasons, such as lawsuits, negotiations, or personnel matters."

[[glossary]]
term = "M.G.L."
definition = "Massachusetts General Laws, the state's laws."

[[glossary]]
term = "Committee of the Whole"
definition = "The full City Council meeting as a committee, to discuss a matter before voting on it at a regular meeting."

[[glossary]]
term = "CBA"
definition = "Collective bargaining agreement: a contract between the city and a union of its employees, setting pay and working conditions."

[[glossary]]
term = "COLA"
definition = "Cost-of-living adjustment: a raise in pay or a pension to keep up with rising prices."

# School district figures from the state's education data portal (DESE).
[schools]
district_code = "01490000"
district_name = "Lawrence Public Schools"
portal = "https://educationtocareer.data.mass.gov"

# Tax bill and budget figures (Mass. Division of Local Services).
[finance]
dls_municipality = "Lawrence"
dls_code = "149"

# Housing: Census building permits and the American Community Survey, and the
# state's Subsidized Housing Inventory.
[housing]
bps_region = "Northeast Region"
bps_prefix = "ne"
bps_state = "25"
bps_place = "34550"
census_geo = "16000US2534550"
state_geo = "04000US25"
shi_url = "https://www.mass.gov/doc/subsidized-housing-inventory-2/download"
shi_name = "Lawrence"

# Unemployment rate (BLS Local Area Unemployment Statistics, area CT2534550000000).
[labor]
local_series = "LAUCT253455000000003"
state_series = "LAUST250000000000003"

[freshness]
summary_grace_days = 2
sources = [
  { label = "Meetings (Agenda Center)", file = "meetings/status.json", max_days = 2 },
]

# Who represents you (the Officials page). Kept by hand from official city
# and school websites; checked is the date the list was last checked against
# them. Only city- and school-issued email addresses, and the mayor's office
# phone. The ward file is data/static/lawrence-precincts-2022.geojson
# (MassGIS): Lawrence's wards are lettered A to F, and the council's six
# districts are the six wards.
# The About page's "What this site doesn't cover": why there's no 311 section.
[absences]
311 = "The city takes concerns through a form on its own website, which has no public data."

[officials]
checked = "2026-10-01"
wards_file = "lawrence-precincts-2022.geojson"

