# The town's own text in Spanish, keyed by its English as written above or as
# the data writes it (board names, 311 categories). Plain Spanish, addressed as
# usted, following the engine's site/strings/es-guide.md and Lawrence's and
# Manchester's tables where the English is the same. A board's name is given in
# Spanish only; the site shows its English name after it. Not checked by a
# person: the site says it's translated with AI.
[strings.es]
# The masthead and the share text.
"Public data on how Burlington, Vermont decides and spends. Updated daily." = "Datos públicos sobre cómo Burlington, Vermont, toma decisiones y gasta su dinero. Se actualizan a diario."
"An independent guide to city government in Burlington, Vermont" = "Una guía independiente sobre el gobierno de la ciudad de Burlington, Vermont"

# Section summaries (the engine translates the section names every town shares).
"When the City Council, its committees, and the city's boards and commissions meet, with agendas, and minutes from April 2026 on." = "Cuándo se reúnen el Concejo Municipal, sus comités y las juntas y comisiones de la ciudad, con sus agendas, y las actas desde abril de 2026."
"How fast the city responds to SeeClickFix requests, by category and ward." = "Qué tan rápido responde la ciudad a las solicitudes de SeeClickFix, por categoría y por distrito."
"The city's tax rates, what the property tax raises for the city and for schools, and the average homestead tax bill." = "Las tasas de impuestos de la ciudad, lo que recauda el impuesto a la propiedad para la ciudad y para las escuelas, y la factura promedio del impuesto a la propiedad de una vivienda principal (homestead)."
"Burlington School District's graduation rate, attendance, state test results, and spending per pupil, with the state's." = "La tasa de graduación del Distrito Escolar de Burlington, la asistencia, los resultados de los exámenes estatales y el gasto por estudiante, comparados con los del estado."
"The mayor, the City Council, and the School Board, by ward and district, and how to reach them." = "La alcaldesa, el Concejo Municipal y la Junta Escolar, por distrito electoral (ward) y por distrito, y cómo comunicarse con ellos."

# Where the city posts agendas and minutes, and the data the site keeps up to date.
"city's CivicClerk portal" = "portal CivicClerk de la ciudad"
"Meetings (CivicClerk)" = "Reuniones (CivicClerk)"
"311 requests" = "Solicitudes al 311"

# 311.
"The city's own request types, such as potholes, sidewalks, trash and illegal dumping, graffiti, parks, parking, and water. Burlington Electric's and the airport's requests aren't included." = "Los tipos de solicitud de la propia ciudad, como baches, aceras, basura y vertidos ilegales, grafiti, parques, estacionamiento y agua. No se incluyen las solicitudes de Burlington Electric ni del aeropuerto."

# How to take part.
"Residents can speak during Public Forum at the Council's regular meetings: sign up in person at the meeting, or online to speak on Zoom. Online sign-up closes one hour before Public Forum begins." = "Los residentes pueden hablar durante el Foro Público (Public Forum) en las reuniones regulares del Concejo: inscríbase en persona en la reunión, o en línea para hablar por Zoom. La inscripción en línea cierra una hora antes de que empiece el Foro Público."
"City Council agenda of September 14, 2026" = "Agenda del Concejo Municipal del 14 de septiembre de 2026"
"CCTV's City Council playlist on YouTube" = "la lista de reproducción del Concejo Municipal de CCTV en YouTube"

# Glossary definitions (the terms themselves stay as the agendas write them).
"A part of a public meeting closed to the public. Vermont's Open Meeting Law allows it only for specific reasons, such as lawsuits, contracts, or personnel matters, and no final decision may be made in it." = "Una parte de una reunión pública que se hace a puerta cerrada. La ley de reuniones abiertas de Vermont la permite solo por razones específicas, como demandas, contratos o asuntos de personal, y en ella no se puede tomar ninguna decisión final."
"Vermont Statutes Annotated, the state's laws (also written V.S.A.)." = "Estatutos Anotados de Vermont (Vermont Statutes Annotated), las leyes del estado (también se escribe V.S.A.)."
"Routine items, such as accepting reports and placing letters on file, voted on together in one motion unless a member asks to take one up separately." = "Asuntos de rutina, como aceptar informes y archivar cartas, que se votan juntos en una sola moción, a menos que un miembro pida tratar alguno por separado."
"The part of a City Council agenda with the items the Council discusses and votes on one at a time." = "La parte de la agenda del Concejo Municipal con los asuntos que el Concejo discute y vota uno por uno."
"The time at a City Council meeting when residents can speak to the Council about any city matter." = "El momento de una reunión del Concejo Municipal en que los residentes pueden hablarle al Concejo sobre cualquier asunto de la ciudad."
"The mayor, the City Council President, and three councilors, with the Chief Administrative Officer as a non-voting member. It reviews the city's spending and other money matters before the City Council votes on them." = "La alcaldesa, el presidente del Concejo Municipal y tres concejales, con el Director Administrativo (Chief Administrative Officer) como miembro sin voto. Revisa los gastos de la ciudad y otros asuntos de dinero antes de que el Concejo Municipal los vote."
"The City Council meeting with the mayor in the chair, where the Council appoints members of the city's boards and commissions." = "La reunión del Concejo Municipal presidida por la alcaldesa, en la que el Concejo nombra a los miembros de las juntas y comisiones de la ciudad."
"The Community & Economic Development Office, the city department for housing, neighborhoods, and economic development." = "La Oficina de Desarrollo Comunitario y Económico (Community & Economic Development Office), el departamento de la ciudad para la vivienda, los vecindarios y el desarrollo económico."
"The Chief Administrative Officer, who leads the Clerk/Treasurer's Office: the city's finances, elections, and public records." = "El Director Administrativo (Chief Administrative Officer), que dirige la Oficina del Secretario y Tesorero (Clerk/Treasurer's Office): las finanzas, las elecciones y los registros públicos de la ciudad."
"Tax increment financing: paying for public improvements in a district, such as Burlington's Downtown and Waterfront TIF districts, with the extra property tax its new development brings in." = "Financiamiento por incremento de impuestos (tax increment financing): pagar mejoras públicas en un distrito, como los distritos TIF del centro y de la costa del lago de Burlington, con el impuesto a la propiedad adicional que trae su nuevo desarrollo."
"The first Tuesday in March, when Vermont towns and cities vote. Burlington elects its councilors and school commissioners then and votes on the school budget, bonds, and charter changes." = "El primer martes de marzo, cuando votan los pueblos y ciudades de Vermont. Ese día Burlington elige a sus concejales y comisionados escolares y vota el presupuesto escolar, los bonos y los cambios a la carta orgánica."
"Neighborhood Planning Assembly: a meeting, by ward, open to every resident, where neighbors hear from the city and make recommendations to it." = "Asamblea de Planificación Vecinal (Neighborhood Planning Assembly): una reunión, por distrito electoral, abierta a todos los residentes, donde los vecinos escuchan a la ciudad y le hacen recomendaciones."
"The total listed value of the city's taxable property. Property tax rates are applied to it." = "El valor total registrado de las propiedades sujetas a impuestos de la ciudad. A ese valor se le aplican las tasas del impuesto a la propiedad."

# Officials: notes, seats, and roles.
"Elected citywide for three years. The mayor presides over the City Council With Mayor Presiding and sits on the Board of Finance." = "Elegida por toda la ciudad por tres años. La alcaldesa preside el Concejo Municipal con la Alcaldía en la Presidencia y forma parte de la Junta de Finanzas."
"Twelve councilors: eight elected by ward and four by district (two wards each), for two years." = "Doce concejales: ocho elegidos por distrito electoral (ward) y cuatro por distrito (de dos wards cada uno), por dos años."
"City Council President" = "Presidente del Concejo Municipal"
"East District" = "Distrito Este"
"Central District" = "Distrito Central"
"South District" = "Distrito Sur"
"North District" = "Distrito Norte"
"School Board" = "Junta Escolar"
"Twelve school commissioners: eight elected by ward and four by district (two wards each), for two years. Its meetings aren't listed on this site yet: the board posts them on Diligent, which the site can't read." = "Doce comisionados escolares: ocho elegidos por distrito electoral (ward) y cuatro por distrito (de dos wards cada uno), por dos años. Sus reuniones todavía no aparecen en este sitio: la junta las publica en Diligent, que el sitio no puede leer."

