  "Planning Commission Long Range Planning Committee",
  "Planning Commission Ordinance Committee",
  "Collaborative Working Group on Inclusionary Zoning",
  "Design Advisory Board",
  "Conservation Board",
  "Conservation Board Open Space Subcommittee",
  "Housing Board of Review",
  "Airport Commission",
  "Burlington Electric Commission",
  "Church Street Marketplace Commission",
  "Church Street Marketplace Cart Vendor Committee",
  "Fire Commission",
  "Police Commission",
