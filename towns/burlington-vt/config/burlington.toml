# Site configuration for Burlington, Vermont. Everything town-specific lives
# here; the code is the Publick engine (github.com/publick-org/publick-engine).
# Build with: python -m pipeline.build_site (with the engine on PYTHONPATH)
#
# The network's first Vermont town. Burlington's website runs on CivicPlus,
# but its Agenda Center is empty: every city body posts its meetings, agendas,
# and minutes on the city's CivicClerk portal, read as [meetings.civicclerk],
# as Manchester's aldermen are. The minutes are text PDFs. The Burlington
# School Board posts on Diligent Community (bsdvt.community.highbond.com),
# which the engine can't read yet, so the school board's meetings are left out
# for now; the district's figures still come from the state ([schools]). The
# city answers requests on SeeClickFix ([seeclickfix]). The engine's Vermont
# package gives the tax rates, what the property tax raises, and the average
# homestead tax bill, from the Department of Taxes ([finance]), and school
# figures, from the Agency of Education; housing and unemployment come from
# the Census and BLS, as for every town.
#
# Like every Publick town's, the site is in English and Spanish ([site]
# languages). Burlington's largest groups of residents who read another
# language first read Nepali, Somali, Swahili, Arabic, Kirundi, and others
# (the city's Election Language Support page lists several); the engine
# translates only into Spanish for now. [strings.es], at the end, gives the
# Spanish for the town's own text; the engine has the rest.

[site]
name = "Burlington Publick"
# The masthead shows name_prefix in dark ink and name_suffix in the accent
# color: the town, then the network.
name_prefix = "Burlington "
name_suffix = "Publick"
domain = "burlington-vt.publick.org"
# The network of town sites this one belongs to, named in every page footer.
network = "Publick"
network_url = "https://publick.org"
tagline = "Public data on how Burlington, Vermont decides and spends. Updated daily."
# One line under the name at the top of every page.
masthead = "An independent guide to city government in Burlington, Vermont"
repo_url = "https://github.com/publick-org/publick.org"
# Public contact address. Shown on the About and Accessibility pages when set.
contact_email = "burlington-vt@publick.org"
timezone = "America/New_York"
user_agent = "burlington-vt.publick.org (+https://burlington-vt.publick.org/about/)"
# English at the site's root, Spanish under /es/.
languages = ["en", "es"]

# From the city website's stylesheet (burlingtonvt.gov): its blue (links and
# buttons, 7.5:1 on white), its darker navy (headers, 9.2:1), a light tint of
# the blue, and its green (4.6:1). Its bright blue (#0098f7, 3.1:1) and orange
# (#f79433, 2.3:1) don't pass WCAG AA on white, so they aren't used.
[site.colors]
primary = "#00569b"
primary_dark = "#004983"
primary_soft = "#e6eef5"
accent = "#3b842e"

[town]
name = "Burlington"
state = "Vermont"
state_abbr = "VT"
official_site = "https://www.burlingtonvt.gov"

# Sections appear in the main navigation in this order. Each one is a folder
# under site/pages/<slug>/ and is served at https://<domain>/<slug>/.
[[sections]]
slug = "meetings"
title = "Meetings"
summary = "When the City Council, its committees, and the city's boards and commissions meet, with agendas, and minutes from April 2026 on."
status = "live"

[[sections]]
slug = "311"
title = "311 Requests"
nav = "311"
summary = "How fast the city responds to SeeClickFix requests, by category and ward."
status = "live"

[[sections]]
slug = "budget"
title = "City budget"
nav = "Budget"
summary = "The city's tax rates, what the property tax raises for the city and for schools, and the average homestead tax bill."
status = "live"

[[sections]]
slug = "schools"
title = "Schools"
summary = "Burlington School District's graduation rate, attendance, state test results, and spending per pupil, with the state's."
status = "live"

[[sections]]
slug = "housing"
title = "Housing"
summary = "New homes permitted, home values and rents, and the housing stock."
status = "live"

[[sections]]
slug = "officials"
title = "Who represents you"
nav = "Officials"
summary = "The mayor, the City Council, and the School Board, by ward and district, and how to reach them."
status = "live"

[[sections]]
slug = "about"
title = "About"
summary = "Data sources, update schedule, metric definitions, and corrections."
status = "live"

# Page view counting with GoatCounter, on the network's site; prefix is this
# town's folder.
[analytics]
goatcounter = "publick"
prefix = "burlington-vt"
public_stats = ""

# The weekly digest's email signup, on /digest/ (the engine's pipeline/digest.py). The form posts
# to this site's /digest/subscribe, which the sites Worker answers (worker/digest.js) and passes on
# to Buttondown with the tag burlington-vt-en. The About page names who keeps the addresses.
[digest]
signup = true
provider = "Buttondown"
privacy_url = "https://buttondown.com/legal/privacy"

# Public meetings, from the city's CivicClerk portal: the City Council, the
# City Council with the Mayor presiding, the Board of Finance, the council's
# committees, and the city's boards and commissions. The city calendar
# (burlingtonvt.gov/calendar.aspx) repeats the portal's meetings, so it isn't
# read. The Neighborhood Planning Assemblies (resident assemblies, by
# ward) are on the portal too; they're left out (exclude_pattern below), to
# keep the summaries within the network's budget.
[meetings]
calendar_url = "https://burlingtonvt.portal.civicclerk.com"
archive_url = "https://burlingtonvt.portal.civicclerk.com"
archive_name = "city's CivicClerk portal"
governing_body = "City Council"
# The home page always shows these in full, with the governing body.
main_boards = ["City Council With Mayor Presiding", "Board of Finance"]
request_delay = 3.0
