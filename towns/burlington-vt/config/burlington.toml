# it contains ("City Council - Ordinance Committee Meeting", "Special Meeting of
# the Burlington City Council With Mayor Presiding"), ignoring case,
# punctuation, and "&" versus "and". The council's committees are named as the
# council's, as on its Standing Committees page.
