[meetings.civicclerk]
api_url = "https://burlingtonvt.api.civicclerk.com/v1"
portal_url = "https://burlingtonvt.portal.civicclerk.com"
# Meetings, agendas, and minutes are collected from here on: the current City
# Council took office at its organization meeting on April 6, 2026, after the
# Town Meeting Day election of March 3. Earlier minutes are text too; they're
# left out so the record starts with the council the Officials page lists.
since = "2026-04-01"
# Left out: the Neighborhood Planning Assemblies ("Ward 3 NPA Meeting", "Wards
# 4&7 NPA Meeting", "All Wards NPA Meeting"); the portal's placeholder and test
# entries ("Dashboard Organizational Agenda -- PLANNING ONLY" in 2075, "TEST
# ROUTING ITEMS"); and notices of public hearings posted as entries of their
# own ("PUBLIC HEARING NOTICE: ...", "Public Hearing: ..."), which are held at
# the City Council's or Planning Commission's meeting of the same evening, where
# they're listed. Also the planning and public works departments' public
# information and community meetings on projects ("planBTV New North End
# Community Meeting"), which aren't meetings of a city body.
exclude_pattern = '\bNPAs?\b|\bPLANNING ONLY\b|\bTEST ROUTING\b|^public hearing\b|\b(community|public information) meeting\b|^one time event$'

# Agenda and minutes PDFs, in the network's documents bucket.
[storage]
endpoint = "https://6bbfee5a3892553c7993dbfa4b4e8453.r2.cloudflarestorage.com"
bucket = "publick-documents"
public_url = "https://files.publick.org"
prefix = "burlington-vt"

# Agenda previews and decisions from minutes, written by a language model and
# labeled as AI-generated on the site, and their Spanish translations. Within
# the network's monthly budget. Only meetings from `since` on are summarized:
# older ones keep their records and documents.
[summaries]
model = "claude-sonnet-5"
max_per_run = 40
input_price = 2.0
output_price = 10.0
max_cost_per_run = 5.0
since = "2026-07-01"

# How residents can take part, per board, shown on its meeting pages. Only
# what the city has published; each entry names its source.
[participation."City Council"]
comment = "Residents can speak during Public Forum at the Council's regular meetings: sign up in person at the meeting, or online to speak on Zoom. Online sign-up closes one hour before Public Forum begins."
source_title = "City Council agenda of September 14, 2026"
source_url = "https://burlingtonvt.portal.civicclerk.com/event/10090/files"
video_title = "CCTV's City Council playlist on YouTube"
video_url = "https://www.youtube.com/playlist?list=PLljLFn4BZd2PwCge7lNoKug676jIf_iUA"

# Terms that come up on agendas and minutes, explained on each meeting page
# where they appear. Acronyms match exactly; other terms ignore case.
[[glossary]]
term = "executive session"
definition = "A part of a public meeting closed to the public. Vermont's Open Meeting Law allows it only for specific reasons, such as lawsuits, contracts, or personnel matters, and no final decision may be made in it."

[[glossary]]
term = "VSA"
definition = "Vermont Statutes Annotated, the state's laws (also written V.S.A.)."

[[glossary]]
term = "consent agenda"
definition = "Routine items, such as accepting reports and placing letters on file, voted on together in one motion unless a member asks to take one up separately."

[[glossary]]
term = "deliberative agenda"
definition = "The part of a City Council agenda with the items the Council discusses and votes on one at a time."

[[glossary]]
term = "Public Forum"
definition = "The time at a City Council meeting when residents can speak to the Council about any city matter."

[[glossary]]
term = "Board of Finance"
definition = "The mayor, the City Council President, and three councilors, with the Chief Administrative Officer as a non-voting member. It reviews the city's spending and other money matters before the City Council votes on them."

[[glossary]]
term = "City Council With Mayor Presiding"
definition = "The City Council meeting with the mayor in the chair, where the Council appoints members of the city's boards and commissions."

[[glossary]]
term = "CEDO"
definition = "The Community & Economic Development Office, the city department for housing, neighborhoods, and economic development."

[[glossary]]
term = "CAO"
definition = "The Chief Administrative Officer, who leads the Clerk/Treasurer's Office: the city's finances, elections, and public records."

[[glossary]]
term = "TIF"
definition = "Tax increment financing: paying for public improvements in a district, such as Burlington's Downtown and Waterfront TIF districts, with the extra property tax its new development brings in."

[[glossary]]
term = "Town Meeting Day"
definition = "The first Tuesday in March, when Vermont towns and cities vote. Burlington elects its councilors and school commissioners then and votes on the school budget, bonds, and charter changes."

[[glossary]]
term = "NPA"
definition = "Neighborhood Planning Assembly: a meeting, by ward, open to every resident, where neighbors hear from the city and make recommendations to it."

[[glossary]]
term = "grand list"
definition = "The total listed value of the city's taxable property. Property tax rates are applied to it."

# Tax rates, property tax, and the average homestead tax bill
# (pipeline/states/vt/), from the Vermont Department of Taxes' Property
# Valuation and Review (PVR) figures, where the city is "Burlington" (town
# code 4114), and VCGI's statewide parcel data, where its name is the same.
# The city's own budgets, year by year, are on its Finance & Budgets page.
[finance]
pvr_town = "Burlington"
budget_documents_url = "https://www.burlingtonvt.gov/197/Finance-Budgets"

# School figures from the Vermont Agency of Education: the district is SU015
# (Burlington School District) on the Education Dashboard, and T037 in the
# per pupil spending report.
[schools]
aoe_org = "SU015"
aoe_lea = "T037"
district_name = "Burlington School District"

# Housing: Census building permits (Burlington is Census place 10675, which
# reports to the Census every month) and the American Community Survey,
# through Census Reporter.
[housing]
bps_region = "Northeast Region"
bps_prefix = "ne"
bps_state = "50"
bps_place = "10675"
census_geo = "16000US5010675"
state_geo = "04000US50"

# 311 requests, from SeeClickFix (public requests only). Burlington's
# organization (297) also takes requests for Burlington Electric, the airport,
# and the city's COVID-19 relief requests of 2020; departments keeps the city's
# own request types ("Burlington, VT": Public Works, Parks, parking, water, and
# more).
[seeclickfix]
organization_id = 297
open311_base = "https://seeclickfix.com/open311/v2"
api_base = "https://seeclickfix.com/api/v2"
departments = ["Burlington, VT"]
scope_note = "The city's own request types, such as potholes, sidewalks, trash and illegal dumping, graffiti, parks, parking, and water. Burlington Electric's and the airport's requests aren't included."
report_url = "https://seeclickfix.com/burlington_2"
# SeeClickFix documents a limit of 20 requests per minute.
request_delay = 3.2
recent_days = 21
max_details_per_run = 700
time_budget_seconds = 2400
# The month the full history starts (python -m pipeline.fetch_311 --backfill).
# Older requests are included only while they are still open.
history_since = "2026-01"
# The eight wards in effect since March 2024 (the 2022 redistricting), from the
# city's GIS, with each ward's council district and 2020 census population (see
# data/README.md).
precincts_file = "burlington-wards-2024.geojson"
wards_publisher = "City of Burlington"
wards_year = 2024
wards_url = "https://maps.burlingtonvt.gov/arcgis/rest/services/City_Wards_2024/MapServer/0"

# Repeat locations: requests in the same category within radius_m meters and
# window_days days of each other are grouped as one place.
[seeclickfix.repeats]
radius_m = 50
window_days = 60
recent_open_days = 30

# Unemployment rate (BLS Local Area Unemployment Statistics, area
# CT5010675000000, Burlington city). City rates are not seasonally adjusted;
# the state series is shown for context. bulk_file is the state's file under
# download.bls.gov/pub/time.series/la/, used when the API refuses.
[labor]
local_series = "LAUCT501067500000003"
state_series = "LAUST500000000000003"
bulk_file = "la.data.53.Vermont"

# How often each data source should update. The daily run fails (and GitHub
# emails the owner) when one goes longer than max_days, and the About page
# lists them. Figures published monthly or yearly are judged by the engine.
[freshness]
summary_grace_days = 2
sources = [
  { label = "Meetings (CivicClerk)", file = "meetings/status.json", max_days = 2 },
  { label = "311 requests", file = "311/status.json", max_days = 2 },
  { label = "311 scorecard", file = "311/scorecard.json", field = "generated_at", max_days = 2 },
]

# Who represents you (the Officials page). Kept by hand from the city's and
# the school district's websites; checked is the date the list was last checked
# against them. Only city- and school-issued email addresses, and the mayor's
# office phone. A member with a ward is elected by that ward; a district
# councilor or school commissioner is elected by the two wards of the district
# (charter, 24 App. V.S.A. ch. 3, § 2: East is Wards 1 and 8, Central 2 and 3,
# South 5 and 6, North 4 and 7). Councilors' terms begin on the first Monday in
# April after the March election (§ 125), and school commissioners' at the
# board's organizational meeting in early April; the year each ends is from the
# city's council roster and Board of Finance page, and the school district's
# members page.
[officials]
checked = "2026-10-06"

