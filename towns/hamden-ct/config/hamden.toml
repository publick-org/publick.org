# Engineering, Dev & Municipal Planning Committee - Sept 28", "Legislative
# Council Special Meeting - Finance Committee"). The Audit Committee is the
# Council's: its members are councilors (its minutes of October 8, 2026).
# "LC" alone is the Council.
"Administration and Settlement Committee" = "Legislative Council Administration and Settlement Committee"
"Admin & Settlement" = "Legislative Council Administration and Settlement Committee"
"Audit Committee" = "Legislative Council Audit Committee"
