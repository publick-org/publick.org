# Site configuration for Hamden, Connecticut. Everything town-specific lives
# here; the code is the Publick engine
# (github.com/publick-org/publick-engine).
#
# Hamden has a mayor and a fifteen-member Legislative Council. Its boards post
# their meetings, agendas, and minutes on the town's CivicClerk portal
# (hamdenct.portal.civicclerk.com), read as [meetings.civicclerk], as
# Portland's and Burlington's are: the Legislative Council and its committees,
# and the town's boards and commissions. The minutes read so far are text
# PDFs. The town website (CivicPlus) shows the same meetings on its "Boards &
# Commissions" calendar, which the portal feeds, so the calendar isn't read.
# The Board of Education's regular meetings are on the portal too, with no
# documents; the board posts its agendas, minutes, and committee meetings on
# the school district's website, which the engine doesn't read yet (see
# [meetings.civicclerk]). The town answers requests on SeeClickFix
# ([seeclickfix]). The engine's Connecticut package gives the budget, mill
# rate, and tax bill, from the state's Office of Policy and Management
# ([finance]), and school figures, from EdSight ([schools]); housing and
# unemployment come from the Census and BLS, as for every town.
#
# The site is in English and Spanish ([site] languages), as every town's is.
# The first runs draft the Spanish for the town's own text; [strings.es], at
# the end, can correct it.

[site]
name = "Hamden Publick"
# The masthead shows name_prefix in dark ink and name_suffix in the accent
# color: the town, then the network.
name_prefix = "Hamden "
domain = "hamden-ct.publick.org"
tagline = "Public data on how Hamden, Connecticut responds, decides, and spends. Updated daily."
# One line under the name at the top of every page.
masthead = "An independent guide to town government in Hamden, Connecticut"
# Public contact address. Shown on the About and Accessibility pages when set.
contact_email = "hamden-ct@publick.org"
user_agent = "hamden-ct.publick.org (+https://hamden-ct.publick.org/about/)"

# From the town website's stylesheet (www.hamden.com): its navy, the most used
# color (134 uses), and a darker shade of it; its green, the most used of
# another hue (55 uses); primary_soft a light tint of the navy. Each passes
# WCAG AA on white (8.4, 15.0, 6.6 to 1).
[site.colors]
primary = "#3f4c74"
primary_dark = "#1f263a"
primary_soft = "#ecedf1"
accent = "#50642f"

[town]
name = "Hamden"
# The Officials page calls the Legislative Council's districts "District 1"
# to "District 9", as the town does.
areas = "districts"
state_abbr = "CT"
official_site = "https://www.hamden.com"

# Sections appear in the main navigation in this order. Each one is a folder
# under site/pages/<slug>/ and is served at https://<domain>/<slug>/.
[[sections]]
slug = "meetings"
title = "Meetings"
summary = "When the Legislative Council, its committees, and the town's boards and commissions meet, with agendas, and minutes from January 2026 on."
status = "live"

[[sections]]
slug = "311"
title = "311 Requests"
nav = "311"
summary = "How fast the town responds to service requests on SeeClickFix, by category."
status = "live"

[[sections]]
slug = "budget"
title = "Town budget"
nav = "Budget"
summary = "The town's adopted budget, its mill rate and what the property tax raises, and the average single-family tax bill."
status = "live"

[[sections]]
slug = "schools"
title = "Schools"
summary = "Hamden Public Schools' graduation rate, attendance, state test results, and spending per pupil, with the state's."
status = "live"

[[sections]]
slug = "housing"
title = "Housing"
summary = "New homes permitted, home values and rents, and the housing stock."
status = "live"

[[sections]]
slug = "officials"
title = "Who represents you"
nav = "Officials"
summary = "The mayor, the Legislative Council, and the Board of Education, by district, and how to reach them."
status = "live"

[[sections]]
slug = "about"
title = "About"
summary = "Data sources, update schedule, metric definitions, and corrections."
status = "live"

# Page view counting with GoatCounter, on the network's site; prefix is this
# town's folder.
[analytics]
prefix = "hamden-ct"

# Public meetings, from the town's CivicClerk portal. The portal files each
# meeting under a category, but the engine reads a meeting's board from its
# title ("LC Finance Committee Regular Meeting - Aug 10, 2026", "Fire
# Commission Special Meeting - 5/6/2026"), matched to the longest of these it
# contains, ignoring case, punctuation, and "&" versus "and". The Legislative
# Council's standing committees, as on its Committee Referral List and its
# minutes, are named as the Council's, so they're listed with it.
[meetings]
calendar_url = "https://hamdenct.portal.civicclerk.com"
archive_url = "https://hamdenct.portal.civicclerk.com"
archive_name = "town's CivicClerk portal"
governing_body = "Legislative Council"
# The town's site resets some connections; a slower pace and the client's
# retries help.
request_delay = 3.0
boards = [
