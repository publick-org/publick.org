[meetings.civicclerk]
api_url = "https://hamdenct.api.civicclerk.com/v1"
portal_url = "https://hamdenct.portal.civicclerk.com"
# Meetings, agendas, and minutes are collected from here on. The Council
# elected on November 4, 2025 took office on November 30, 2025.
since = "2026-01-01"
# Some of the portal's meetings are under its catch-all General category, and
# some are named for an item, not a board: those go under the board their
# category names.
board_from_category = true
# Left out: the regional bodies the portal also lists (the Regional Water
# Authority and its committees, the South Central Regional Council of
# Governments, the Greater New Haven Transit District and Water Pollution
# Control Authority), which aren't the town's; the Mayor's staff meetings
# ("Leadership Meeting", "Mayor's On Hold/Pending") and a staff training;
# entries that hold documents, not a meeting ("26/27 Budget Documentation",
# "Tentative Items and Backup March Legislative Council"); and entries
# marked "NOT HELD", "Cancelation Notice" or "CANCELLATION", meetings that
# didn't take place, which the engine doesn't read as cancelled.
exclude_pattern = '\b(?:Regional Water|SCRCOG|Greater New Haven|Leadership (?:Meeting|Agenda)|Mayor.s On Hold|Staff Training|Budget Documentation|Tentative Items|Cancell?ation)\b|\bnot held'

# The Board of Education's regular meetings are on the portal ("Board of
# Education", 7:00 PM on the second Tuesday), with no agenda or minutes. The
# board posts its agendas, minutes, and recordings, and its committees'
# meetings, on Hamden Public Schools' BOE Meeting Agendas/Minutes page
# (https://www.hamden.org/boe-meeting-agendas-minutes, ParentSquare
# SmartSites), a table with a row a meeting. The engine's reader for such a
# page ([page_meetings]) finds a meeting's date written out or as 2026-10-13;
# this page writes it as 10/13/26, so it isn't read yet. The board's calendar
# page (/board-of-education-calendar) lists no events.

# Agenda and minutes PDFs live in the network's documents bucket, not in git
# (see pipeline/documents.py). Keys: STORAGE_ACCESS_KEY_ID,
# STORAGE_SECRET_ACCESS_KEY.
[storage]
prefix = "hamden-ct"

# Plain-English agenda text and previews, and decisions from minutes, written
# by a language model and labeled as AI-generated on the site. Only meetings
# from `since` on are summarized, about three months before launch, so the
# town's history doesn't take the month's budget.
[summaries]
since = "2026-08-01"

# How residents can take part, per board, shown on its meeting pages. Only
# what the town or the school district has published; each entry names its
# source. The Legislative Council's from the notice at the top of each of its
# agendas (agenda of September 14, 2026), which the Council's page
# (https://www.hamden.com/353/Legislative-Council) repeats. Its meetings'
# recordings are linked from each meeting on the portal.
[participation."Legislative Council"]
comment = "Anyone can speak in the public input session of the Council's meetings, in person at Memorial Town Hall or on Zoom, for up to three minutes, by raising a hand when the session opens. Written comments can be emailed to LCpublicinput@hamden.com by 3:00 p.m. on the day of the meeting."
source_title = "Legislative Council agenda of September 14, 2026"
source_url = "https://hamdenct.portal.civicclerk.com/event/8536/files"
video_title = "the town's CivicClerk portal"
video_url = "https://hamdenct.portal.civicclerk.com/?category_id=26"

# The Board of Education's from the public comment notice on each of its
# agendas (agenda of October 13, 2026); recordings are linked from the
# district's BOE Meeting Agendas/Minutes page.
[participation."Board of Education"]
comment = "Time is set aside at the start of each meeting for public comment, up to three minutes each. Written comments can be emailed to PublicInput@hamden.org by 1:00 p.m. on the day of the meeting, with the meeting's name and date in the subject, and the writer's name and Hamden address in the message."
source_title = "Board of Education agenda of October 13, 2026"
source_url = "https://files.smartsites.parentsquare.com/13638/boeagenda_oct132026_rev.pdf"
video_title = "Hamden Public Schools' BOE Meeting Agendas/Minutes page"
video_url = "https://www.hamden.org/boe-meeting-agendas-minutes"

# Terms that come up on agendas and minutes, explained on each meeting page
# where they appear. An entry with bodies is shown only on those boards'
# meetings. The Submission Calendar from the Council's page ("documents for
# upcoming discussions/public hearings") and its minutes (September 14, 2026:
# "Acceptance of Items Sent to Council for Submission Calendar"); overflow
# meetings from the Council's page ("a fourth Monday scheduled for any items
# recessed or not heard during the first and third Monday").
[[glossary]]
term = "Submission Calendar"
bodies = ["Legislative Council"]
definition = "The items sent to the Legislative Council for it to take up, with their documents. The Council accepts them at a meeting before it discusses them or holds a public hearing on them."

[[glossary]]
term = "overflow meeting"
bodies = [
  "Legislative Council",
  "Legislative Council Administration and Settlement Committee",
  "Legislative Council Engineering, Development and Municipal Planning Committee",
  "Legislative Council Finance Committee",
  "Legislative Council Human Services Committee",
  "Legislative Council IT and Civic Engagement Committee",
  "Legislative Council Public Safety Committee",
  "Legislative Council Public Works, Facilities and Sustainability Committee",
]
definition = "A Legislative Council or committee meeting on a fourth Monday, for items recessed or not heard at the meetings of the first and third Mondays."

# Budget, mill rate, and property tax (pipeline/states/ct/), from the Office
# of Policy and Management's statewide datasets on data.ct.gov. The average
# single-family bill is calculated from the state's yearly Parcel and CAMA
# file, where Hamden codes its single-family homes 1010 ("Single Fam M01",
# 13,428 parcels in the 2026 file). The town's own budget books are in the
# Budget Documents section of its Archive Center.
[finance]
opm_town = "Hamden"
opm_code = 62
single_family_use = ["1010"]
budget_documents_url = "https://www.hamden.com/Archive.aspx?AMID=38"

# School district figures from EdSight, the State Department of Education's
# data portal, where the district is "Hamden School District" (district code
# 0620011, as in the Department's directory of schools on data.ct.gov). The
# district calls itself Hamden Public Schools.
[schools]
edsight_district = "Hamden School District"
district_name = "Hamden Public Schools"

# Housing: Census building permits and the American Community Survey.
# Hamden isn't a Census place, so permits find it by its town (MCD) code.
# Connecticut's planning regions replaced its counties in 2022, so the town's
# Census code is 0917035650.
[housing]
bps_mcd = "35650"
census_geo = "06000US0917035650"

# Unemployment rate (BLS Local Area Unemployment Statistics, area
# CS0935650000000, Hamden town, CT). Town rates are not seasonally adjusted;
# the state series is shown for context.
[labor]
local_series = "LAUCS093565000000003"

# 311 requests, from SeeClickFix (public requests only). The town's
# organization is 77 ("Hamden, CT", the agency its requests are assigned to);
# its Open311 services (seeclickfix.com/open311/v2/77/services.json) are 36
# request types, all the town's (Public Works, Planning & Zoning,
# Engineering, Traffic, Recycling & Solid Waste, the Mayor's Office), so no
# departments are needed. The town's website links its report page. About
# five requests a day in 2026. The town's council districts aren't published
# as map data, so there's no precincts_file: the pages show requests by
# category, with no areas.
[seeclickfix]
organization_id = 77
report_url = "https://seeclickfix.com/us-ct-hamden/report"
# The month the full history starts (python -m pipeline.fetch_311 --backfill).
history_since = "2026-01"

# How often each data source should update. The daily run fails when one goes
# longer than max_days, and the About page lists them. Figures published
# monthly or yearly are judged by the engine, by the period they cover
# (pipeline/rhythms.py).
[freshness]
sources = [
  { label = "Meetings (CivicClerk)", file = "meetings/status.json", max_days = 2 },
  { label = "311 requests", file = "311/status.json", max_days = 2 },
  { label = "311 scorecard", file = "311/scorecard.json", field = "generated_at", max_days = 2 },
]

# Who represents you (the Officials page). Kept by hand from official town
# and school websites and records; checked is the date the list was last
# checked against them. Only town- and school-issued email addresses, and the
# mayor's office phone. A district seat's ward is its council district. The
# town publishes its council districts as a PDF map (the Registrar of Voters'
# "Map of 2023 Hamden Legislative Council Districts"), not as map data, so
# there's no ward file: the page lists each member under its office, and says
# the district map isn't available. Terms begin at noon on the last Sunday of
# November after the election (Charter, §3-3), so they end in November.
[officials]
checked = "2026-11-01"
# The next regular municipal election: Tuesday, November 2, 2027 (Charter,
# §3-3.B: odd-numbered years). On that ballot: the Legislative Council, and
# the three Board of Education seats elected in 2023. Nothing municipal is
# on the state election ballot of November 3, 2026 except the Registrars of
# Voters (the Town Clerk's list of nominees), who aren't on this page.
next_election = "2027-11-02"

# Elected townwide on November 4, 2025, the first four-year term (Charter,
# §3-3.C; the Secretary of the State's results, electionhistory.ct.gov
# contest 42816; the town's Elected Officials page,
# https://www.hamden.com/352/Elected-Officials).
[[officials.bodies]]
name = "Mayor"
url = "https://www.hamden.com/499/Office-of-the-Mayor"
note = "Elected townwide for four years. The mayor isn't a member of the Legislative Council."
members = [
  { name = "Adam Sendroff", seat = "Townwide", term_ends = "2029-11", email = "mayor@hamden.com", phone = "(203) 287-7100" },
]

