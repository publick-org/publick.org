# Site configuration for Westbrook, Maine. Everything town-specific lives
# here; the code is the Publick engine
# (github.com/publick-org/publick-engine).
#
# Westbrook's website runs on CivicPlus. The City Council, its committees,
# the Planning Board, and the city's other boards post their agendas and
# minutes in the Agenda Center, and the city calendar lists the council's and
# the Planning Board's meetings, with their times, before the agendas are
# posted. The minutes are text PDFs. The city also has a CivicClerk portal
# (westbrookme.portal.civicclerk.com) that lists the council's meetings, but
# it publishes no agendas or minutes, and files the council's committee
# meetings under the council as "One Time Event", so it isn't read: the
# Agenda Center has the same meetings with their documents. The School
# Committee posts its agendas and minutes as Google Drive files linked from
# its page on the school department's website, each labelled only with the
# meeting's date, so agendas and minutes can't be told apart; its meetings and
# its committees' are read from the department's calendar feed
# ([ical_meetings]), without documents. The city doesn't answer requests on
# SeeClickFix ([absences]). The engine's Maine package gives the tax rate and
# the property tax, from Maine Revenue Services ([finance]), and school
# figures, from the Department of Education's ESSA Dashboard ([schools]);
# housing and unemployment come from the Census and BLS, as for every town.
#
# The site is in English and Spanish ([site] languages), as every town's is.
# The first runs draft the Spanish for the town's own text; [strings.es], at
# the end, can correct it.

[site]
name = "Westbrook Publick"
# The masthead shows name_prefix in dark ink and name_suffix in the accent
# color: the town, then the network.
name_prefix = "Westbrook "
domain = "westbrook-me.publick.org"
tagline = "Public data on how Westbrook, Maine decides and spends. Updated daily."
# One line under the name at the top of every page.
masthead = "An independent guide to city government in Westbrook, Maine"
# Public contact address. Shown on the About and Accessibility pages when set.
contact_email = "westbrook-me@publick.org"
user_agent = "westbrook-me.publick.org (+https://westbrook-me.publick.org/about/)"

# From the city website's stylesheet (www.westbrookmaine.gov): its teal (59
# uses: widget headings and links), a darker shade of it (47 uses), a light
# tint of the teal, and its red (14 uses). Each passes WCAG AA on white: 5.5,
# 5.7 and 6.6 to 1. Its bright blue (#0098f7, 54 uses, 3.1 to 1) doesn't, so
# it isn't used.
[site.colors]
primary = "#1f7284"
primary_dark = "#177084"
primary_soft = "#e9f1f3"
accent = "#af282e"

[town]
name = "Westbrook"
state_abbr = "ME"
official_site = "https://www.westbrookmaine.gov"

# Sections appear in the main navigation in this order. Each one is a folder
# under site/pages/<slug>/ and is served at https://<domain>/<slug>/.
[[sections]]
slug = "meetings"
title = "Meetings"
summary = "When the City Council and its committees, the Planning Board, the city's other boards, and the School Committee meet, with the city's agendas, and minutes from January 2026 on."
status = "live"

[[sections]]
slug = "budget"
title = "City budget"
nav = "Budget"
summary = "The city's tax rate and what the property tax raises, compared with Maine's other towns."
status = "live"

[[sections]]
slug = "schools"
title = "Schools"
summary = "Westbrook Public Schools' graduation rate, absenteeism, state test results, and spending per pupil, with the state's."
status = "live"

[[sections]]
slug = "housing"
title = "Housing"
summary = "New homes permitted, home values and rents, and the housing stock."
status = "live"

[[sections]]
slug = "officials"
title = "Who represents you"
nav = "Officials"
summary = "The mayor, City Council, and School Committee, by office and by ward, and how to reach them."
status = "live"

[[sections]]
slug = "about"
title = "About"
summary = "Data sources, update schedule, metric definitions, and corrections."
status = "live"

# Page view counting with GoatCounter, on the network's site; prefix is this
# town's folder.
[analytics]
prefix = "westbrook-me"

# No [recordings]: the city posts its meetings' videos (City Council, School
# Committee, Planning Board) to a Vimeo showcase, whose videos can't be read by
# a server, and its YouTube channel has had no meeting since August 2025.

# The weekly digest's email signup, on /digest/ (the engine's pipeline/digest.py). The form posts
# to this site's /digest/subscribe, which the sites Worker answers (worker/digest.js) and passes on
# to Buttondown with the tag westbrook-me-en. The About page names who keeps the addresses.
[digest]
# The network's settings (defaults/network.toml): having the table turns the signup on.

# Public meetings, from the city calendar and its Agenda Center.
[meetings]
base_url = "https://www.westbrookmaine.gov"
archive_url = "https://www.westbrookmaine.gov/AgendaCenter"
archive_name = "city's Agenda Center"
# The city's site resets some connections; a slower pace and the client's
# retries help.
request_delay = 5.0
max_event_pages = 40

# The city calendar, read month by month: the meetings the city lists before
# their agendas are posted, with their times and places. A meeting on the
# calendar and in the Agenda Center is shown once. Read: the City Council's,
# the Committee of the Whole's and the Planning Board's calendars, the Zoning
# Board's and the Westbrook Environmental Improvement Corporation's (empty
# from August 2026 to January 2027, but kept for their boards), and Main
# Calendar, which has holidays and other boards' meetings (the Recreation and
# Conservation Commission's, the Planning Board's site walks). Not read: the
# Events, Elections, Library Programs and Events, Community Center, Economic &
# Community Development, and Public Services calendars, which list no meetings.
[meetings.civicplus]
calendars = ["Main Calendar", "Westbrook City Council Meetings", "Committee of The Whole", "Westbrook Planning Board Meetings", "Zoning Board Meetings", "WEIC Meetings"]
# Main Calendar's holiday closures aren't meetings: only titles naming a board
# are kept.
include_pattern = '\b(boards?|commissions?|committees?|subcommittees?|councils?|authority|trustees|ZBA|WEIC|task force)\b'

# Calendar titles, and an Agenda Center category, as the board's usual name.
# The City Council's standing committees (the council's page) are named as
# the council's, as in the Agenda Center ([meetings.agenda_center.committees]).
[meetings.aliases]
"Committee of the Whole" = "City Council Committee of the Whole"
"Public Safety Committee" = "City Council Public Safety Committee"
"Finance Committee" = "City Council Finance Committee"
"Facilities & Streets Committee" = "City Council Facilities and Streets Committee"
"Facilities and Streets Committee" = "City Council Facilities and Streets Committee"
"Housing & Economic Development Committee" = "City Council Housing and Economic Development Committee"
"Housing and Economic Development Committee" = "City Council Housing and Economic Development Committee"
"Westbrook Environmental Improvement Corporation (WEIC)" = "Westbrook Environmental Improvement Corporation"
"WEIC" = "Westbrook Environmental Improvement Corporation"

[meetings.agenda_center]
base_url = "https://www.westbrookmaine.gov"
# The first run lists meetings from here, and minutes are collected from here
# on. The councilors elected in November 2025 took office on December 1, 2025.
since = "2026-01-01"

# The City Council's committees post under the City Council's category, each
# named in its titles ("Finance Committee Meeting Packet", "Facilities &
# Streets Committee Meeting", "Housing and Economic Development Meeting
# Packet", "Committee of the Whole Meeting Agenda", "Joint City Council &
# School Committee Meeting Packet").
[meetings.agenda_center.committees."City Council"]
"Committee of the Whole" = "City Council Committee of the Whole"
"Public Safety Committee" = "City Council Public Safety Committee"
"Finance Committee" = "City Council Finance Committee"
"Facilities & Streets" = "City Council Facilities and Streets Committee"
"Housing & Economic Development" = "City Council Housing and Economic Development Committee"
"School Committee" = "Joint City Council and School Committee"

# The School Committee's meetings and its four committees', from the school
# department's calendar feed (Apptegy), with their times: "School Committee
# Meeting", "Finance Committee Meeting", "Ed Programs Committee Meeting",
# "Facilities Committee Meeting", "Policy Committee Meeting". The committees
# are named as on the School Committee's page. The feed lists upcoming events
# only; agendas are on the School Committee's page.
[ical_meetings]
ical_url = "https://thrillshare-cmsv2.services.thrillshare.com/api/v4/o/11325/cms/events/generate_ical"
page_url = "https://www.westbrookschools.org/o/wsd/page/westbrook-school-committee"
source_name = "Westbrook School Department"
since = "2026-10-01"

[ical_meetings.bodies]
"School Committee" = "School Committee"
"Finance Committee" = "School Committee Finance Committee"
"Ed Programs Committee" = "School Committee Educational Programs Committee"
"Educational Programs Committee" = "School Committee Educational Programs Committee"
"Facilities Committee" = "School Committee Facilities Committee"
"Policy Committee" = "School Committee Policy Committee"

# Agenda and minutes PDFs live in the network's documents bucket, not in git
# (see pipeline/documents.py). Keys: STORAGE_ACCESS_KEY_ID,
# STORAGE_SECRET_ACCESS_KEY.
[storage]
prefix = "westbrook-me"

# Plain-English agenda text and previews, and decisions from minutes, written
# by a language model and labeled as AI-generated on the site. Only meetings
# from `since` on are summarized, about three months before launch, so the
# town's history doesn't take the month's budget. The City Council's agendas
# are posted as full packets (144 pages for November 2, 2026).
[summaries]
since = "2026-08-01"

# How residents can take part, per board, shown on its meeting pages. Only
# what the city or the school department has published; each entry names its
# source. The council's agendas (here, November 2, 2026) have two public
# comment periods, the written comment deadline, and the Zoom link; the
# council's Remote Participation Instructions
# (https://www.westbrookmaine.gov/DocumentCenter/View/3450) say how to speak
# remotely; the City Clerk's page gives the office's address. The city posts
# its meetings' videos on Vimeo ("Westbrook Meeting Videos", linked from every
# page of its website).
[participation."City Council"]
comment = "Each regular City Council agenda has two public comment periods, and the floor is opened for comments on each motion. Meetings are hybrid: people attending on Zoom can speak by using \"Raise Hand\" (or dialing *9 by phone). Written comments must reach the City Clerk's Office (clerk@westbrook.me.us) by 10 a.m. on the day of the meeting to be included in the record."
source_title = "City Council agenda of November 2, 2026"
source_url = "https://www.westbrookmaine.gov/AgendaCenter/ViewFile/Agenda/_11022026-1036"
video_title = "the city's meeting videos on Vimeo"
video_url = "https://vimeo.com/showcase/westbrookmeetings"

# From the School Committee's agenda of October 14, 2026, linked from its page.
[participation."School Committee"]
comment = "Each School Committee meeting has two public participation periods, each 3 minutes per speaker, once: the first for agenda items only, the second for any school-related matter. Meetings can also be attended on Zoom."
source_title = "School Committee agenda of October 14, 2026"
source_url = "https://drive.google.com/file/d/19QuAviIlqf5zkaLz_B7lmarS6vYl9SBP/view"
video_title = "the city's meeting videos on Vimeo"
video_url = "https://vimeo.com/showcase/westbrookmeetings"

# Terms that come up on agendas and minutes, explained on each meeting page
# where they appear. Acronyms match exactly; other terms ignore case. An entry
# with bodies is shown only on those boards' meetings. Both are from the City
# Council's agendas (November 2, 2026: "Administration's Position Paper. See
# the attached document for an overview of the Administration's position on
# the items listed on this agenda"; "Orders of the Day (Second and Final
# Reading)", each "received first reading on October 19, 2026, and [is] in
# order for final Council action").
[[glossary]]
term = "position paper"
bodies = ["City Council"]
definition = "The City Administrator's memo attached to each City Council agenda, giving the Administration's position on the items listed on it."

[[glossary]]
term = "Orders of the Day"
bodies = ["City Council"]
definition = "The part of a City Council agenda for second and final readings: orders that had their first reading at an earlier meeting and are now up for the Council's final vote."

# Schools: the Department of Education's ESSA Dashboard, where the district is
# "Westbrook Public Schools". The district calls itself the Westbrook School
# Department (westbrookschools.org).
[schools]
doe_district = "Westbrook Public Schools"
district_name = "Westbrook School Department"

# Tax rate, property tax, and the city's budget (pipeline/states/me/), from
# Maine Revenue Services' figures, where the city is "WESTBROOK". There's no
# average single-family tax bill: Westbrook's rows in the Maine GeoLibrary's
# parcel table (GEOCODE 05240) code its single-family homes "1010" ("SINGLE
# FAM", 3,993 parcels), but none of its 7,360 rows has a building value, only
# land, so the homes' assessed values can't be added up. So the tax bill's keys
# (megis_geocode, single_family_use) are left out, and the Budget page has the
# tax rate and what the property tax raises without an average bill. The city
# posts its approved budgets in its Archive Center (the Budget page's "View All
# Approved Budgets").
[finance]
mrs_municipality = "Westbrook"
budget_documents_url = "https://www.westbrookmaine.gov/Archive.aspx?AMID=37"

# Housing: Census building permits (state and place FIPS codes), American
# Community Survey through Census Reporter (geo ids). Westbrook is a Census
# place, Westbrook city (23-82105).
[housing]
bps_place = "82105"
census_geo = "16000US2382105"

# Unemployment rate (BLS Local Area Unemployment Statistics, area
# CT2382105000000, Westbrook city, ME). City rates are not seasonally
# adjusted; the state series is shown for context.
[labor]
local_series = "LAUCT238210500000003"

# How often each data source should update. Figures published monthly or
# yearly are judged by the engine, by the period they cover
# (pipeline/rhythms.py).
[freshness]
sources = [
  { label = "Meetings (Agenda Center)", file = "meetings/status.json", max_days = 2 },
]

# The city takes Public Services requests by phone (its Public Services page,
# https://www.westbrookmaine.gov/156/Public-Services). SeeClickFix's place for
# Westbrook (place 9359) has 23 requests since 2019, none acknowledged by the
# city.
[absences]
311 = "The city takes Public Services requests by phone and publishes no data on them."

# Who represents you (the Officials page). Kept by hand from official city and
# school websites; checked is the date the list was last checked against them.
# Only city- and school-issued email addresses (the city's and the
# department's pages also list members' own phone numbers, which are left
# out). Each of the five wards elects a city councilor and a School Committee
# member, and each body has two at-large seats (the city's Elected Officials
# page). The ward file is data/static/westbrook-wards-2025.geojson: the five
# wards from the city's own GIS (its Wards layer, the one its Ward Map,
# "Revised to: 11/11/2025", shows), with each ward's 2020 population (the
# census blocks inside it, 20,400 in all, the city's 2020 count). Every seat
# is three years (the Elected Officials page). The mayor's term begins on the
# first Monday in December after the election (the charter, section 2.3, on
# the city's City Charter: Mayor Related page), and the councilors and School
# Committee members elected in November 2025 took office on December 1, 2025
# (the council's minutes; the Elected Officials page), so terms end in
# December.
[officials]
checked = "2026-11-01"
# The next regular municipal election: Tuesday, November 2, 2027 (the Elected
# Officials page's "Next Election" for the seats elected in 2024). The
# November 3, 2026 election is the state's, with no municipal offices on the
# ballot (the city's Elections & Voting page).
next_election = "2027-11-02"
wards_file = "westbrook-wards-2025.geojson"
wards_publisher = "the City of Westbrook"
wards_year = 2025
wards_url = "https://services5.arcgis.com/Cxl8RQ4PEBjdRbtW/arcgis/rest/services/Voting/FeatureServer/177"

# Elected on November 4, 2025 (official results); the Elected Officials page.
# The email address is the Mayor's Office page's.
[[officials.bodies]]
name = "Mayor"
url = "https://www.westbrookmaine.gov/259/Mayors-Office"
note = "Elected citywide for three years. The mayor holds the city's executive powers and can veto the City Council's votes."
members = [
  { name = "David Morse", seat = "Citywide", term_ends = "2028-12", email = "mayor@westbrook.me.us" },
]

# From the City Council page (members, seats, officers, and email addresses)
# and the Elected Officials page, confirmed against the official results of
# November 5, 2024 (Shaughnessy, Turcotte, and Faulkingham, whose Ward 4 win
# a recount confirmed on November 15, 2024) and November 4, 2025 (Rairdon,
# whose at-large win a recount confirmed on November 14, 2025, McCambridge,
# Chau, and Munro), and the roll call of the council's minutes of June 15,
# 2026. The council elected Munro its President on December 1, 2025, and
# confirmed Shaughnessy as Vice President (its minutes).
[[officials.bodies]]
name = "City Council"
url = "https://www.westbrookmaine.gov/323/City-Council"
note = "Seven councilors: five elected by ward and two at-large, for three-year staggered terms. The council elects its President, who presides."
members = [
  { name = "Brian McCambridge", seat = "Ward 1", ward = 1, term_ends = "2028-12", email = "bmccambridge@westbrook.me.us" },
  { name = "Victor Chau", seat = "Ward 2", ward = 2, term_ends = "2028-12", email = "vchau@westbrook.me.us" },
  { name = "Anna A. Turcotte", seat = "Ward 3", ward = 3, term_ends = "2027-12", email = "anna.turcotte@westbrook.me.us" },
  { name = "Amy Faulkingham", seat = "Ward 4", ward = 4, term_ends = "2027-12", email = "afaulkingham@westbrook.me.us" },
  { name = "Jennifer Munro", seat = "Ward 5", ward = 5, role = "City Council President", term_ends = "2028-12", email = "jmunro@westbrook.me.us" },
  { name = "Gary Rairdon", seat = "At-large", term_ends = "2028-12", email = "grairdon@westbrook.me.us" },
  { name = "Michael Shaughnessy", seat = "At-large", role = "City Council Vice President", term_ends = "2027-12", email = "mshaughnessy@westbrook.me.us" },
]

# From the School Committee's page on the school department's website
# (members, seats, officers, and school-issued email addresses) and the city's
# Elected Officials page, confirmed against the official results of November
# 5, 2024 (Rice, Cavallaro, Reed) and November 4, 2025 (Poitras, Mancuso),
# and the members present in the committee's minutes of September 9, 2026.
