# Site configuration for Methuen, Massachusetts. Everything town-specific lives
# here; the code is the Publick engine (github.com/publick-org/publick-engine).
#
# Methuen's website runs on CivicPlus. Its boards post agendas and minutes in
# the Agenda Center: the City Council, its committees (each in a category of
# its own), and the city's boards and commissions. The city calendar's
# "Meetings Calendar" lists meetings before their agendas are posted, with
# times and places ([meetings.civicplus]). The Archive Center (/Archive.aspx)
# holds budgets, reports and newsletters, and no agendas or minutes, so it isn't
# read; the council's vote records ("Meeting Votes") are in the Document
# Center, which the engine doesn't read, and its minutes, in the Agenda Center,
# have the same votes. The School Committee posts on the school district's
# Finalsite website, as a table with a row a meeting linking its posting,
# agenda, minutes and video (Google Drive files and YouTube), which
# [page_meetings] reads. 311 requests are on SeeClickFix. The state sources (DLS,
# DESE, BLS, Census, the Subsidized Housing Inventory) are the same as Malden's.
#
# The site is in English and Spanish ([site] languages), as every town's is.
# The first runs draft the Spanish for the town's own text; [strings.es] can
# correct it.

[site]
name = "Methuen Publick"
# The masthead shows name_prefix in dark ink and name_suffix in the accent
# color: the town, then the network.
name_prefix = "Methuen "
domain = "methuen-ma.publick.org"
tagline = "Public data on how Methuen, Massachusetts responds, decides, and spends. Updated daily."
# One line under the name at the top of every page.
masthead = "An independent guide to city government in Methuen, Massachusetts"
# Public contact address. Shown on the About and Accessibility pages when set.
contact_email = "methuen-ma@publick.org"
user_agent = "methuen-ma.publick.org (+https://methuen-ma.publick.org/about/)"

# From the city website's theme stylesheet (methuen.gov): its indigo (the most
# used after white and black: headlines, the footer, the sidebar), the dark
# navy of its homepage controls, a light tint of the indigo, and its orange
# (widget rules), darkened to pass. Contrast on white: 11.6, 15.4, and 5.0 to
# 1. The orange as it is (#dc780d, 3.1 to 1) and the bright blue CivicPlus
# uses for links (#0098f7, 3.1 to 1) don't pass.
[site.colors]
primary = "#362b80"
primary_dark = "#072642"
primary_soft = "#ebeaf2"
accent = "#a95c0a"

[town]
name = "Methuen"
state_abbr = "MA"
official_site = "https://www.methuen.gov"

# Sections appear in the main navigation in this order. Each one is a folder
# under site/pages/<slug>/ and is served at https://<domain>/<slug>/.
[[sections]]
slug = "meetings"
title = "Meetings"
summary = "Every board and committee meeting on the city calendar and in its Agenda Center, and the School Committee's, with agendas, and minutes from January 2026 on."
status = "live"

[[sections]]
slug = "311"
title = "311 Requests"
nav = "311"
summary = "How fast the city responds to service requests on SeeClickFix, by category and voting precinct."
status = "live"

[[sections]]
slug = "schools"
title = "Schools"
summary = "Graduation, attendance, and MCAS results compared with the state."
status = "live"

[[sections]]
slug = "budget"
title = "City budget"
nav = "Budget"
summary = "Where general fund money comes from and how it is spent, reserves, and the property tax limit."
status = "live"

[[sections]]
slug = "housing"
title = "Housing"
summary = "New homes permitted, home values and rents, affordable housing, and the housing stock."
status = "live"

[[sections]]
slug = "officials"
title = "Who represents you"
nav = "Officials"
summary = "The mayor, City Council, and School Committee, and how to reach them."
status = "live"

[[sections]]
slug = "about"
title = "About"
summary = "Data sources, update schedule, metric definitions, and corrections."
status = "live"

# Page view counting with GoatCounter, on the network's site; prefix is this
# town's folder.
[analytics]
prefix = "methuen-ma"

# The weekly digest's email signup, on /digest/ (the engine's pipeline/digest.py). The form posts
# to this site's /digest/subscribe, which the sites Worker answers (worker/digest.js) and passes on
# to Buttondown with the tag methuen-ma-en. The About page names who keeps the addresses.
[digest]
# The network's settings (defaults/network.toml): having the table turns the signup on.

# Public meetings, from the city's calendar and Agenda Center.
[meetings]
base_url = "https://www.methuen.gov"
archive_url = "https://www.methuen.gov/AgendaCenter"
archive_name = "city's Agenda Center"
# The city's site resets some connections; a slower pace and the client's retries help.
request_delay = 5.0
max_event_pages = 40

# The city calendar, read month by month: the "Meetings Calendar" (its other
# calendar is "Community Events"), with each meeting's time and place before
# its agenda is posted. A meeting on the calendar and in the Agenda Center is
# shown once.
[meetings.civicplus]
calendars = ["Meetings Calendar"]

# Agenda Center categories renamed to the board's usual name. The council's
# committees each have a category of their own, named without the council;
# their agendas are the City Council office's, and the council's page lists
# them as its committees.
[meetings.aliases]
"Finance Committee" = "City Council Finance Committee"
"Public Safety Committee" = "City Council Public Safety Committee"
"Economic Development" = "City Council Economic Development Committee"
"Recreation Committee" = "City Council Recreation Committee"
"Veterans Affairs" = "City Council Veterans Affairs Committee"
"Unaccepted Ways Task Force" = "City Council Unaccepted Ways Task Force"
# The Agenda Center's short names for boards the calendar names in full (the
# ZBA as the city's Boards and Commissions page describes it).
"Housing Authority" = "Methuen Housing Authority"
"Zoning Board" = "Zoning Board of Appeals"

[meetings.agenda_center]
base_url = "https://www.methuen.gov"
# The first run lists meetings from here, and minutes are collected from here on.
since = "2026-01-01"

# The council's joint meeting with the School Committee (January 21, 2026) is
# posted under both boards' categories; it's one meeting of its own. The
# School Committee's category has nothing else: the committee posts on the
# district's website ([page_meetings], below).
[meetings.agenda_center.committees."City Council"]
"School Committee" = "Joint City Council and School Committee"

[meetings.agenda_center.committees."School Committee"]
"City Council" = "Joint City Council and School Committee"

# The School Committee's meetings, agendas and minutes, from the district's
# "Meetings, Documents and Recordings" page: a table under a tab for each school
# year, a row a meeting, with its date, its name ("Business Meeting", "Policy
# Subcommittee"), and links labelled "Posting", "Agenda", "Minutes" and "Video"
# (YouTube for the committee's meetings, Drive files for its subcommittees').
# Its agendas give 6:00 PM, as the district's Meeting Calendar page says of
# every meeting unless noted; the table gives no times, so none are shown.
[page_meetings]
page_url = "https://www.methuen.k12.ma.us/school-community/meetings-documents"
source_name = "Methuen Public Schools"
# The first run lists meetings from here, and documents are collected from here on.
since = "2026-01-01"
body = "School Committee"

# The names in the table's rows for the committee's subcommittees, and the
# joint meeting with the City Council the Agenda Center also posts.
[page_meetings.bodies]
"Policy Subcommittee" = "School Committee Policy Subcommittee"
"Finance Subcommittee" = "School Committee Finance Subcommittee"
"Finance Sub-Committee" = "School Committee Finance Subcommittee"
"Budget Subcommittee" = "School Committee Budget Subcommittee"
"Joint Meeting - City Council" = "Joint City Council and School Committee"

# 311 requests, from SeeClickFix (public requests only). The city's
# organization is 1452 ("City of Methuen"), the one its "Report a Concern"
# link goes to; its Open311 services
# (seeclickfix.com/open311/v2/1452/services.json) are 43 request types, all the
# city's own departments' (Public Works, Health, Building, Police, the
# Commission on Disability, City Administration), so no departments are needed.
# The city acknowledges and closes most requests (63 of 74 in the first week of
# March 2026 were closed).
[seeclickfix]
organization_id = 1452
report_url = "https://seeclickfix.com/web_portal/H3G6t5xibMNrZURsJP8tbLwm/report/category"
# The month the full history starts (python -m pipeline.fetch_311 --backfill).
# Older requests are included only while they are still open.
history_since = "2026-01"
# The Police and Health Departments' request types are complaints about a
# person or a household, but their names don't say so ("Drug activity,
# non-emergent", "Pest Infestations"), so they're listed here: their requests
# are shown to the block, as the engine's own sensitive categories are.
sensitive_categories = [
  "Speeding, signage, or any other traffic safety concern",
  "Loud music, abandoned bicycle, suspicious activity, or any non-emergent illegal activity",
  "Drug activity, non-emergent",
  "Parking complaint, non- emergent",
  "Out-of-State improperly registered vehicle",
  "Animal related concerns, dead animal in roadway",
  "Food Safety Violations",
  "Pest Infestations",
  "Public Health Nuisances",
  "Sewage and Septic Issues",
  "Trash and Waste Violations",
  "Smoking Violations",
  "Water Quality Concerns",
  "Toxic Materials Exposure",
  "Property Maintenance Issues",
  "Rental Property Inspections",
  "General Health Department Inquiry",
  "Occupancy Limit Violations",
]
# Methuen has no wards: its areas are its 15 voting precincts, from MassGIS's
# 2022 file (TOWN='METHUEN', which has no WARD), each its own area as South
# Kingstown's are. The election results' sub-precincts 6A and 13A are parts of
# Precincts 6 and 13 there.
areas = "precincts"
precincts_file = "methuen-precincts-2022.geojson"
wards_publisher = "MassGIS"
wards_year = "2022"
wards_url = "https://gis.data.mass.gov/maps/aec5130790814ace94438d3bcf23cf9a"

# Agenda and minutes PDFs live in the network's documents bucket, not in git
# (see pipeline/documents.py). Keys: STORAGE_ACCESS_KEY_ID, STORAGE_SECRET_ACCESS_KEY.
[storage]
prefix = "methuen-ma"

# Plain-English agenda text and previews, and decisions from minutes, written by
# a language model and labeled as AI-generated on the site. Only meetings from
# `since` on are summarized, about three months before launch, so the town's
# history doesn't take the month's budget.
[summaries]
since = "2026-07-01"

# The council's meetings, transcribed from their recordings for a summary the
# day after, until the minutes come (the engine's pipeline/recordings.py).
[recordings]
since = "2026-10-26"

# Methuen Community Studios' Cablecast: the City Council's project, titled "City Council Meeting - October
# 19, 2026" (a joint hearing or budget workshop is left out).
[[recordings.sources]]
platform = "cablecast"
host = "https://methuentv.cablecast.tv"
projects = [157]
boards = { "City Council" = '^City Council (Regular |Special )?Meeting\b' }

# How residents can take part, per board, shown on its meeting pages. From
# Rule XI of the council's Rules and Procedures (as amended February 5, 2024,
# the version the council's page links). The council's meetings are broadcast
# and kept on demand by Methuen Community Studios, which each agenda links.
[participation."City Council"]
comment = "Residents can speak in the public participation period near the start of every council meeting, for up to five minutes, keeping to their subject. Give the Council Clerk's office (978-983-8510) your name, address and subject beforehand; speakers are heard in that order."
source_title = "City Council Rules and Procedures (Rule XI)"
source_url = "https://www.methuen.gov/DocumentCenter/View/3321/Rules-and-Regulations-2024---Amended-2-5-2024---FINAL"
video_title = "Methuen Community Studios"
video_url = "https://methuentv.cablecast.tv/internetchannel?site=2"

# From the committee's Policy BEDH, "Public Participation: Guidelines for Public
# Comment" (readopted January 13, 2025), on the district's Policies page. Its
# meetings are streamed and kept on the district's YouTube channel, which the
# district's website and the committee's table of meetings link.
[participation."School Committee"]
comment = "Residents can speak for up to five minutes in the public comment period near the start of each business, workshop and special meeting, on an agenda item or anything else within the committee's responsibility, after writing their name and address on the sign-up sheet. When a meeting is held remotely, send a written statement of no more than one page to the Superintendent's Office by 3:00 PM that day."
source_title = "the School Committee's Policy BEDH"
source_url = "https://drive.google.com/file/d/1wfSOigwLj_x-wiux02tSdZnFUQaAxJaA/view?usp=sharing"
video_title = "Methuen Public Schools on YouTube"
video_url = "https://www.youtube.com/channel/UCez3QQIzOP9up4JK-B08L5g"

# School district figures from the state's education data portal (DESE).
[schools]
district_code = "01810000"
district_name = "Methuen Public Schools"

# Tax bill and budget figures (Mass. Division of Local Services). Some DLS
# reports take the name, others the DOR code.
[finance]
dls_municipality = "Methuen"
dls_code = "181"

# Housing: Census building permits (state and place FIPS codes), American
# Community Survey through Census Reporter (geo ids), and the state's
# Subsidized Housing Inventory PDF (the town's name as the PDF lists it).
# The Census Bureau lists the city as "Methuen city" (2540675), the code the
# permits file and BLS use; its former "Methuen Town" (2540710) is no longer
# in the ACS 5-year release or TIGERweb.
[housing]
bps_place = "40675"
census_geo = "16000US2540675"
shi_name = "Methuen"

# Unemployment rate (BLS Local Area Unemployment Statistics, area
# CT2540675000000, Methuen city). City rates are not seasonally adjusted; the
# state series is shown for context.
[labor]
local_series = "LAUCT254067500000003"

# How often each data source should update. Figures published monthly or yearly
# are judged by the engine, by the period they cover (pipeline/rhythms.py).
[freshness]
sources = [
  { label = "Meetings (Agenda Center)", file = "meetings/status.json", max_days = 2 },
  { label = "School Committee meetings (school district website)", file = "meetings/page_status.json", max_days = 2 },
  { label = "311 requests", file = "311/status.json", max_days = 2 },
  { label = "311 scorecard", file = "311/scorecard.json", field = "generated_at", max_days = 2 },
]

# Who represents you (the Officials page). Kept by hand from official city
# and school websites; checked is the date the list was last checked against
# them. Only city- and school-issued email addresses, and the mayor's office
# phone (the councillors' and School Committee members' own phones, which the
# city's and the district's pages list, aren't used). Terms are two years, from
# January, by the Home Rule Charter (Sections 2-1, 3-1 and 4-1).
#
# Methuen has no wards. The council's three districts are groups of voting
# precincts (the council's page and the official results of November 4, 2025),
# and the precinct file could draw them, but the Officials page calls every
# area a ward, so the district seats aren't tied to it: the council's note says
# which precincts make each district, and the page has no map.
[officials]
checked = "2026-10-12"
# The next regular city election (Charter Section 7-1: the first Tuesday after
# the first Monday in November of each odd-numbered year).
next_election = "2027-11-02"

[[officials.bodies]]
name = "Mayor"
url = "https://www.methuen.gov/262/Office-of-the-Mayor"
note = "Elected citywide for two years. Chairs the School Committee."
members = [
  { name = "David P. “D.J.” Beauregard, Jr.", seat = "Citywide", term_ends = "2028-01", phone = "(978) 983-8505" },
