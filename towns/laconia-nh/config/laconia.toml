# Site configuration for Laconia, New Hampshire. Everything town-specific
# lives here; the code is the Publick engine
# (github.com/publick-org/publick-engine).
#
# Started on 2026-11-01 by the engine's helper (python -m pipeline.new_town),
# from Methuen's config.
#
# Laconia's website runs on CivicPlus. Its boards post agendas and minutes in
# the Agenda Center: the City Council and its committees (under the Council's
# category), and the city's boards and commissions. The city calendar lists
# meetings before their agendas are posted, with times and places
# ([meetings.civicplus]). The minutes are text PDFs. The School Board posts its
# agendas and minutes as Google Docs and Drive files linked from two pages of
# the school district's Weebly website (sau30.org), each laid out as one table
# that [page_meetings] reads as a single meeting, so its meetings aren't listed
# here. There is no 311 section: the city takes concerns through a form on its
# own website ([absences]). Its tax rate, tax bill, and school figures are New
# Hampshire's (the engine's pipeline/states/nh/).
#
# The site is in English and Spanish ([site] languages), as every town's is.
# The first runs draft the Spanish for the town's own text; [strings.es], at
# the end, can correct it.

[site]
name = "Laconia Publick"
# The masthead shows name_prefix in dark ink and name_suffix in the accent
# color: the town, then the network.
name_prefix = "Laconia "
domain = "laconia-nh.publick.org"
tagline = "Public data on how Laconia, New Hampshire decides and spends. Updated daily."
# One line under the name at the top of every page.
masthead = "An independent guide to city government in Laconia, New Hampshire"
# Public contact address. Shown on the About and Accessibility pages when set.
contact_email = "laconia-nh@publick.org"
user_agent = "laconia-nh.publick.org (+https://laconia-nh.publick.org/about/)"

# From the city website's stylesheets (www.laconianh.gov): its blue
# (subheadings and their links, 5.8 to 1 on white), its navy (headlines and
# the footer, 13.2 to 1), a light tint of the blue, and its red (the links and
# subheadings of its widgets, 6.4 to 1).
[site.colors]
primary = "#2d63b9"
primary_dark = "#163056"
primary_soft = "#eaeff8"
accent = "#bd151e"

[town]
name = "Laconia"
state_abbr = "NH"
official_site = "https://www.laconianh.gov"

# Sections appear in the main navigation in this order. Each one is a folder
# under site/pages/<slug>/ and is served at https://<domain>/<slug>/.
[[sections]]
slug = "meetings"
title = "Meetings"
summary = "When the City Council, its committees, and the city's boards and commissions meet, from the city calendar and its Agenda Center, with agendas, and minutes from January 2026 on."
status = "live"

[[sections]]
slug = "schools"
title = "Schools"
summary = "Laconia School District's graduation rate, state test results, and cost per pupil, with the state's."
status = "live"

[[sections]]
slug = "budget"
title = "City budget"
nav = "Budget"
summary = "The city's property tax rate and where the tax goes, what it raises per resident, and the average single-family tax bill."
status = "live"

[[sections]]
slug = "housing"
title = "Housing"
summary = "New homes permitted, home values and rents, and the housing stock."
status = "live"

[[sections]]
slug = "officials"
title = "Who represents you"
nav = "Officials"
summary = "The mayor, the City Council, and the School Board, by office and by ward, and how to reach them."
status = "live"

[[sections]]
slug = "about"
title = "About"
summary = "Data sources, update schedule, metric definitions, and corrections."
status = "live"

# Page view counting with GoatCounter, on the network's site; prefix is this
# town's folder.
[analytics]
prefix = "laconia-nh"

# Public meetings, from the city calendar and its Agenda Center.
[meetings]
base_url = "https://www.laconianh.gov"
archive_url = "https://www.laconianh.gov/AgendaCenter"
archive_name = "city's Agenda Center"
# The city's site resets some connections (4 of the helper's); a slower pace
# and the client's retries help.
request_delay = 5.0
max_event_pages = 40

# The city calendar, read month by month: the meetings the city lists before
# their agendas are posted, with their times and places. Read: the calendars
# whose events, over the last three months and the next three, were mostly
# meetings. Not read: Airport Authority, Assessing, Bartlett Beach, Board of
# Water Commissioners Calendar, Bobotas Park, Bond Beach (residents only),
# Capital Improvement Committee, City Clerk Calendar, City Council, Code
# Enforcement / Building, Community Center - Conference Room, Community Center
# - Gym, Community Center - Racquetball Court, Community Center - Workout
# Room, Community Center / Parks & Rec, Conservation, Elections, Fire
# Department, Historic District Commission, Human Relations Committee, Laconia
# Putnam Fund, Leavitt Park, Leavitt Park - Athletic Field, Leavitt Park -
# Basketball, Leavitt Park - Parkhouse, Leavitt Park - Tennis, Library,
# Library Adult, Library Children, Library Teen, Licensing Board, Master Plan
# Steering Committee, Memorial Park, Memorial Park - Baseball Field, Memorial
# Park - Softball Field, Memorial Park - Tennis, Minor Site Plan, Opechee -
# Colby Field, Opechee - Field A, Opechee - Field B, Opechee - Field C,
# Opechee - Field D, Opechee - Main Field, Opechee - Smith Field, Opechee -
# Smith Track, Opechee Cove Beach, Opechee Park, Opechee Point Beach, Parks &
# Rec Programs, Planning Board & Site Review, Public Works Construction
# Schedule, Robbie Mills, Robbie Mills - Baseball Field, Robbie Mills - Soccer
# Field, Rotary Park, Special Events Review Committee (SERC), Tardif Park,
# Tardif Park - Parkhouse, Torrey Park, Water, Weirs Beach, Weirs Community
# Center - Parkhouse, Weirs Community Park, Weirs Community Park -
# Amphitheater, Weirs Community Park - Pavilion, WOW Trail, Wyatt Park,
# Zoning. The boards' own calendars among these (City Council, Licensing
# Board, Planning Board & Site Review, Zoning, and the rest) had no events in
# those months; the parks', library's and community center's events are
# bookings and programs.
[meetings.civicplus]
calendars = ["Heritage Commission", "Main Calendar", "Police Department"]
# Some of their events aren't meetings: only titles naming a board are kept.
include_pattern = '\b(boards?|commissions?|committees?|subcommittees?|councils?|authority|trustees|ZBA|task force)\b'
# A meeting on the calendar and in the Agenda Center is shown once.

# Agenda Center categories and calendar names renamed to the board's usual
# name: most of the trustees' own agendas, and the calendar, say "Trustees of
# the Trust Funds"; the calendar names the City Council's committees
# "Finance Subcommittee meeting", "Public Safety Subcommittee meeting", for
# the same meetings the Agenda Center lists under the Council (below).
[meetings.aliases]
"Trustees of the Trust Fund" = "Trustees of the Trust Funds"
"Finance Subcommittee" = "City Council Finance Committee"
"Appointments Subcommittee" = "City Council Appointments Committee"
"Government Operations & Ordinances Subcommittee" = "City Council Government Operations and Ordinances Committee"
"Lands & Buildings Subcommittee" = "City Council Land and Buildings Committee"
"Land & Buildings Subcommittee" = "City Council Land and Buildings Committee"
"Public Safety Subcommittee" = "City Council Public Safety Committee"
"Public Works Subcommittee" = "City Council Public Works Committee"

[meetings.agenda_center]
base_url = "https://www.laconianh.gov"
# The first run lists meetings from here, and minutes are collected from here
# on.
since = "2026-01-01"

# Not boards: the city's test categories.
exclude_categories = ["CPTest", "CivicPlus Website Testing - Please Ignore"]

# The City Council's committees post under the City Council, titled "City
# Council Subcommittee - Public Safety", "City Council Subcommittee- Finance
# Committee"; their names are the Council's committee page's (City Council
# Committees) and the Mayor's assignments of January 5, 2026. "Quorum of the
# Public Safety Committee - Govt. Ops & Ordinances meeting" is a Government
# Operations meeting.
#
# Several categories also post notices that a quorum of the board may attend
# another body's meeting, each the same notice under every board it names: the
# Master Plan Steering Committee's meeting ("Planning Board - Quorum - Master
# Plan Steering Committee"), which goes with the committee's own; the land use
# boards' public information session of June 30, 2026 ("Public Information
# Session", "Public Information Forum" under the Council); and the RSA 91-A
# (Right-to-Know Law) training of August 10, 2026 for the Council and every
# board ("Quorum of Council, Boards and Commissions - 91-A Training"). Each is
# one meeting here, not one for every board.
[meetings.agenda_center.committees."City Council"]
"Finance Committee" = "City Council Finance Committee"
"Appointments Committee" = "City Council Appointments Committee"
"Government Operations & Ordinances" = "City Council Government Operations and Ordinances Committee"
"Govt. Ops & Ordinances" = "City Council Government Operations and Ordinances Committee"
"Lands & Buildings" = "City Council Land and Buildings Committee"
"Land & Buildings" = "City Council Land and Buildings Committee"
"Public Safety" = "City Council Public Safety Committee"
"Public Works" = "City Council Public Works Committee"
"Master Plan Steering Committee" = "Master Plan Steering Committee"
"Public Information Forum" = "Land Use Boards Public Information Session"
"91-A Training" = "RSA 91-A Training"

[meetings.agenda_center.committees."Board of Assessors"]
"Right To Know Training" = "RSA 91-A Training"

[meetings.agenda_center.committees."Capital Improvement Committee"]
"91-A Training" = "RSA 91-A Training"

[meetings.agenda_center.committees."Conservation Commission"]
"Master Plan Steering Committee" = "Master Plan Steering Committee"
"Public Information Session" = "Land Use Boards Public Information Session"
"91-A Training" = "RSA 91-A Training"

[meetings.agenda_center.committees."Downtown TIF Advisory Board"]
"91-A Training" = "RSA 91-A Training"

[meetings.agenda_center.committees."Heritage Commission"]
"Master Plan Steering Committee" = "Master Plan Steering Committee"
"Public Information Session" = "Land Use Boards Public Information Session"

[meetings.agenda_center.committees."Historic District Commission"]
"Master Plan Steering Committee" = "Master Plan Steering Committee"
"Public Information Session" = "Land Use Boards Public Information Session"
"91-A Training" = "RSA 91-A Training"

[meetings.agenda_center.committees."Human Relations Committee"]
"91-A Training" = "RSA 91-A Training"

[meetings.agenda_center.committees."Laconia Putnam Fund"]
"91-A Training" = "RSA 91-A Training"

[meetings.agenda_center.committees."Master Plan Steering Committee"]
"Public Information Session" = "Land Use Boards Public Information Session"
"91-A Training" = "RSA 91-A Training"

[meetings.agenda_center.committees."Planning Board"]
"Master Plan Steering Committee" = "Master Plan Steering Committee"
"Public Information Session" = "Land Use Boards Public Information Session"
"91-A Training" = "RSA 91-A Training"

[meetings.agenda_center.committees."Special Events Review Committee"]
"91-A Training" = "RSA 91-A Training"

[meetings.agenda_center.committees."Technical Review Committee"]
"91-A Training" = "RSA 91-A Training"

[meetings.agenda_center.committees."Trustees of the Trust Fund"]
"91-A Training" = "RSA 91-A Training"

[meetings.agenda_center.committees."Weirs TIF Advisory Board"]
"91-A Training" = "RSA 91-A Training"

[meetings.agenda_center.committees."Zoning Board of Adjustment"]
"Master Plan Steering Committee" = "Master Plan Steering Committee"
"Public Information Session" = "Land Use Boards Public Information Session"
"91-A Training" = "RSA 91-A Training"

# The School Board's meetings aren't read. The district's website (sau30.org,
# on Weebly) lists the year's dates and each meeting's agenda and posting on
# its "Notice of Meeting & Agenda" page, and the minutes ("October 06, 2026
# Public", "September 15, 2026 Nonpublic") on its "School Board Minutes" page,
# as Google Docs and Drive files. Each page's content is one table whose cells
# hold every meeting, which [page_meetings] reads as a single meeting.

# Agenda and minutes PDFs live in the network's documents bucket, not in git
# (see pipeline/documents.py). Keys: STORAGE_ACCESS_KEY_ID,
# STORAGE_SECRET_ACCESS_KEY.
[storage]
prefix = "laconia-nh"

# Plain-English agenda text and previews, and decisions from minutes, written
# by a language model and labeled as AI-generated on the site. Only meetings
# from `since` on are summarized, about three months before launch, so the
# town's history doesn't take the month's budget.
[summaries]
since = "2026-08-01"

# How residents can take part, per board, shown on its meeting pages. Only
# what the city has published; each entry names its source. From the City
# Council's Rules of Procedure (adopted with revisions April 28, 2025), Rule 9,
# items 9 and 19, which its agendas follow ("Citizen Comments for Matters Not
# on the Agenda", "Citizens Requests to Comment on Current Agenda Items"). The
# Council's page says its meetings are televised on public access Channel 26;
# the city's website links its YouTube channel for past and current meetings.
# The School Board has no entry: its meetings aren't listed here.
[participation."City Council"]
comment = "Residents can speak at each regular meeting twice: early in the meeting, on subjects not on the agenda, and near its end, on items on the agenda. Speakers give their name and ward, and the presiding officer may limit each to five minutes."
source_title = "the City Council's Rules of Procedure"
source_url = "https://www.laconianh.gov/DocumentCenter/View/11399/City-Council-Rules-of-Procedure---Adopted-04282025"
video_title = "the City of Laconia's YouTube channel"
video_url = "https://www.youtube.com/laconianh"

# Terms that come up on agendas and minutes, explained on each meeting page
# where they appear. Acronyms match exactly; other terms ignore case. From the
# city's Budget page (the tax cap), its Winnipesaukee River Basin Program
# (WRBP) Transition page, and the City Council's Rules of Procedure (Rules 4
# and 5).
[[glossary]]
term = "tax cap"
definition = "The limit on increases in the city's, the schools' and the county's net spending, a charter amendment Laconia's voters approved in November 2005. Increases are limited to the change in the national Consumer Price Index, plus the year's new building permits less demolitions times the prior year's tax rate. The City Council can override it by a two-thirds vote."

[[glossary]]
term = "WRBP"
definition = "Winnipesaukee River Basin Program, the state-owned sewer system, a bureau of the NH Department of Environmental Services, that serves Laconia and other Lakes Region communities, which pay for it and have an advisory board."

[[glossary]]
term = "Mayor Pro Tem"
bodies = ["City Council"]
definition = "The councilor the City Council chooses from among its members at the first meeting of each new Council, every two years, who presides when the mayor is absent."

# Schools: the New Hampshire Department of Education's statewide figures.
[schools]
doe_district = "Laconia"
district_name = "Laconia School District"

# Tax rate, property tax, and the average single-family tax bill
# (pipeline/states/nh/), from the New Hampshire DRA's tax rates in the
# engine's yearly statewide figures and NH GRANIT's parcel map.
[finance]
dra_municipality = "Laconia"
# The city posts its adopted and proposed budgets as PDFs on its Budget page,
# which the budget page links rather than reading one.
budget_documents_url = "https://www.laconianh.gov/265/Budget"

# Housing: Census building permits (state and place FIPS codes), American
# Community Survey through Census Reporter (geo ids).
[housing]
bps_place = "40180"
census_geo = "16000US3340180"

# Unemployment rate (BLS Local Area Unemployment Statistics, area
# CT3340180000000, Laconia city, NH). City rates are not seasonally adjusted;
# the state series is shown for context.
[labor]
local_series = "LAUCT334018000000003"

# How often each data source should update. Figures published monthly or
# yearly are judged by the engine, by the period they cover
# (pipeline/rhythms.py).
[freshness]
sources = [
  { label = "Meetings (Agenda Center)", file = "meetings/status.json", max_days = 2 },
]

# The About page's "What this site doesn't cover": why there's no 311 section.
# The city's home page links "Report A Concern" to its Citizen Request Tracker
# (laconianh.gov/requesttracker.aspx), a CivicPlus form whose requests aren't
# public. SeeClickFix has a place named Laconia, NH (place 13760, at
# seeclickfix.com/laconia), but on 2026-11-01 it had no requests, and none had
# been reported within the city's bounds.
[absences]
311 = "The city takes concerns through a form on its own website, Citizen Request Tracker, whose requests aren't made public, so there's no data to show."

# Who represents you (the Officials page). Kept by hand from official city and
# school websites; checked is the date the list was last checked against them.
# Only city- and school-issued email addresses, and the mayor's office phone.
# The city's charter is on General Code's eCode360, which blocks automated
# reading; terms are from the city's own pages and minutes, below. The city's
# website doesn't post the official results of the November 4, 2025 municipal
# election.
[officials]
checked = "2026-11-01"
# The next municipal election, from the City Clerk's Elections page: November
# 3, 2026, with the state general election, for the School Board's Ward 4 and
# Ward 5 seats only. The mayor's and the City Council's terms end in January
# 2028.
next_election = "2026-11-03"
# The ward file is data/static/laconia-wards-2022.geojson (NH GRANIT).
wards_file = "laconia-wards-2022.geojson"
wards_publisher = "NH GRANIT"
wards_year = 2022
wards_url = "https://www.arcgis.com/home/item.html?id=3d1a8bdf3eaa49e09cf5d9da5b56bf9c"

# Seated at the inaugural ceremonies of January 5, 2026 (their minutes, which
# introduce the "2026-2027 Mayor and City Council Members"). The mayor's role
