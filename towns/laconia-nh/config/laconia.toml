url = "https://www.laconianh.gov/522/City-Council"
note = "Elected citywide for two years. The mayor presides over the City Council and has no regular administrative duties: the City Manager is the city's chief administrative officer."
members = [
  { name = "Mike Bordes", seat = "Citywide", term_ends = "2028-01", email = "Mayor@laconianh.gov", phone = "(603) 527-1270" },
]

