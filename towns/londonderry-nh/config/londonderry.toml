# Site configuration for Londonderry, New Hampshire. Everything town-specific
# lives here; the code is the Publick engine
# (github.com/publick-org/publick-engine).
#
# Started on 2026-11-04 by the engine's helper (python -m pipeline.new_town),
# from Derry's config.
# To fill in: what the town uses for meetings, minutes, 311, and its school
#   board, in a few sentences, as other towns' configs begin.
#
# The site is in English and Spanish ([site] languages), as every town's is.
# The first runs draft the Spanish for the town's own text; [strings.es], at
# the end, can correct it.

[site]
name = "Londonderry Publick"
# The masthead shows name_prefix in dark ink and name_suffix in the accent
# color: the town, then the network.
name_prefix = "Londonderry "
domain = "londonderry-nh.publick.org"
tagline = "Public data on how Londonderry, New Hampshire decides and spends. Updated daily."
# One line under the name at the top of every page.
masthead = "An independent guide to town government in Londonderry, New Hampshire"
# Public contact address. Shown on the About and Accessibility pages when set.
contact_email = "londonderry-nh@publick.org"
user_agent = "londonderry-nh.publick.org (+https://londonderry-nh.publick.org/about/)"

# From the town website's stylesheets (www.londonderrynh.gov): its two most
# used blues (74 and 22 uses); the most used of another hue (35 uses); primary
# darkened from #0098d4 (2.9 to 1 on the site's lightest background) to pass;
# primary_soft a light tint of primary. Each passes WCAG AA on white (5.2,
# 17.8, 5.2 to 1).
# To fill in: check the colors against the town's website.
[site.colors]
primary = "#0074a1"
primary_dark = "#021735"
primary_soft = "#e6f1f6"
accent = "#d2242a"

[town]
name = "Londonderry"
state_abbr = "NH"
official_site = "https://www.londonderrynh.gov"

# Sections appear in the main navigation in this order. Each one is a folder
# under site/pages/<slug>/ and is served at https://<domain>/<slug>/.
[[sections]]
slug = "meetings"
title = "Meetings"
summary = "Every board and committee meeting on the town calendar and in its Agenda Center, with agendas, and minutes from January 2026 on."
status = "live"

[[sections]]
slug = "schools"
title = "Schools"
summary = "Derry Cooperative School District's state test results and cost per pupil, and Pinkerton Academy's graduation rate, with the state's."
status = "live"

[[sections]]
slug = "budget"
title = "Town budget"
nav = "Budget"
summary = "The town's property tax rate and where the tax goes, what it raises per resident, and the average single-family tax bill."
status = "live"

[[sections]]
slug = "housing"
title = "Housing"
summary = "New homes permitted, home values and rents, and the housing stock."
status = "live"

# To fill in: the Officials page's section (below, commented out), once
#   [officials] is filled in.
# [[sections]]
# slug = "officials"
# title = "Who represents you"
# nav = "Officials"
# summary = "The mayor, Town Council, and School Committee, by office and by ward, and how to reach them."
# status = "live"

[[sections]]
slug = "about"
title = "About"
summary = "Data sources, update schedule, metric definitions, and corrections."
status = "live"

# Page view counting with GoatCounter, on the network's site; prefix is this
# town's folder.
[analytics]
prefix = "londonderry-nh"

# Public meetings, from the town calendar and its Agenda Center.
[meetings]
base_url = "https://www.londonderrynh.gov"
archive_url = "https://www.londonderrynh.gov/AgendaCenter"
archive_name = "town's Agenda Center"
governing_body = "Town Council"
# The town's site resets some connections (4 of the helper's); a slower pace
# and the client's retries help.
request_delay = 5.0
max_event_pages = 40

# The town calendar, read month by month: the meetings the town lists before
# their agendas are posted, with their times and places. Read: the calendars
# whose events, over the last three months and the next three, were mostly
# meetings, and Elections, with meetings of the town's boards among its other
# events. Not read: Cemetery Trustees, Community Events, DPW Working Group,
# Engineering & Environmental Services, Fire Department, Main Calendar, Master
# Plan Steering Committee, Municipal Records Committee, Permits Issued,
# Pettengill Road TIF District Advisory Board, Recreation, School District
# Offices Working Group, Senior Center, Town Clerk / Tax Collector, Town
# Events, Town Meetings, Trustees of the Trust Funds.
[meetings.civicplus]
calendars = ["Arts Council", "Beautify Londonderry", "Budget Committee", "CIP Committee", "Conservation Commission", "Elections", "Heritage / Historic District Commission", "Housing & Redevelopment Authority", "Leach Library Trustees", "Old Home Day", "Planning Board", "Recreation Commission", "Senior Resources Committee", "Town Council", "Traffic Safety Committee", "Utilities Committee", "Zoning Board of Adjustment"]
# Some of their events aren't meetings: only titles naming a board are kept.
include_pattern = '\b(boards?|commissions?|committees?|subcommittees?|councils?|authority|trustees|ZBA|task force)\b'
# To fill in: include_pattern leaves out these meetings, which a board's name
#   in it can bring back: "Beautify Londonderry Meeting"; "School District
#   Fiscal Year 2028 Budget Meeting".
# To fill in: include_pattern keeps these from Elections; an exclude_pattern
#   can leave out any that aren't a board's meetings: "Board of Elections
#   Meeting".
# A meeting on the calendar and in the Agenda Center is shown once.
# To fill in: check the calendars read, and any left out that list meetings.

[meetings.aliases]
# To fill in: board names the engine doesn't fix itself: a calendar meeting
#   next to an Agenda Center one of the same day, not shown as one, needs an
#   alias (python -m pipeline.listings, in the report).

[meetings.agenda_center]
base_url = "https://www.londonderrynh.gov"
# The first run lists meetings from here, and minutes are collected from here
# on.
since = "2026-01-01"

# To fill in: [meetings.agenda_center.committees."<category>"]: committees and
#   other bodies posted under another's category, each by a phrase in its
#   titles: under "Leach Library Trustees", "Leach Library Trustees Bylaws
#   Committee Meeting", "Leach Library Personnel Policy Subcommittee Meeting",
#   "Leach Library Trustees Financial Ad Hoc Committee Meeting"; under
#   "Utilities Committee", "Utilities Committee Water Subcommittee Agenda",
#   "Utilities Committee Energy Subcommittee Agenda", "Utilities Committee
#   Sewer & Solid Waste Subcommittee Agenda"; under "Old Home Day Committee",
#   "Old Home Day Board of Directors Meeting Agenda", "Old Home Day Board of
#   Directors Meeting Materials", "Old Home Day Board of Directors Regular
#   Meeting Agenda"; under "Town Council", "Town Council / Leach Library
#   Trustees Joint Meeting Agenda".

# To fill in: the School Committee's meetings: where the district posts them
#   ([ical_meetings], [page_meetings], [finalsite_meetings], [drive_meetings],
#   [diligent_meetings], [boardbook_meetings], [opengov_meetings]), named in
#   the Meetings section's summary and in [freshness] sources; a platform the
#   engine doesn't read is left out and said so (ADDING-A-TOWN.md, step 1).

# Agenda and minutes PDFs live in the network's documents bucket, not in git
# (see pipeline/documents.py). Keys: STORAGE_ACCESS_KEY_ID,
# STORAGE_SECRET_ACCESS_KEY.
[storage]
prefix = "londonderry-nh"

# Plain-English agenda text and previews, and decisions from minutes, written
# by a language model and labeled as AI-generated on the site. Only meetings
# from `since` on are summarized, about three months before launch, so the
# town's history doesn't take the month's budget.
[summaries]
since = "2026-08-01"

# To fill in: how residents can take part, per board ([participation."Town
#   Council"], [participation."School Committee"]): comment, source_title,
#   source_url, video_title, video_url, each from the board's own rules or
#   agendas.
# To fill in: [[glossary]], terms that come up in this city's agendas and mean
#   something of its own here, each from an official page. The state's and the
#   network's terms are in its glossary already: non-public session, ought to
#   pass, RSA, ZBA, abatement, ADA, CBA, CDBG, CIP, COLA, Committee of the
#   Whole, consent agenda, first reading, mill rate, quitclaim deed, receive
#   and file, Select Board, tabled, TIF, town meeting, variance, warrant
#   article.

# Schools: the New Hampshire Department of Education's statewide figures.
[schools]
doe_district = "Londonderry"
district_name = "Londonderry School District"

# Tax rate, property tax, and the average single-family tax bill
# (pipeline/states/nh/), from the New Hampshire DRA's tax rates in the
# engine's yearly statewide figures and NH GRANIT's parcel map.
[finance]
dra_municipality = "Londonderry"
# To fill in: budget_documents_url, the page where the town posts its own
#   budget books, which the budget page links (leave it out if there's none).

# Housing: Census building permits (state and place FIPS codes), American
# Community Survey through Census Reporter (geo ids).
[housing]
bps_mcd = "43220"
census_geo = "06000US3301543220"

# Unemployment rate (BLS Local Area Unemployment Statistics, area
# CS3343220000000, Londonderry town, NH). City rates are not seasonally
# adjusted; the state series is shown for context.
[labor]
local_series = "LAUCS334322000000003"

# How often each data source should update. Figures published monthly or
# yearly are judged by the engine, by the period they cover
# (pipeline/rhythms.py).
[freshness]
sources = [
  { label = "Meetings (Agenda Center)", file = "meetings/status.json", max_days = 2 },
]

# To fill in: [seeclickfix], with the city's organization ID, once a person
#   has confirmed the city uses it (the issues listing needs a login now; the
#   Open311 listing at seeclickfix.com/open311/v2/<id>/services.json names its
#   request types), and the 311 section and its [freshness] sources (with 311
#   the tagline can say "responds, decides, and spends", as Gloucester's,
#   Malden's, and Methuen's do); or, if the city takes requests some other
#   way, [absences] 311 saying so. SeeClickFix's places: Londonderry, place
#   13782 (https://seeclickfix.com/londonderry).

# Who represents you (the Officials page). Kept by hand from official city and
