# Site configuration for Biddeford, Maine. Everything town-specific lives
# here; the code is the Publick engine
# (github.com/publick-org/publick-engine).
#
# Biddeford's website runs on CivicPlus. Its boards post their meetings,
# agendas, and minutes on the city's CivicClerk portal
# (biddefordme.portal.civicclerk.com), read as [meetings.civicclerk], as
# Portland's are: the City Council, its committees, and the city's boards and
# commissions. The council's minutes are text PDFs. The city's Main Calendar
# lists the same meetings, often before their agendas are posted, and is read
# with it ([meetings.civicplus]); a meeting in both is shown once. The School
# Committee posted its agendas on the portal ("School Committee") until June
# 2026; since then the school department posts them as Google Docs linked
# from its own website (biddefordschools.me, on Apptegy), which the engine
# doesn't read, so its later meetings aren't listed. The city doesn't use
# SeeClickFix (its place there has a handful of requests, the newest from
# 2017, none answered): residents reach departments through forms on the
# city's website, so the site has no 311 section ([absences]). The engine's
# Maine package gives the tax rate and what the property tax raises, from
# Maine Revenue Services ([finance]), and school figures, from the Department
# of Education's ESSA Dashboard ([schools]); housing and unemployment come
# from the Census and BLS, as for every town.
#
# The site is in English and Spanish ([site] languages), as every town's is.
# The first runs draft the Spanish for the town's own text; [strings.es], at
# the end, can correct it.

[site]
name = "Biddeford Publick"
# The masthead shows name_prefix in dark ink and name_suffix in the accent
# color: the town, then the network.
name_prefix = "Biddeford "
domain = "biddeford-me.publick.org"
tagline = "Public data on how Biddeford, Maine decides and spends. Updated daily."
# One line under the name at the top of every page.
masthead = "An independent guide to city government in Biddeford, Maine"
# Public contact address. Shown on the About and Accessibility pages when set.
contact_email = "biddeford-me@publick.org"
user_agent = "biddeford-me.publick.org (+https://biddeford-me.publick.org/about/)"

# From the city website's stylesheets (www.biddefordmaine.org): its brick red
# (51 uses: headings, buttons, and backgrounds), a darker shade of it, a light
# tint of it, and its navy (44 uses: links and banners). Each passes WCAG AA on
# white: 8.1, 15.1 and 8.8 to 1. Its most used color, the bright blue
# (#0098f7, 54 uses, 3.1 to 1), doesn't, so it isn't used.
[site.colors]
primary = "#89342d"
primary_dark = "#431916"
primary_soft = "#f3ebea"
accent = "#224c78"

[town]
name = "Biddeford"
state_abbr = "ME"
official_site = "https://www.biddefordmaine.org"

# Sections appear in the main navigation in this order. Each one is a folder
# under site/pages/<slug>/ and is served at https://<domain>/<slug>/.
[[sections]]
slug = "meetings"
title = "Meetings"
summary = "When the City Council, its committees, and the city's boards and commissions meet, with agendas, and minutes from January 2026 on."
status = "live"

[[sections]]
slug = "budget"
title = "City budget"
nav = "Budget"
summary = "The city's tax rate and what the property tax raises, compared with Maine's other towns."
status = "live"

[[sections]]
slug = "schools"
title = "Schools"
summary = "Biddeford Schools' graduation rate, absenteeism, state test results, and spending per pupil, with the state's."
status = "live"

[[sections]]
slug = "housing"
title = "Housing"
summary = "New homes permitted, home values and rents, and the housing stock."
status = "live"

[[sections]]
slug = "officials"
title = "Who represents you"
nav = "Officials"
summary = "The mayor, City Council, and School Committee, by office and by ward, and how to reach them."
status = "live"

[[sections]]
slug = "about"
title = "About"
summary = "Data sources, update schedule, metric definitions, and corrections."
status = "live"

# Page view counting with GoatCounter, on the network's site; prefix is this
# town's folder.
[analytics]
prefix = "biddeford-me"

# Public meetings, from the city calendar and its CivicClerk portal.
[meetings]
base_url = "https://www.biddefordmaine.org"
archive_url = "https://biddefordme.portal.civicclerk.com"
archive_name = "city's CivicClerk portal"
governing_body = "City Council"
# The city's site resets some connections; a slower pace and the client's
# retries help.
request_delay = 5.0
max_event_pages = 40

# The city calendar, read month by month: the meetings the city lists before
# their agendas are posted, with their times and places. The site has two
# calendars: the Main Calendar, with the boards' meetings among other events,
# and Parking Communications (parking bans), which isn't read.
[meetings.civicplus]
calendars = ["Main Calendar"]
# Some of its events aren't meetings: only titles naming a board are kept.
# "Committeee" is how the calendar spells the Capital Projects / Operations
# Committee's meetings.
include_pattern = '\b(boards?|commissions?|committees?|committeee|subcommittees?|councils?|authority|trustees|ZBA|task force)\b'

[meetings.aliases]
# Other names the calendar's and the portal's titles use for a board, as the
# board's own page on the city's website names it.
"Cable TV Committee" = "Cable Television Committee"
"Capital Projects / Operations Committeee" = "Capital Projects / Operations Committee"
"Shellfish Conservation Commission" = "Shellfish Conservation Committee"
"Recycling and Solid Waste Management Commission" = "Recycling and Waste Management Commission"
"Joint Biddeford- Saco Committee" = "Joint Biddeford-Saco Committee"
"Historic Preservation" = "Historic Preservation Commission"
# Cancelled meetings, titled "... Meeting-THIS MEETING HAS BEEN CANCELLED".
"Historic Preservation Commission Meeting-THIS MEETING HAS BEEN" = "Historic Preservation Commission"
"Downtown Development Commission Meeting-THIS MEETING HAS BEEN" = "Downtown Development Commission"
# The council's site walk and its public input session on the city manager
# search, filed on the portal under the City Council.
"City Council -Site Walk" = "City Council"
"City Manager Search" = "City Council"

[meetings.civicclerk]
api_url = "https://biddefordme.api.civicclerk.com/v1"
portal_url = "https://biddefordme.portal.civicclerk.com"
# Meetings, agendas, and minutes are collected from here on. The council
# elected on November 4, 2025 was sworn in on December 2, 2025.
since = "2026-01-01"
# Most of the portal's meetings are under a catch-all category, and some are
# named for an item, not a board: those go under the board their category
# names.
board_from_category = true

# Agenda and minutes PDFs live in the network's documents bucket, not in git
# (see pipeline/documents.py).
[storage]
prefix = "biddeford-me"

# Plain-English agenda text and previews, and decisions from minutes, written
# by a language model and labeled as AI-generated on the site. Only meetings
# from `since` on are summarized, about three months before launch, so the
# town's history doesn't take the month's budget.
[summaries]
since = "2026-08-01"

# How residents can take part, per board, shown on its meeting pages. Only
# what the city or the school department has published; each entry names its
# source. The council's meetings are streamed and recorded on the city's
# CivicClerk portal ("Meeting Videos, Agendas and Minutes", on the council's
# page).
[participation."City Council"]
comment = "Anyone may speak on an agenda item at its public hearing, or at its first or second reading, after the item is introduced and before the Council deliberates. On city business not on the agenda, anyone may speak in the Public Addressing the Council periods: at the start of the meeting for up to three minutes, and at the end for up to five. Speakers give their name and address; online, they use Teams' raise-hand feature."
source_title = "Participating in City Council Meetings"
source_url = "https://www.biddefordmaine.org/3290/Participating-in-City-Council-Meetings"
video_title = "the city's CivicClerk portal"
video_url = "https://biddefordme.portal.civicclerk.com/?category_id=26"

# From the committee's agendas, which end with a Public Participation period
# ("3 minutes; any item").
[participation."School Committee"]
comment = "Anyone may speak for up to three minutes, on any item, during the Public Participation period near the end of each meeting."
source_title = "School Committee agenda of October 28, 2026"
source_url = "https://docs.google.com/document/d/1lA_EpH9qo9-XJoEysqT0PGIMdv4tPGzS3yRS4JudaAI/edit?usp=sharing"

# Terms that come up on agendas and minutes, explained on each meeting page
# where they appear. Acronyms match exactly; other terms ignore case. An entry
# with bodies is shown only on those boards' meetings. From the city's
# Participating in City Council Meetings page.
[[glossary]]
term = "Public Addressing the Council"
bodies = ["City Council"]
definition = "The two periods, at the start and the end of each City Council meeting, when anyone may speak to the Council on city business that isn't on the agenda: 15 minutes at the start, three minutes a speaker, and at the end five minutes a speaker."

# Schools: the Department of Education's ESSA Dashboard, where the district is
# "Biddeford Public Schools"; the district calls itself Biddeford Schools on
# its website (biddefordschools.me).
[schools]
doe_district = "Biddeford Public Schools"
district_name = "Biddeford Schools"

# Tax rate, property tax, and the city's budget (pipeline/states/me/), from
# Maine Revenue Services' figures, where the city is "BIDDEFORD". The city's
# own budget books are on its Budget Information page, a page for each fiscal
# year's documents.
[finance]
mrs_municipality = "Biddeford"
budget_documents_url = "https://www.biddefordmaine.org/2361/Budget-Information"
# No average single-family tax bill: the town's rows in the Maine GeoLibrary
# parcel table (GEOCODE 31050) all have land use "0", so its homes can't be
# picked out, and the tax bill's keys (megis_geocode, single_family_use) are
# left out.

# Housing: Census building permits (state and place FIPS codes), American
# Community Survey through Census Reporter (geo ids). Biddeford is a Census
# place, Biddeford city (23-04860).
[housing]
bps_place = "04860"
census_geo = "16000US2304860"

# Unemployment rate (BLS Local Area Unemployment Statistics, area
# CT2304860000000, Biddeford city, ME). City rates are not seasonally
# adjusted; the state series is shown for context.
[labor]
local_series = "LAUCT230486000000003"

# How often each data source should update. Figures published monthly or
# yearly are judged by the engine, by the period they cover
# (pipeline/rhythms.py).
[freshness]
sources = [
  { label = "Meetings (CivicClerk)", file = "meetings/status.json", max_days = 2 },
]

# The city takes requests and comments through forms on its website (its
# Service Request / Comment page), which publish nothing.
[absences]
311 = "The city takes requests and comments through forms on its own website, which have no public data."

# Who represents you (the Officials page). Kept by hand from official city and
# school websites and records; checked is the date the list was last checked
# against them. Only city- and school-issued email addresses, and the mayor's
# office phone. Seven of the council's seats are elected by ward; the mayor,
# the two at-large councilors and the School Committee are elected citywide.
# The ward file is data/static/biddeford-wards-2021.geojson: the seven wards
# of the city's 2021 reapportionment, from its GIS ("Biddeford City Council
# Wards", on its GIS Data Catalog page), with 2020 population from the census
# blocks inside each ward (22,552 in all, the city's 2020 count). The mayor,
# the council and the School Committee are elected together every two years,
# in odd years (the City Clerk's election results), and sworn in on the first
# Tuesday after the first Monday in December (the council's Wards &
# Composition page and the mayor's page); a Ward 4 councilor appointed in
# 2026 serves "for a term to expire December 7, 2027" (Order 2026.125).
[officials]
checked = "2026-11-01"
# The next regular municipal election: Tuesday, November 2, 2027, the first
# Tuesday after the first Monday in November of the next odd year, as were
# those of November 4, 2025 and November 7, 2023 (the City Clerk's results).
# The election of November 3, 2026 is for state and county offices and a
# county question only (the City Clerk's Election Information page). Up in
# 2027: the mayor, every council seat and every School Committee seat.
next_election = "2027-11-02"
wards_file = "biddeford-wards-2021.geojson"
wards_publisher = "the City of Biddeford"
wards_year = 2021
wards_url = "https://services5.arcgis.com/QWn8PC1cSwbsBBh6/arcgis/rest/services/Wards/FeatureServer/0"

# Elected on November 4, 2025 (the City Clerk's certified results), sworn in
# on December 2, 2025 (the mayor's page). The mayor also chairs the School
# Committee.
[[officials.bodies]]
name = "Mayor"
url = "https://www.biddefordmaine.org/2276/Office-of-the-Mayor"
note = "Elected citywide for two years."
members = [
  { name = "Liam LaFountain", seat = "Citywide", term_ends = "2027-12", email = "liam.lafountain@biddefordmaine.org", phone = "(207) 286-9385" },
]

# Names and seats from the council's page and each councilor's page,
# confirmed against the City Clerk's certified results of November 4, 2025
# (Abigail Woods is "Cioffi-Woods, Abigail" and Jake Pierson "Pierson, Jacob"
# on them) and the roll call of the council's minutes of March 17, 2026. The
# council elected Councilor Beaupre its president on December 16, 2025 (its
# minutes). The councilor elected for Ward 4 in 2025 left the seat; the mayor
# appointed Jessica Muise on September 1, 2026 to complete the term (Order
# 2026.125), and the council's page lists her.
[[officials.bodies]]
name = "City Council"
url = "https://www.biddefordmaine.org/2437/City-Council"
note = "Nine councilors: seven elected by ward and two at-large, for two years. The council elects one of its members as its president."
members = [
  { name = "Patricia Boston", seat = "Ward 1", ward = 1, term_ends = "2027-12", email = "patricia.boston@biddefordmaine.org", url = "https://www.biddefordmaine.org/2937/Patricia-Boston-Ward-1" },
  { name = "Abigail Woods", seat = "Ward 2", ward = 2, term_ends = "2027-12", email = "abigail.woods@biddefordmaine.org", url = "https://www.biddefordmaine.org/3251/Abigail-Woods-Ward-2" },
  { name = "Roger P. Beaupre", seat = "Ward 3", ward = 3, role = "Council President", term_ends = "2027-12", email = "rogerp.beaupre@biddefordmaine.org", url = "https://www.biddefordmaine.org/3252/Roger-P-Beaupre-Ward-3" },
  { name = "Jessica Muise", seat = "Ward 4", ward = 4, role = "Appointed September 2026 to fill a vacancy", term_ends = "2027-12", email = "jessica.muise@biddefordmaine.org", url = "https://www.biddefordmaine.org/3253/Jessica-Muise-Ward-4" },
  { name = "David Kurtz", seat = "Ward 5", ward = 5, term_ends = "2027-12", email = "david.kurtz@biddefordmaine.org", url = "https://www.biddefordmaine.org/2450/David-Kurtz-Ward-5" },
  { name = "Jake Pierson", seat = "Ward 6", ward = 6, term_ends = "2027-12", email = "jacob.pierson@biddefordmaine.org", url = "https://www.biddefordmaine.org/2451/Jake-Pierson-Ward-6" },
  { name = "Brad Cote", seat = "Ward 7", ward = 7, term_ends = "2027-12", email = "brad.cote@biddefordmaine.org", url = "https://www.biddefordmaine.org/3254/Brad-Cote-Ward-7" },
  { name = "Marc Lessard", seat = "At-large", term_ends = "2027-12", email = "marc.lessard@biddefordmaine.org", url = "https://www.biddefordmaine.org/2464/Marc-Lessard-Councilor-At-Large" },
  { name = "Lisa Vadnais", seat = "At-large", term_ends = "2027-12", email = "lisa.vadnais@biddefordmaine.org", url = "https://www.biddefordmaine.org/2936/Lisa-Vadnais-Councilor-At-Large" },
