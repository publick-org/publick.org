  { name = "Marie Potvin", seat = "At-large", role = "Vice Chair", email = "mpotvin@biddefordschools.me" },
  { name = "Amy Clearwater", seat = "At-large", email = "aclearwater@biddefordschools.me" },
  { name = "Patsy Gendron", seat = "At-large", role = "Appointed September 2026 to fill a vacancy", email = "pgendron@biddefordschools.me" },
  { name = "Emily Henley", seat = "At-large", email = "ehenley@biddefordschools.me" },
  { name = "Michele Landry", seat = "At-large", email = "michele.landry@biddefordschools.me" },
  { name = "Karen Ruel", seat = "At-large", email = "kruel@biddefordschools.me" },
  { name = "Timothy Stebbins", seat = "At-large", email = "tstebbins@biddefordschools.me" },
]
