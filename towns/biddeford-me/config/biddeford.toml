# From the school department's School Committee page (members, officers, and
# school-issued email addresses) and the members listed on the committee's
# agenda of October 28, 2026, confirmed against the City Clerk's certified
# results of November 4, 2025, when all seven seats were on the ballot. Meagan
# Desjardins, elected then, resigned in August 2026 (the committee's agenda of
# August 12, 2026); the committee filled the seat on September 9, 2026 (its
# agenda), and Patsy Gendron is listed from its agenda of September 23, 2026.
# No page the city or the school department publishes gives the members'
# terms, so term_ends is left out.
[[officials.bodies]]
name = "School Committee"
url = "https://www.biddefordschools.me/o/biddeford/page/members"
note = "Seven members elected at-large, and the mayor as chair."
members = [
