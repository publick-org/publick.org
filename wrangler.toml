# The Worker that serves publick.org and every town's site from the sites
# bucket. Its code is the engine's worker/index.js, at the version in
# engine-version; .github/workflows/worker.yml checks it out and deploys.
name = "publick-sites"
main = ".publick-engine/worker/index.js"
compatibility_date = "2026-08-01"
workers_dev = false

# Every town is <town>-<state>.publick.org, plus the bare publick.org.
# Other hostnames on the zone that must not reach this Worker (files.publick.org,
# the documents bucket) need a route with no Worker (Workers Routes, Worker: None).
routes = [
  { pattern = "publick.org/*", zone_name = "publick.org" },
  { pattern = "*.publick.org/*", zone_name = "publick.org" },
]

[[r2_buckets]]
binding = "SITES"
bucket_name = "publick-sites"

# How often one IP address, and one email address, may use the weekly digest's
# signup form (the engine's worker/digest.js, withinLimits): 4 a minute each,
# counted in each Cloudflare location. Over it, the form says it didn't go
# through and nothing reaches Buttondown. namespace_id is any number unique
# to the account.
[[ratelimits]]
name = "SIGNUP_LIMITER"
namespace_id = "1001"
simple = { limit = 4, period = 60 }

# Address alerts (the engine's worker/alerts.js): a town with [alerts] follow = true has a follow form
# on its street lookup, which this Worker answers. ALERTS_DB keeps each follow (schema in the engine's
# worker/alerts.sql, applied once with wrangler d1 execute). Emails go through Postmark, from each site's
# name at ALERTS_FROM, a domain verified there. The Worker's secrets POSTMARK_TOKEN, ALERTS_HOOK_SECRET
# and ALERTS_TOKEN_SECRET are set by .github/workflows/worker.yml from the repository secrets of the
# same names. ALERTS_MAILING_ADDRESS, the postal address in each email's footer, goes in [vars] once
# there is one.
[[d1_databases]]
binding = "ALERTS_DB"
database_name = "publick-alerts"
database_id = "bc188b4b-f1de-42b6-a1a3-d3a449652171"

[vars]
ALERTS_FROM = "alerts@alerts.publick.org"
